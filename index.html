<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0D0E11">
<meta name="description" content="Pick an artist, fill out a song-vs-song bracket, then compare everyone's picks.">
<title>Track Bracket</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%230D0E11'/%3E%3Cg fill='none' stroke='%23F2F0EA' stroke-width='2.4' stroke-linecap='square'%3E%3Cpath d='M5 7h6v8h5M5 23h6v-8'/%3E%3Cpath d='M27 7h-6v8h-5M27 23h-6v-8'/%3E%3C/g%3E%3Crect x='13' y='12.5' width='6' height='5' fill='%23C6F432'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;800;900&family=Onest:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
/* Layout: one centered column (max 1200px). Dark by default; the host's data-theme="light" switches to the light tokens.
   Album colors carry the look; one lime accent marks actions and progress. */
:root{
  --bg:#0D0E11; --surface:#16181D; --surface-2:#1F2229; --well:#0D0E11; --tree:#121418;
  --ink:#F2F0EA; --muted:#A2A8B3; --line:#2C3038; --line-2:#3A3F49; --track:#2A2E37;
  --accent:#C6F432; --accent-ink:#0D0E11; --accent-fg:#C6F432; --fill:#C6F432; --fill-ink:#0D0E11;
  --good:#6FE3A0; --warn:#F2B84B; --danger:#FF8A96; --connector:#3A3F49; --ring:rgba(255,255,255,.14);
  --display:"Big Shoulders Display","Arial Narrow",Impact,sans-serif;
  --body:"Onest",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  --tabbar:0px;
  color-scheme:dark;
}
:root[data-theme="light"]{
  --bg:#F3F2EE; --surface:#FFFFFF; --surface-2:#ECEBE6; --well:#F3F2EE; --tree:#FAFAF8;
  --ink:#14151A; --muted:#5D636F; --line:#DAD9D3; --line-2:#C5C4BD; --track:#E3E2DC;
  --accent:#C6F432; --accent-ink:#14151A; --accent-fg:#3F6212; --fill:#4D7C0F; --fill-ink:#FFFFFF;
  --good:#1D7A45; --warn:#9A5B0F; --danger:#B4233C; --connector:#B9B8B1; --ring:rgba(0,0,0,.14);
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{background:var(--bg)}
body{margin:0;color:var(--ink);font:400 15px/1.5 var(--body);-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--accent-fg)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.ic{width:18px;height:18px;flex:none}
.ic.sm{width:14px;height:14px}
.ic.lg{width:22px;height:22px}
.wrap{max-width:1200px;margin:0 auto;padding-inline:24px;padding-block:0 calc(72px + var(--tabbar))}
.wrap.wide{max-width:1440px}
@media (max-width:520px){.wrap{padding-inline:16px}}

/* top bar */
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:14px;border-bottom:1px solid var(--line);margin-inline:-24px;padding-inline:24px}
@media (max-width:520px){.top{margin-inline:-16px;padding-inline:16px}}
.brand{display:flex;align-items:center;gap:10px;background:none;border:0;padding:0;min-height:44px;cursor:pointer;font:800 22px/1 var(--display);text-transform:uppercase;letter-spacing:.04em}
.brand svg{width:26px;height:26px;flex:none}
.me{display:flex;align-items:center;gap:10px;font-size:14px;font-weight:500;color:var(--muted);min-width:0}
.me span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.av{width:24px;height:24px;border-radius:50%;flex:none;object-fit:cover;background:var(--track);display:inline-grid;place-items:center;font:700 11px var(--body);color:var(--ink)}
.me .av{width:32px;height:32px;font-size:13px}
.avs{display:flex}
.avs .av{box-shadow:0 0 0 2px var(--surface);margin-left:-6px}
.avs .av:first-child{margin-left:0}

/* shared bits */
.eyebrow{font:600 12px/1 var(--body);text-transform:uppercase;letter-spacing:.14em;color:var(--muted);margin:0 0 12px}
.hint{color:var(--muted);font-size:14px;margin:0;max-width:62ch}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid var(--line);background:transparent;border-radius:10px;padding:0 16px;min-height:44px;font-weight:600;font-size:14px;cursor:pointer;text-decoration:none;white-space:nowrap;color:var(--ink)}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:700}
.btn.primary:hover{filter:brightness(1.06)}
.btn.danger{color:var(--danger);border-color:color-mix(in srgb,var(--danger) 45%,var(--line))}
.btn:disabled{opacity:.45;cursor:not-allowed;filter:none}
.btn.sm{min-height:36px;padding:0 12px;font-size:13px}
.btn.lg{min-height:54px;font-size:16px;border-radius:12px}
.btn.block{width:100%}
.iconbtn{width:40px;height:40px;flex:none;display:grid;place-items:center;border:1px solid var(--line);border-radius:10px;background:none;color:var(--ink);cursor:pointer}
.iconbtn:hover{border-color:var(--muted)}
.linkbtn{background:none;border:0;padding:0;min-height:44px;color:var(--ink);font-weight:600;font-size:14px;text-decoration:underline;text-underline-offset:4px;cursor:pointer}
.linkbtn:hover{color:var(--accent-fg)}
.back{display:inline-flex;align-items:center;gap:8px;background:none;border:0;padding:0;min-height:44px;color:var(--muted);font-weight:600;font-size:14px;cursor:pointer}
.back:hover{color:var(--ink)}
.seg{display:inline-flex;gap:4px;background:var(--well);border:1px solid var(--line);border-radius:12px;padding:4px}
.seg button{border:0;border-radius:8px;background:none;padding:0 14px;min-height:36px;font:600 14px var(--mono);cursor:pointer;color:var(--muted)}
.seg button:hover{color:var(--ink)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.seg.words button{font-family:var(--body)}
.notice{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:12px 16px;font-size:14px;color:var(--muted);margin-top:20px}
.notice b{color:var(--ink)}
.chip{display:inline-flex;align-items:center;gap:8px;font-size:13px;font-weight:600;padding:0 12px 0 8px;min-height:32px;border-radius:999px;background:transparent;border:1px solid var(--line);white-space:nowrap;color:var(--ink)}
.chip .n{font:500 12px var(--mono);color:var(--muted)}
.sw{width:12px;height:12px;border-radius:3px;background:var(--al);box-shadow:inset 0 0 0 1px var(--ring);flex:none;display:inline-block}
input[type=text],textarea,select{background:var(--well);border:1px solid var(--line);border-radius:10px;padding:0 12px;min-height:44px;min-width:0;color:var(--ink)}
textarea{padding:10px 12px}
input[type=text]:focus,textarea:focus,select:focus{outline:2px solid var(--accent);outline-offset:-1px;border-color:transparent}
.card-box{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:20px}
.h2{font:800 30px/1 var(--display);text-transform:uppercase;letter-spacing:.02em;margin:0}
.h3{font:800 24px/1 var(--display);text-transform:uppercase;letter-spacing:.02em;margin:0}
.sec-top{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:8px 16px;margin-bottom:14px}
.sec-top .hint{font-size:13px}
.meter{height:6px;border-radius:99px;background:var(--track);overflow:hidden}
.meter i{display:block;height:100%;border-radius:99px;background:var(--fill);transition:width .3s}
.kbd{font:600 12px var(--mono);border:1px solid var(--line-2);border-bottom-width:2px;border-radius:5px;padding:1px 6px;color:var(--ink)}

/* home */
.hero{padding-block:56px 48px;border-bottom:1px solid var(--line);display:flex;flex-wrap:wrap;gap:40px 48px;align-items:flex-end}
.hero-main{flex:999 1 560px;min-width:0}
.hero-h{font:900 clamp(52px,8vw,104px)/.86 var(--display);text-transform:uppercase;margin:0 0 32px;text-wrap:balance;max-width:12ch}
.hero-h em{font-style:normal;color:var(--accent-fg)}
.composer{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:10px;display:flex;flex-wrap:wrap;gap:10px;align-items:stretch;max-width:820px}
.composer .field{flex:1 1 260px;min-width:0;display:flex;align-items:center;gap:12px;padding:0 14px;background:var(--well);border-radius:10px;min-height:60px;cursor:text;color:var(--muted)}
.composer .field input{flex:1;min-width:0;background:none;border:0;outline:none;padding:0;min-height:0;font:500 20px var(--body);color:var(--ink)}
.composer .field:focus-within{outline:2px solid var(--accent);outline-offset:-2px}
.composer .seg{border:0;border-radius:10px;background:var(--well)}
.composer .seg button{display:grid;gap:1px;text-align:center;min-width:76px;padding:6px 12px}
.composer .seg button b{font:600 17px var(--mono)}
.composer .seg button small{font:500 11px var(--body)}
.composer .go{flex:0 1 auto;min-height:60px;padding:0 26px;font-size:16px;border-radius:10px}
@media (max-width:640px){.composer .field{flex-basis:100%;min-height:54px}.composer .seg{flex:1 1 auto}.composer .seg button{flex:1;min-width:0}.composer .go{flex:1 1 100%;min-height:54px}}
.hero-foot{display:flex;flex-wrap:wrap;gap:4px 16px;align-items:center;margin-top:10px}
.paste{display:grid;gap:8px;margin-top:12px;max-width:820px}
.paste textarea{min-height:160px;font:13px/1.5 var(--mono);resize:vertical}
.steps{flex:1 1 280px;list-style:none;margin:0;padding:0}
.steps li{display:grid;grid-template-columns:40px 1fr;gap:12px;padding:14px 0;border-top:1px solid var(--line)}
.steps li:last-child{border-bottom:1px solid var(--line)}
.steps .no{font:600 13px var(--mono);color:var(--accent-fg)}
.steps b{display:block;font-weight:600}
.steps span span{color:var(--muted);font-size:14px}
.home-list{padding-top:40px}
.home-list .sec-top{align-items:center;margin-bottom:20px}
.filters{display:flex;gap:6px;flex-wrap:wrap}
.filters button{border:1px solid var(--line);background:none;color:var(--ink);border-radius:999px;padding:0 16px;min-height:40px;font:600 14px var(--body);cursor:pointer;display:inline-flex;align-items:center;gap:6px}
.filters button span{font:500 13px var(--mono);color:var(--muted)}
.filters button[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.filters button[aria-pressed="true"] span{color:inherit;opacity:.7}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:16px}
.card{display:flex;flex-direction:column;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:16px;overflow:hidden;padding:0;cursor:pointer;color:var(--ink)}
.card:hover{border-color:var(--muted)}
.strip{display:flex;height:56px;gap:2px;padding:10px 10px 0}
.strip i{flex:var(--f);background:var(--al);border-radius:4px;box-shadow:inset 0 0 0 1px var(--ring)}
.card-body{padding:16px 18px 18px;display:flex;flex-direction:column;gap:6px;flex:1;width:100%}
.card-h{font:800 34px/.95 var(--display);text-transform:uppercase;margin:0;overflow-wrap:anywhere}
.meta{color:var(--muted);font-size:13px;margin:0}
.card-status{margin-top:auto;padding-top:14px;display:grid;gap:6px;font-size:13px}
.card-status .row{display:flex;justify-content:space-between;gap:8px}
.card-status .row b{font-weight:600}
.card-status .row span{font-family:var(--mono);color:var(--muted)}
.card-status .champ-line{display:flex;align-items:center;gap:8px;min-width:0}
.card-status .champ-line span{color:var(--muted)}
.card-status .champ-line b{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.card-foot{display:flex;align-items:center;justify-content:space-between;gap:10px;border-top:1px solid var(--line);padding-top:12px;margin-top:10px}
.card-foot .who{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted);min-width:0}
.card-foot .cta{display:flex;align-items:center;gap:4px;font-weight:700;font-size:14px;color:var(--accent-fg);white-space:nowrap}
.empty-state{border:1px dashed var(--line-2);border-radius:16px;padding:32px;color:var(--muted);text-align:center}

/* generating + lineup review */
.draft-top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;padding-top:16px}
.stepper{display:flex;align-items:center;gap:8px;list-style:none;margin:0;padding:0;font-size:13px;font-weight:600;color:var(--muted)}
.stepper li{display:flex;align-items:center;gap:8px}
.stepper .dot{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font:600 11px var(--mono);border:1px solid var(--line)}
.stepper .done .dot{background:var(--track);border-color:var(--track);color:var(--ink)}
.stepper .now{color:var(--ink)}
.stepper .now .dot{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.stepper .bar{width:28px;height:1px;background:var(--line)}
@media (max-width:520px){.stepper .lbl{display:none}.stepper .now .lbl{display:inline}}
.draft-head{padding-block:28px 28px}
.artist-h{font:900 clamp(48px,7vw,88px)/.88 var(--display);text-transform:uppercase;margin:0 0 10px;overflow-wrap:anywhere}
.draft-body{display:flex;flex-wrap:wrap;gap:32px;align-items:flex-start}
.draft-list{flex:999 1 560px;min-width:0}
.draft-side{flex:1 1 320px;min-width:0;display:grid;gap:16px;position:sticky;top:16px}
@media (max-width:900px){.draft-side{position:static}}
.legend{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px}
.lineup{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:6px}
.lu{display:grid;grid-template-columns:18px 28px 6px minmax(0,1fr) auto;gap:10px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:6px 6px 6px 8px;cursor:grab}
.lu.dragging{opacity:.4}
.lu.over{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.lu .grip{color:var(--line-2);display:grid;place-items:center}
.lu .rk{font:600 13px var(--mono);color:var(--muted);text-align:right}
.lu .rk.hi{color:var(--accent-fg)}
.lu .bar{width:6px;height:30px;border-radius:3px;background:var(--al);box-shadow:inset 0 0 0 1px var(--ring)}
.lu .tt{min-width:0}
.lu .tt b{display:block;font-weight:600;font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lu .tt small{display:block;color:var(--muted);font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lu .acts{display:flex}
.icon{width:32px;height:36px;border:0;border-radius:8px;background:none;color:var(--muted);cursor:pointer;display:grid;place-items:center}
.icon:hover{background:var(--surface-2);color:var(--ink)}
.icon:disabled{opacity:.25;cursor:default;background:none}
.side-card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:20px;display:grid;gap:18px}
.side-card .title{display:flex;align-items:center;justify-content:space-between;gap:10px}
.side-card .title .h3{font-size:22px}
.count{display:inline-flex;align-items:center;gap:6px;font:600 14px var(--mono);white-space:nowrap}
.count.ok{color:var(--good)}
.count.off{color:var(--warn)}
.field-l{font-size:13px;color:var(--muted);font-weight:600;margin:0 0 8px;padding:0}
fieldset{border:0;margin:0;padding:0;min-width:0}
.dist{display:flex;height:14px;gap:2px}
.dist i{flex:var(--f);background:var(--al);border-radius:3px;box-shadow:inset 0 0 0 1px var(--ring)}
.side-card .seg{display:grid;grid-template-columns:repeat(3,minmax(0,1fr))}
.opt{display:grid;grid-template-columns:20px 1fr;gap:10px;align-items:start;width:100%;text-align:left;padding:12px;border-radius:10px;border:1px solid var(--line);background:none;cursor:pointer;color:var(--ink)}
.opt + .opt{margin-top:8px}
.opt .radio{width:18px;height:18px;border-radius:50%;border:2px solid var(--line-2);margin-top:2px;display:grid;place-items:center}
.opt[aria-pressed="true"]{border-color:var(--accent-fg)}
.opt[aria-pressed="true"] .radio{border-color:var(--accent-fg)}
.opt[aria-pressed="true"] .radio::after{content:"";width:8px;height:8px;border-radius:50%;background:var(--accent-fg)}
.opt b{display:block;font-weight:600}
.opt span span{font-size:13px;color:var(--muted)}
.bench{display:flex;flex-wrap:wrap;gap:6px}
.bench .chip{cursor:pointer;background:var(--well);min-height:36px}
.bench .chip:hover{border-color:var(--muted)}
.add-song{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px}
.add-song select{grid-column:1}
.add-song .btn{grid-row:1 / span 2;grid-column:2;height:auto}
.gen{padding-block:48px;display:grid;gap:16px;justify-items:start}
.gen-live{font:600 15px var(--mono);color:var(--muted);margin:0;display:flex;align-items:center}
.pulse{display:inline-block;width:10px;height:10px;border-radius:50%;background:var(--accent);margin-right:10px;animation:pulse 1.2s ease-in-out infinite}
@keyframes pulse{50%{opacity:.25;transform:scale(.7)}}
.err{color:var(--danger);font-weight:600;margin:0}

/* bracket page header + tabs */
.bk-head{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;padding-top:16px}
.bk-title{display:flex;align-items:center;gap:14px;min-width:0}
.bk-title h1{font:900 clamp(30px,4vw,40px)/.95 var(--display);text-transform:uppercase;margin:0;overflow-wrap:anywhere}
.bk-title .meta{margin-top:2px}
.save{display:inline-flex;align-items:center;gap:6px;font-size:13px;color:var(--muted)}
.save .ic{color:var(--good)}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin:8px -24px 28px;padding-inline:24px;overflow-x:auto}
.tabs button{display:flex;align-items:center;gap:8px;background:none;border:0;border-bottom:3px solid transparent;padding:12px 16px 11px;font-weight:600;color:var(--muted);cursor:pointer;white-space:nowrap}
.tabs button:hover{color:var(--ink)}
.tabs button .ic{display:none}
.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
.tabs .badge{font:600 11px var(--mono);background:var(--track);color:var(--ink);border-radius:99px;padding:1px 7px}
@media (max-width:640px){
  :root{--tabbar:76px}
  .tabs{position:fixed;left:0;right:0;bottom:0;z-index:5;margin:0;padding:6px 8px calc(10px + env(safe-area-inset-bottom,0px));display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:0;background:var(--surface);border-top:1px solid var(--line);border-bottom:0}
  .tabs button{flex-direction:column;gap:2px;padding:6px 0;border:0;font-size:11px;position:relative}
  .tabs button .ic{display:block}
  .tabs button[aria-selected="true"]{color:var(--accent-fg)}
  .tabs .badge{position:absolute;top:2px;left:calc(50% + 6px);font-size:10px;padding:0 5px}
  .bk-head + .notice{margin-bottom:16px}
  .play{padding-top:16px}
}

/* pick (head to head) */
.rounds{list-style:none;margin:0 0 28px;padding:0;display:grid;grid-template-columns:repeat(var(--n),minmax(0,1fr));gap:16px}
.rounds li{display:grid;gap:6px;min-width:0}
.rounds .lbl{display:flex;justify-content:space-between;gap:6px;font-size:12px;color:var(--muted);font-weight:600}
.rounds .lbl b{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:600}
.rounds .lbl span{font-family:var(--mono);font-weight:500}
.rounds .now .lbl b{color:var(--ink);font-weight:700}
@media (max-width:640px){.rounds .lbl{display:none}.rounds{display:flex;gap:3px;margin-bottom:16px}.rounds li{flex:var(--w) 1 0}}
.play-meta{display:flex;flex-wrap:wrap;justify-content:space-between;gap:6px 16px;align-items:baseline;margin-bottom:16px}
.round-name{font:800 30px/1 var(--display);text-transform:uppercase;letter-spacing:.02em;margin:0}
.round-name span{color:var(--muted)}
.next-line{font-size:14px;color:var(--muted)}
.mono{font-family:var(--mono);font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.duel{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px;position:relative}
.vs{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:52px;height:52px;border-radius:50%;background:var(--bg);display:grid;place-items:center;font:900 20px/1 var(--display);color:var(--muted);z-index:1;pointer-events:none}

@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

<script>
(() => {
'use strict';

const PALETTE = ['#E5383B','#2F54EB','#E33FA8','#23A55A','#E0C33A','#1F2026','#F2751A','#13A4A8','#8B55E8','#9A6B45','#6E7C8C','#B8124F'];
const SIZES = [16, 32, 64];
const LS_PICKS = 'tb.v1.picks', LS_BRACKETS = 'tb.v1.brackets';

const S = {
  mode: 'connecting',            // 'shared' | 'local'
  db: null, user: null, sample: null,
  me: { id: null, name: '', avatarUrl: '', isOwner: false },
  canWrite: true, writeBlocked: false, saveState: '',
  brackets: new Map(), picks: new Map(), loadedB: false,
  mine: {}, edited: new Set(),
  prof: {}, ids: new Set(),
  view: 'home', bid: null, tab: 'play', viewing: null, playK: null, peek: {},
  form: { artist: '', size: 32, paste: '', showPaste: false },
  draft: null, gen: null, confirm: null, copyText: null, toast: null,
  backend: null,                 // 'firebase' | 'artifact' | null (this device only)
  authState: null, authErr: null, meMenu: false, fb: null, unsubs: [],
};

/* ---------- small helpers ---------- */
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));
function lsGet(k, d) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch { return d; } }
function lsSet(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} }
function inkFor(hex) {
  const h = String(hex || '#888').replace('#', '');
  const [r, g, b] = [0, 2, 4].map(i => parseInt(h.slice(i, i + 2), 16) / 255).map(c => c <= .03928 ? c / 12.92 : Math.pow((c + .055) / 1.055, 2.4));
  // pick whichever of near-black or white has more contrast against the album color
  const L = 0.2126 * r + 0.7152 * g + 0.0722 * b;
  return (L + .05) / .0559 >= 1.05 / (L + .05) ? '#111216' : '#FFFFFF';
}
const alStyle = color => `--al:${esc(color)};--al-ink:${inkFor(color)}`;
function shuffle(a) { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
function toast(msg) { S.toast = msg; render(); clearTimeout(toast.t); toast.t = setTimeout(() => { S.toast = null; render(); }, 1800); }
const spotifyUrl = (artist, t) => 'https://open.spotify.com/search/' + encodeURIComponent(`${t} ${artist}`);
const ytUrl = (artist, t) => 'https://www.youtube.com/results?search_query=' + encodeURIComponent(`${artist} ${t}`);
const appleUrl = (artist, t) => 'https://music.apple.com/us/search?term=' + encodeURIComponent(`${artist} ${t}`);

/* ---------- bracket math ----------
   Matches are numbered round by round: round r has n/2^(r+1) matches,
   match (r, i) is fed by matches (r-1, 2i) and (r-1, 2i+1). Picks are an
   array of length n-1 holding the winning slot index, or null. */
const nRounds = n => Math.round(Math.log2(n));
const off = (n, r) => { let o = 0; for (let k = 0; k < r; k++) o += n >> (k + 1); return o; };
const mCount = (n, r) => n >> (r + 1);
function entrants(n, w, r, i) {
  if (r === 0) return [2 * i, 2 * i + 1];
  const o = off(n, r - 1);
  return [w[o + 2 * i] ?? null, w[o + 2 * i + 1] ?? null];
}
function normalize(n, w) {
  const out = Array.from({ length: n - 1 }, (_, k) => (w && Number.isInteger(w[k]) && w[k] >= 0 && w[k] < n) ? w[k] : null);
  for (let r = 0; r < nRounds(n); r++) {
    const o = off(n, r);
    for (let i = 0; i < mCount(n, r); i++) {
      const [a, b] = entrants(n, out, r, i);
      const v = out[o + i];
      if (v !== null && (a === null || b === null || (v !== a && v !== b))) out[o + i] = null;
    }
  }
  return out;
}
function locate(n, k) { let r = 0; while (k >= off(n, r + 1)) r++; return [r, k - off(n, r)]; }
function roundName(n, r) {
  const left = n >> r;
  return left === 2 ? 'Final' : left === 4 ? 'Semifinals' : left === 8 ? 'Quarterfinals' : 'Round of ' + left;
}
function seedOrder(n) { let o = [1]; while (o.length < n) { const m = o.length * 2; o = o.flatMap(s => [s, m + 1 - s]); } return o; }
const picked = w => w.filter(x => x !== null).length;
const isDone = w => w.length > 0 && w.every(x => x !== null);
function playable(n, w) {
  const ks = [];
  for (let k = 0; k < n - 1; k++) { const [r, i] = locate(n, k); const [a, b] = entrants(n, w, r, i); if (a !== null && b !== null) ks.push(k); }

}

function remotePicks(uid, bid) { return S.picks.get(uid)?.b?.[bid]?.w; }
function getMine(bid) {
  const b = S.brackets.get(bid); if (!b) return [];
  if (S.edited.has(bid)) return S.mine[bid];
  const remote = S.me.id ? remotePicks(S.me.id, bid) : null;
  const local = lsGet(LS_PICKS, {})[bid];
  return normalize(b.size, remote || local || []);
}
function picksOf(uid, bid) {
  const b = S.brackets.get(bid);
  if (uid === S.me.id || uid === '__me') return getMine(bid);
  return normalize(b.size, remotePicks(uid, bid) || []);
}
function setMine(bid, w) {
  S.mine[bid] = w; S.edited.add(bid);

const dirty = new Set(); let saveTimer = null, chain = Promise.resolve(), myDocKnown = null, retries = 0;
function queueSave(bid) {
  if (S.mode !== 'shared' || !S.me.id || S.writeBlocked) return;
  dirty.add(bid); S.saveState = 'saving';
  clearTimeout(saveTimer); saveTimer = setTimeout(flush, 700);
}
function flush() {
  chain = chain.then(async () => {
    if (!dirty.size) return;
    const ids = [...dirty]; dirty.clear();
    const patch = {};
    for (const bid of ids) { const w = S.mine[bid]; if (w) patch[bid] = { w, done: isDone(w), updatedAt: Date.now() }; }
    const ref = S.db.doc('picks/' + S.me.id);
    try {
      if (myDocKnown === null) myDocKnown = S.picks.has(S.me.id) || (await ref.get()).exists;
      if (myDocKnown) await ref.update({ b: patch });
      else { await ref.set({ b: patch }); myDocKnown = true; }
      S.saveState = dirty.size ? 'saving' : 'saved'; retries = 0;
    } catch (e) {
      const code = e && e.code;
      if (['invalid_argument', 'revoked', 'not_granted', 'capability_disabled', 'capability_removed', 'quota_exceeded'].includes(code)) {
        S.writeBlocked = true; S.saveState = '';
      } else if (retries < 3) {
        retries++; ids.forEach(id => dirty.add(id)); S.saveState = 'retry';
        setTimeout(flush, 2500 * retries);
      } else { S.saveState = 'failed'; }
    }
    updateSaveLabel();
  });
}
function saveLabel() {
  if (S.mode !== 'shared' || !S.me.id || S.writeBlocked) return 'Saved on this device';
  return { saving: 'Saving…', saved: 'Saved', retry: 'Reconnecting…', failed: 'Not saved. Check your connection.' }[S.saveState] || '';
}
function updateSaveLabel() { const el = document.getElementById('save'); if (el) el.innerHTML = `${saveIcon()}<span id="save-label">${esc(saveLabel())}</span>`; else render(); }

function advance() {}
function doPick(k, s) {
  if (S.viewing) return;
  const bid = S.bid, b = S.brackets.get(bid); if (!b) return;
  const w = getMine(bid).slice();
  const onPlay = S.tab === 'play';
  if (w[k] === s) { if (onPlay) playStep(1); return; }
  w[k] = s;
  setMine(bid, normalize(b.size, w));
  if (!onPlay) { render(); return; }
  // show the pick for a moment, then move to the next open match
  S.playK = k; render();
  clearTimeout(advance.t);
  const still = matchMedia('(prefers-reduced-motion: reduce)').matches;
  advance.t = setTimeout(() => {
    if (S.view !== 'bracket' || S.tab !== 'play' || S.bid !== bid) return;
    const cur = getMine(bid), ks = playable(b.size, cur);
    S.playK = ks.find(x => x > k && cur[x] === null) ?? ks.find(x => cur[x] === null) ?? null;
    render();
  }, still ? 0 : 320);
}

/* ---------- lineup generation ---------- */
function genPrompt(artist, size) {
  return `Build a ${size}-song tournament bracket lineup for the music artist "${artist}". A group of friends will vote song against song until one track wins.

Pick exactly ${size} songs where ${artist} is the lead or credited main artist. Choose the songs fans would actually argue about: the biggest hits, fan favorites and standout album cuts, spread across their studio albums, mixtapes, EPs and notable singles so every era is represented. No duplicates, remixes, live versions, skits or interludes.

Rank the songs 1 to ${size} by how strong a contender each one is (1 = the favorite to win). Also suggest 8 more songs as alternates, ranked the same way.

Reply with only JSON in this shape:
{"artist":"Canonical Artist Name","albums":[{"name":"Album Title","year":2018}],"songs":[{"title":"Song Title","album":"Album Title","year":2018}],"alternates":[{"title":"Song Title","album":"Album Title","year":2018}]}

Every song's "album" must exactly match a name in "albums". Put non-album singles and features under an album named "Singles". List albums in release order. If you do not recognize the artist, reply {"error":"unknown artist"}.`;
}

function newDraft(artist, size, source) {
  return { artist, size, albums: [], songs: [], bench: [], seeding: 'seeded', source };
}
function addAlbum(d, name, year) {
  name = String(name || '').trim() || 'Singles';
  let i = d.albums.findIndex(a => a.name.toLowerCase() === name.toLowerCase());
  const y = Number(year) > 1900 && Number(year) < 2100 ? Math.round(Number(year)) : null;
  if (i < 0) { i = d.albums.length; d.albums.push({ name, year: y }); }
  else if (d.albums[i].year == null && y) d.albums[i].year = y;
  return i;
}
function tidyAlbums(d) {
  // order albums by year (Singles last), drop unused ones, and give each a color
  const used = new Set([...d.songs, ...d.bench].map(s => s.a));
  const keep = d.albums.map((a, i) => ({ ...a, old: i })).filter(a => used.has(a.old));
  keep.sort((x, y) => {
    const xs = /^singles/i.test(x.name), ys = /^singles/i.test(y.name);
    if (xs !== ys) return xs ? 1 : -1;
    return (x.year ?? 9999) - (y.year ?? 9999);
  });
  const map = new Map(keep.map((a, i) => [a.old, i]));
  d.albums = keep.map((a, i) => ({ name: a.name, year: a.year, color: a.color || PALETTE[i % PALETTE.length] }));
  d.songs.forEach(s => s.a = map.get(s.a));
  d.bench.forEach(s => s.a = map.get(s.a));
  return d;
}
function draftFromClaude(data, artistInput, size) {
  if (!data || typeof data !== 'object' || Array.isArray(data) || data.error) throw { code: 'unknown_artist' };
  const d = newDraft(String(data.artist || artistInput).trim() || artistInput, size, 'claude');
  (Array.isArray(data.albums) ? data.albums : []).forEach(a => a && addAlbum(d, a.name ?? a.title, a.year));
  const seen = new Set();
  const toSong = s => {
    const t = String(s?.title ?? '').trim(); if (!t) return null;
    const key = t.toLowerCase(); if (seen.has(key)) return null; seen.add(key);
    return { t, a: addAlbum(d, s.album, s.year) };
  };
  d.songs = (Array.isArray(data.songs) ? data.songs : []).map(toSong).filter(Boolean);
  d.bench = (Array.isArray(data.alternates) ? data.alternates : []).map(toSong).filter(Boolean);
  while (d.songs.length > size) d.bench.unshift(d.songs.pop());
  if (!d.songs.length) throw { code: 'unknown_artist' };
  return tidyAlbums(d);
}
function draftFromPaste(text, artist, size) {
  const lines = text.split(/\r?\n/).map(l => l.replace(/^\s*\d+[.)]\s*/, '').trim()).filter(Boolean);
  if (SIZES.includes(lines.length)) size = lines.length;
  const d = newDraft(artist || 'My bracket', size, 'manual');
  const seen = new Set();
  for (const line of lines) {
    const [t, album] = line.split(/\s+[-–—|]\s+|\t/).map(x => x.trim());
    if (!t || seen.has(t.toLowerCase())) continue;
    seen.add(t.toLowerCase());
    d.songs.push({ t, a: addAlbum(d, album || 'Singles') });
  }
  while (d.songs.length > size) d.bench.unshift(d.songs.pop());
  return tidyAlbums(d);
}

function askClaude(artist, size) {
  S.gen = { status: 'manual', artist, size, prompt: genPrompt(artist, size), reply: '', show: false, err: null };

function parseReply(text) {
  const a = text.indexOf('{'), b = text.lastIndexOf('}');
  if (a < 0 || b < a) throw { code: 'bad_reply' };
  try { return JSON.parse(text.slice(a, b + 1)); } catch { throw { code: 'bad_reply' }; }
}
async function generate(artist, size, fresh) {
  if (!S.sample) return askClaude(artist, size);
  const ctl = new AbortController();
  S.gen = { status: 'thinking', artist, size, ctl, found: 0 };
  S.draft = null; S.view = 'draft'; render();
  try {
    const data = await S.sample.json(genPrompt(artist, size), {
      signal: ctl.signal,
      ...(fresh ? { cache: false } : {}),
      onText: ({ text }) => {
        const n = (text.match(/"title"\s*:/g) || []).length;
        const el = document.getElementById('gen-live');
        if (el) el.textContent = n ? `Found ${Math.min(n, size)} of ${size} songs…` : 'Writing the lineup…';

    else S.gen = { status: 'error', code, artist, size };

}

function draftToDoc(d) {
  const n = d.size;
  const ranked = d.songs.slice(0, n).map((s, i) => ({ ...s, seed: i + 1 }));
  const slots = d.seeding === 'seeded' ? seedOrder(n).map(seed => ranked[seed - 1]) : shuffle(ranked.slice());
  const used = [...new Set(slots.map(s => s.a))].sort((x, y) => x - y);
  const map = new Map(used.map((a, i) => [a, i]));
  return {
    artist: d.artist, size: n,
    albums: used.map(a => ({ name: d.albums[a].name, year: d.albums[a].year ?? null, color: d.albums[a].color })),
    songs: slots.map(s => ({ t: s.t, a: map.get(s.a), seed: s.seed })),
    seeding: d.seeding, source: d.source, createdBy: S.me.id || null, createdAt: Date.now(),
  };
}

function participants(bid) {

  const status = new Map(all.map(([id, b]) => [id, bracketStatus(id, b)]));

function bracketCard(id, b, st) {

  if (st === 'done') {

    status = `<div class="row"><b>${rn}</b><span>${n} / ${b.size - 1}</span></div><div class="meter"><i style="width:${n / (b.size - 1) * 100}%"></i></div>`;

/* bracket page */

const saveIcon = () => S.saveState === 'saved' || S.mode !== 'shared' || !S.me.id || S.writeBlocked ? ic('check', 'sm') : '';

/* pick */
function songCard(b, k, s, win, side) {
  const song = b.songs[s], al = albumOf(b, s);
  const cls = win === null ? '' : win === s ? 'won' : 'lost';
  return `<div class="duel-card ${cls}" style="${alStyle(al.color)}">
    <button class="duel-pick" data-act="pick" data-k="${k}" data-s="${s}" aria-pressed="${win === s}" aria-label="Pick ${esc(song.t)}">
      <span class="duel-top"><span class="duel-seed">${song.seed ? `#${song.seed} seed` : `Slot ${s + 1}`}</span><span class="duel-key" aria-hidden="true">${side === 'L' ? '←' : '→'}</span></span>
      <span class="duel-title">${esc(song.t)}</span>
      <span class="duel-album">${albumLine(al)}</span>
      <span class="duel-cta">${win === s ? 'Your pick' : 'Pick this song'}</span>
    </button>
    <div class="listen">${listenLinks(b.artist, song.t)}</div>
  </div>`;
}
function currentPlayK(b, w) {
  const ks = playable(b.size, w);
  if (S.playK !== null && ks.includes(S.playK)) return S.playK;
  const open = ks.find(k => w[k] === null);
  return open === undefined ? null : open;
}
function nextLine(b, w, r, i) {
  const n = b.size, R = nRounds(n);
  if (r === R - 1) return 'Winner is your champion';
  const j = i ^ 1, [pa, pb] = entrants(n, w, r, j), pw = w[off(n, r) + j];
  const next = roundName(n, r + 1).toLowerCase().replace(/^round/, 'Round');
  if (pw !== null) return `Winner plays ${esc(b.songs[pw].t)} in the ${next}`;
  if (pa !== null && pb !== null) return `Winner plays ${esc(b.songs[pa].t)} or ${esc(b.songs[pb].t)}`;
  return `Winner moves on to the ${next}`;
}
function playTab(b) {
  const n = b.size, w = getMine(S.bid), R = nRounds(n);
  const k = currentPlayK(b, w);
  if (k === null) return championView(b, w);
  const [r, i] = locate(n, k);
  const [a, c] = entrants(n, w, r, i);
  const ks = playable(n, w);
  const rounds = Array.from({ length: R }, (_, rr) => {
    const m = mCount(n, rr), o = off(n, rr);
    let d = 0; for (let x = 0; x < m; x++) if (w[o + x] !== null) d++;
    return `<li class="${rr === r ? 'now' : ''}" style="--w:${m}"><span class="lbl"><b>${roundName(n, rr)}</b><span>${d}/${m}</span></span><span class="meter"><i style="width:${d / m * 100}%"></i></span></li>`;
  }).join('');
  const o = off(n, r), m = mCount(n, r);
  const jump = Array.from({ length: m }, (_, x) => {
    const kk = o + x, ok = ks.includes(kk), [ea, eb] = entrants(n, w, r, x);
    const cls = kk === k ? 'now' : w[kk] !== null ? 'done' : '';
    const label = ok ? `Match ${x + 1}: ${b.songs[ea].t} vs ${b.songs[eb].t}${w[kk] !== null ? ', picked' : ''}` : `Match ${x + 1}: not set yet`;
    return `<button type="button" class="${cls}" data-act="jump" data-k="${kk}" aria-label="${esc(label)}" ${ok ? '' : 'disabled'}>${x + 1}</button>`;
  }).join('');
  return `<section class="play">
    <ol class="rounds" aria-label="Progress by round" style="--n:${R}">${rounds}</ol>
    <div class="play-meta"><h2 class="round-name">${roundName(n, r)} <span>· Match ${i + 1} of ${m}</span></h2><span class="next-line">${nextLine(b, w, r, i)}</span></div>
    <div class="duel">${songCard(b, k, a, w[k], 'L')}<div class="vs" aria-hidden="true">VS</div>${songCard(b, k, c, w[k], 'R')}</div>
    <div class="play-nav">
      <button class="btn" data-act="prev" ${ks.indexOf(k) <= 0 ? 'disabled' : ''}>${ic('back', 'sm')}Previous</button>
      <span class="keys">Use <span class="kbd">←</span><span class="kbd">→</span> to pick, <span class="kbd">S</span> to skip</span>
      <button class="btn" data-act="next">${w[k] === null ? 'Skip' : 'Next'}${ic('arrow', 'sm')}</button>
    </div>
    ${m > 1 ? `<section class="jump" aria-label="All ${esc(roundName(n, r))} matches">
      <div class="jump-top"><b>Jump to a match</b><span class="jump-key"><span><i class="done"></i>Picked</span><span><i class="now"></i>Now</span><span><i class="open"></i>Open</span></span></div>
      <div class="jump-grid">${jump}</div></section>` : ''}
  </section>`;
}
function championView(b, w) {
  const n = b.size;
  if (!isDone(w)) {
    const left = n - 1 - picked(w);
    return `<section class="skipped"><p class="eyebrow">Skipped matches</p><h2 class="round-name">You skipped ${plural(left, 'match', 'matches')}</h2>
      <div style="display:flex;gap:8px;flex-wrap:wrap;justify-content:center"><button class="btn primary" data-act="first-open">Go to the first one</button><button class="btn" data-act="tab" data-tab="bracket">Open the bracket</button></div></section>`;
  }
  const c = w[n - 2], song = b.songs[c], al = albumOf(b, c);
  const route = [];
  for (let k = 0; k < n - 1; k++) if (w[k] === c) {
    const [r, i] = locate(n, k); const [x, y] = entrants(n, w, r, i);
    const lost = x === c ? y : x, la = albumOf(b, lost);
    route.push(`<li><span>${roundName(n, r)}</span><span class="who"><span class="sw" style="${alStyle(la.color)}"></span><span>${esc(b.songs[lost].t)}</span></span><span class="mono">${b.songs[lost].seed ? '#' + b.songs[lost].seed : ''}</span></li>`);
  }
  const done = participants(S.bid).filter(p => !p.me && p.done).map(p => p.uid);
  const friends = done.length ? `<p class="friends-line"><span class="avs">${done.slice(0, 4).map(u => avatar(u)).join('')}</span>${esc(listNames(done))} ${done.length === 1 ? 'is' : 'are'} done too. Their picks are unlocked.</p>` : '';
  return `<section class="champ">
    <div class="champ-hero" style="${alStyle(al.color)}">
      <p class="eyebrow">${ic('trophy')}Your champion</p>
      <h2 class="champ-title">${esc(song.t)}</h2>
      <p>${albumLine(al)}${song.seed ? ` · #${song.seed} seed` : ''}</p>
    </div>
    <div class="champ-body">
      <div><h3 class="h3" style="font-size:20px">Road to the title</h3><ol class="route">${route.join('')}</ol></div>
      <div class="champ-acts">
        ${friends}
        <div class="row"><button class="btn primary lg" data-act="tab" data-tab="compare">Compare with friends</button><button class="btn lg" data-act="share">${ic('share', 'sm')}Share</button></div>
        <div class="row"><button class="btn" data-act="tab" data-tab="bracket">See my bracket</button><button class="btn" data-act="first">Review from the start</button></div>
      </div>
    </div></section>`;
}

/* bracket tree */
function slotBtn(b, s, k, win, editable) {
  if (s === null) return `<div class="slot empty" aria-hidden="true"></div>`;
  const song = b.songs[s], al = albumOf(b, s);
  const cls = win === null ? '' : win === s ? 'won' : 'lost';
  return `<button class="slot ${cls}" style="${alStyle(al.color)}" data-act="pick" data-k="${k}" data-s="${s}" title="${esc(song.t)} · ${esc(al.name)}" ${editable ? '' : 'disabled'}><span class="sd">${song.seed ?? ''}</span><span class="st">${esc(song.t)}</span></button>`;
}
function matchBox(b, w, r, i, editable) {
  const k = off(b.size, r) + i, [a, c] = entrants(b.size, w, r, i);
  return `<div class="mb">${slotBtn(b, a, k, w[k], editable)}${slotBtn(b, c, k, w[k], editable)}</div>`;
}
function tree(b, w, editable) {
  const n = b.size, R = nRounds(n);
  const short = r => { const left = n >> r; return left === 8 ? 'Quarters' : left === 4 ? 'Semis' : 'Round of ' + left; };
  const side = s => {
    const cols = [];
    for (let r = 0; r < R - 1; r++) {
      const half = mCount(n, r) / 2, start = s === 'L' ? 0 : half;
      const ms = [];
      for (let i = start; i < start + half; i++) ms.push(`<div class="m ${r > 0 ? 'in' : ''}">${matchBox(b, w, r, i, editable)}</div>`);
      const head = `<div class="col-h">${short(r)}</div>`;
      if (half === 1) cols.push(`<div class="col">${head}<div class="pair solo">${ms[0]}</div></div>`);
      else { const pairs = []; for (let p = 0; p < ms.length; p += 2) pairs.push(`<div class="pair">${ms[p]}${ms[p + 1]}</div>`); cols.push(`<div class="col">${head}${pairs.join('')}</div>`); }
    }
    return `<div class="side ${s}">${cols.join('')}</div>`;
  };
  const c = w[n - 2], left = n - 1 - picked(w);
  const plate = c !== null
    ? `<div class="plate-t set" style="${alStyle(albumOf(b, c).color)}">${esc(b.songs[c].t)}</div>`
    : `<div class="plate-t">To be picked</div>`;
  return `<div class="bk-frame" id="bk-frame"><div class="bk ${n >= 64 ? 'big' : ''}" id="bk" style="--rows:${n / 4}">
    ${side('L')}
    <div class="center"><div class="col-h">Final</div><div class="center-body"><div class="plate">${ic('trophy', 'lg')}<span class="plate-l">Champion</span>${plate}</div>
      <div class="m">${matchBox(b, w, R - 1, 0, editable)}</div>
      ${editable && left ? `<div class="left-l"><button data-act="tab" data-tab="play">${plural(left, 'pick')} left${ic('arrow', 'sm')}</button></div>` : ''}</div></div>
    ${side('R')}
  </div></div>`;
}
function revealed(bid) {
  const ppl = participants(bid), mine = ppl.find(p => p.me), others = ppl.filter(p => !p.me);
  return (mine && mine.done) || S.peek[bid] || !others.length;
}
function treeTab(b) {
  const uid = S.viewing;
  const w = uid ? picksOf(uid, S.bid) : getMine(S.bid);
  const mine = getMine(S.bid);
  const others = revealed(S.bid) ? participants(S.bid).filter(p => !p.me) : [];
  const opts = [`<option value="">My picks (${picked(mine)} of ${b.size - 1})</option>`, ...others.map(p => `<option value="${esc(p.uid)}" ${p.uid === uid ? 'selected' : ''}>${esc(nameOf(p.uid))}’s picks${p.done ? '' : ` (${p.n} of ${b.size - 1})`}</option>`)].join('');
  const confirming = S.confirm === 'reset';
  const right = uid ? '' : (picked(w) ? (confirming
    ? `<span class="confirm">Clear all ${picked(w)} picks?<button class="btn sm danger" data-act="reset-yes">Clear picks</button><button class="btn sm" data-act="confirm-no">Keep</button></span>`
    : `<button class="btn sm" data-act="reset">Clear my picks</button>`) : '') + deleteControls(b);
  const zoom = zoomMode();
  const top = `<div class="toolbar">
      <div class="grp">${others.length ? `<label for="whose">Showing</label><select id="whose">${opts}</select>` : ''}
        <span class="hint" style="font-size:13px">${uid ? `Read only. These are ${esc(nameOf(uid))}’s picks.` : 'Click a song to send it through. Changing an early pick clears the picks after it.'}</span></div>
      <div class="grp"><div class="seg words" role="group" aria-label="Zoom"><button type="button" data-act="zoom" data-v="fit" aria-pressed="${zoom === 'fit'}">Fit</button><button type="button" data-act="zoom" data-v="full" aria-pressed="${zoom === 'full'}">100%</button></div>${right}</div>
    </div>`;
  const legend = `<div class="legend below">${b.albums.map(a => `<span><span class="sw" style="${alStyle(a.color)}"></span>${albumLine(a)}</span>`).join('')}</div>`;
  return top + tree(b, w, !uid) + legend;
}
function deleteControls(b) {
  if (!canManage(b)) return '';
  if (S.confirm === 'delete') return `<span class="confirm">Delete for everyone?<button class="btn sm danger" data-act="delete-yes">Delete bracket</button><button class="btn sm" data-act="confirm-no">Keep</button></span>`;
  return `<button class="btn sm danger" data-act="delete">Delete bracket</button>`;
}
const zoomMode = () => S.zoom || (window.innerWidth < 700 ? 'full' : 'fit');
function fitTree() {
  const frame = document.getElementById('bk-frame'), bk = document.getElementById('bk');
  if (!frame || !bk) return;
  bk.style.zoom = '';
  if (zoomMode() !== 'fit') return;
  const scale = Math.min(1, (frame.clientWidth - 2) / bk.offsetWidth);
  if (scale < 1) bk.style.zoom = String(Math.max(.55, scale));
}

/* compare */
function agreement(b, w1, w2) {
  const n = b.size; let same = 0, tot = 0;
  for (let k = 0; k < n - 1; k++) {
    if (w1[k] === null || w2[k] === null) continue;
    const [r, i] = locate(n, k), e1 = entrants(n, w1, r, i), e2 = entrants(n, w2, r, i);
    if (e1[0] !== e2[0] || e1[1] !== e2[1]) continue;
    tot++; if (w1[k] === w2[k]) same++;
  }
  return tot ? Math.round(same / tot * 100) : null;
}
function compareTab(b) {
  const n = b.size, ppl = participants(S.bid);
  const mine = ppl.find(p => p.me);
  const isRevealed = revealed(S.bid);
  const invite = `<button class="btn sm" data-act="invite"${S.backend === 'artifact' ? ` aria-expanded="${!!S.invite}"` : ''}>${ic('invite', 'sm')}${S.backend === 'artifact' ? 'Invite friends' : 'Copy invite link'}</button>`;
  const inviteBox = S.invite ? `<div class="notice invite" style="margin:0"><b>Share this page from the claude.ai Share menu.</b><span>Give friends edit access so their picks are saved where everyone can see them. They’ll find this bracket on the home screen.</span></div>` : '';
  if (!ppl.length) return `<section class="cmp"><div class="sec-top" style="margin:0"><h2 class="h3">Who’s in</h2>${invite}</div>${inviteBox}<div class="empty-state">Nobody has picked yet. Start in the Pick tab, then send this page to your friends.</div></section>`;

  const scores = new Map();
  if (mine) for (const p of ppl) if (!p.me && (isRevealed)) { const a = agreement(b, mine.w, p.w); if (a !== null) scores.set(p.uid, a); }
  const best = Math.max(-1, ...scores.values());
  const people = ppl.map(p => {
    const champ = p.champ !== null && p.champ !== undefined ? b.songs[p.champ] : null;
    const show = isRevealed || p.me;
    const sub = !show ? (p.done ? 'Finished · champion hidden' : `${p.n} of ${n - 1} picked`)
      : champ ? `<span class="sw" style="${alStyle(albumOf(b, p.champ).color)}"></span>Champion <b>${esc(champ.t)}</b>`
      : `${p.n} of ${n - 1} picked`;
    const sc = scores.get(p.uid);
    const pill = sc !== undefined ? `<span class="pill ${sc === best && scores.size > 1 ? 'hi' : ''}">${sc}% match${p.done && mine.done ? '' : ' so far'}</span>` : '';
    const act = p.me ? `<button class="btn sm" data-act="tab" data-tab="bracket">My bracket</button>` : show ? `<button class="btn sm" data-act="view" data-uid="${esc(p.uid)}">View bracket</button>` : '<span></span>';
    return `<div class="person">${avatar(p.uid)}<div style="min-width:0"><div class="nmrow"><span class="nm">${esc(nameOf(p.uid))}</span>${pill}</div><div class="sub">${sub}</div>${p.done ? '' : `<div class="meter"><i style="width:${p.n / (n - 1) * 100}%"></i></div>`}</div>${act}</div>`;
  }).join('');
  const whoCol = `<section><div class="sec-top" style="margin:0"><h2 class="h3">Who’s in</h2>${invite}</div>${inviteBox}${people}
    ${scores.size ? `<p class="hint" style="font-size:13px">Match % is how often you made the same pick in matchups you both faced.</p>` : ''}</section>`;

  if (!isRevealed) {
    return `<section class="cmp"><div class="cmp-cols">${whoCol}<section><div class="hidden-box"><b>Everyone’s picks stay hidden until you finish yours.</b><span>That way nobody sways your bracket before the call.</span>
      <div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn primary" data-act="tab" data-tab="play">Finish my bracket</button><button class="btn" data-act="peek">Show them anyway</button></div></div></section></div></section>`;
  }

  // champion vote
  const votes = new Map();
  for (const p of ppl) if (p.done) { const v = votes.get(p.champ) || []; v.push(p.uid); votes.set(p.champ, v); }
  const waiting = ppl.filter(p => !p.done);
  const doneN = ppl.length - waiting.length;
  const segs = [...votes.entries()].sort((x, y) => y[1].length - x[1].length).map(([s, uids]) => {
    const al = albumOf(b, s);
    return `<div class="vote-seg" style="${alStyle(al.color)};--f:${uids.length}"><b>${esc(b.songs[s].t)}</b><span><span>${esc(listNames(uids))}</span><em>${plural(uids.length, 'vote')}</em></span></div>`;
  });
  if (waiting.length) segs.push(`<div class="vote-seg wait" style="--f:${waiting.length}"><b>${waiting.length === 1 ? esc(nameOf(waiting[0].uid)) : `${waiting.length} people`}</b><span><span>Still picking</span></span></div>`);
  const vote = `<section class="card-box vote" aria-label="Champion vote"><div class="sec-top" style="margin:0"><h2 class="h3">The group’s champion</h2><span class="hint">${doneN} of ${ppl.length} finished</span></div><div class="vote-bar">${segs.join('')}</div></section>`;

  // standings: one point per match won, summed over everyone
  const pts = new Array(n).fill(0), champs = new Array(n).fill(0);
  for (const p of ppl) { p.w.forEach(s => { if (s !== null) pts[s]++; }); if (p.champ !== null && p.champ !== undefined) champs[p.champ]++; }
  const order = [...pts.keys()].filter(s => pts[s] > 0).sort((x, y) => pts[y] - pts[x] || champs[y] - champs[x]).slice(0, 10);
  const max = Math.max(1, ...pts);
  const stand = order.map((s, i) => {
    const al = albumOf(b, s), pct = pts[s] / max * 100;
    return `<li><span class="rk">${i + 1}</span><span class="sbar" style="${alStyle(al.color)}"><i style="width:${pct}%"></i><span class="${pct > 60 ? 'on' : ''}">${esc(b.songs[s].t)}</span></span><span class="pts">${pts[s]}${champs[s] ? ` <small>· ${champs[s]}× champ</small>` : ''}</span></li>`;
  }).join('');
  const standCol = `<section><div class="sec-top" style="margin:0"><h2 class="h3">Group standings</h2><span class="hint">1 point per match won, in anyone’s bracket</span></div><ol class="stand">${stand}</ol></section>`;

  // first-round splits: the only round where everyone faced the same matchups
  const splits = [];
  for (let i = 0; i < mCount(n, 0); i++) {
    const A = [], B = [];
    for (const p of ppl) { if (p.w[i] === 2 * i) A.push(p.uid); else if (p.w[i] === 2 * i + 1) B.push(p.uid); }
    if (A.length && B.length) splits.push({ i, A, B });
  }
  splits.sort((x, y) => (Math.min(y.A.length, y.B.length) / (y.A.length + y.B.length)) - (Math.min(x.A.length, x.B.length) / (x.A.length + x.B.length)) || (y.A.length + y.B.length) - (x.A.length + x.B.length));
  const splitHtml = splits.slice(0, 10).map(({ i, A, B }) => {
    const a1 = albumOf(b, 2 * i), a2 = albumOf(b, 2 * i + 1);
    return `<div class="split"><div class="teams"><b>${esc(b.songs[2 * i].t)}</b><span class="score">${A.length}–${B.length}</span><b>${esc(b.songs[2 * i + 1].t)}</b></div>
      <div class="tug" aria-hidden="true"><i style="${alStyle(a1.color)};--f:${A.length}"></i><i style="${alStyle(a2.color)};--f:${B.length}"></i></div>
      <div class="names"><span>${esc(listNames(A))}</span><span>${esc(listNames(B))}</span></div></div>`;
  }).join('');
  const debates = `<section><div class="sec-top" style="margin-bottom:12px"><h2 class="h3">Biggest debates</h2><span class="hint">First-round matchups where the group split</span></div>
    ${splitHtml ? `<div class="splits">${splitHtml}</div>` : `<p class="hint">${ppl.length > 1 ? 'Everyone agrees on the first round so far.' : 'Splits appear once two people have picked.'}</p>`}</section>`;

  return `<section class="cmp">${votes.size ? vote : ''}<div class="cmp-cols">${whoCol}${standCol}</div>${debates}</section>`;
}

/* listen */
function listenTab(b) {
  const groups = b.albums.map((a, ai) => ({ a, songs: b.songs.filter(s => s.a === ai).sort((x, y) => (x.seed ?? 0) - (y.seed ?? 0)) })).filter(g => g.songs.length);
  return `<section>
    <div class="listen-top">
      <div style="max-width:62ch"><h2 class="h3" style="margin-bottom:8px">Make it a playlist</h2>
        <p class="hint">Copy the track list, then paste it into a playlist importer like <a href="https://www.tunemymusic.com/transfer" target="_blank" rel="noopener">TuneMyMusic</a> or <a href="https://soundiiz.com" target="_blank" rel="noopener">Soundiiz</a> and choose Spotify, Apple Music or YouTube Music as the destination. Or play songs one at a time with the links below.</p></div>
      <button class="btn primary" data-act="copy">${ic('copy', 'sm')}Copy track list</button>
    </div>
    ${S.copyText ? `<textarea class="copy-out" id="copy-out" readonly aria-label="Track list">${esc(S.copyText)}</textarea>` : ''}
    ${groups.map(g => `<div class="album-grp"><h3 class="album-h"><span class="sw" style="${alStyle(g.a.color)}"></span>${esc(g.a.name)}${g.a.year ? ` <span class="mono">${g.a.year}</span>` : ''}</h3>
      <ul class="tracks">${g.songs.map(s => `<li><span class="t"><span class="mono">${s.seed ? '#' + s.seed : ''}</span>${esc(s.t)}</span><span class="ln">${listenLinks(b.artist, s.t)}</span></li>`).join('')}</ul></div>`).join('')}
  </section>`;
}

/* ---------- render ---------- */
function render() {
  const app = document.getElementById('app');
  const a = document.activeElement;
  const focus = a && a.id ? { id: a.id, s: a.selectionStart, e: a.selectionEnd } : null;
  app.innerHTML = shell();
  if (focus) {
    const el = document.getElementById(focus.id);
    if (el) { el.focus({ preventScroll: true }); try { if (focus.s != null) el.setSelectionRange(focus.s, focus.e); } catch {} }
  }
  fitTree();
  refreshProfiles();
}
window.addEventListener('resize', () => { clearTimeout(fitTree.t); fitTree.t = setTimeout(fitTree, 100); });

/* ---------- events ---------- */
function setHash(h) { if (S.backend === 'artifact') return; try { history.replaceState(null, '', h ? '#' + h : location.pathname + location.search); } catch {} }
function openLinkedBracket() {
  if (S.linkChecked || !S.loadedB) return false;
  S.linkChecked = true;
  const m = location.hash.match(/^#b=([\w-]+)$/);
  if (m && S.brackets.has(m[1])) { openBracket(m[1]); return true; }
  return false;
}
const inviteUrl = bid => location.href.split('#')[0] + '#b=' + bid;
function openBracket(id) { setHash('b=' + id); S.view = 'bracket'; S.bid = id; S.viewing = null; S.playK = null; S.confirm = null; S.copyText = null; S.invite = false; const w = getMine(id); S.tab = isDone(w) ? 'compare' : 'play'; window.scrollTo(0, 0); render(); }
function playStep(dir) {
  const b = S.brackets.get(S.bid), w = getMine(S.bid), ks = playable(b.size, w), cur = currentPlayK(b, w);
  const idx = ks.indexOf(cur);
  if (dir < 0) S.playK = idx > 0 ? ks[idx - 1] : cur;
  else S.playK = idx + 1 < ks.length ? ks[idx + 1] : null;
  clearTimeout(advance.t);
  render();
}
async function shareChampion() {
  const b = S.brackets.get(S.bid), w = getMine(S.bid); if (!b || !isDone(w)) return;
  const text = `My ${b.artist} bracket champion: ${b.songs[w[b.size - 2]].t}`;
  try { if (navigator.share) { await navigator.share({ text }); return; } } catch (e) { if (e?.name === 'AbortError') return; }
  try { await navigator.clipboard.writeText(text); toast('Copied. Paste it in the group chat.'); }
  catch { toast(text); }
}

document.addEventListener('click', async e => {
  if (S.meMenu && !e.target.closest('.me')) { S.meMenu = false; render(); }
  const t = e.target.closest('[data-act]'); if (!t) return;
  const act = t.dataset.act, d = S.draft;
  switch (act) {
    case 'me-menu': S.meMenu = !S.meMenu; render(); if (S.meMenu) document.getElementById('my-name')?.focus(); break;
    case 'sign-out': S.meMenu = false; await S.fb?.signOut(); break;
    case 'sign-in-google': {
      S.authErr = null;
      try { await S.fb.google(); } catch (err) { S.authErr = authError(err); render(); }
      break;
    }
    case 'copy-prompt': {
      const g = S.gen;
      try { await navigator.clipboard.writeText(g.prompt); toast('Prompt copied. Paste it into Claude.'); }
      catch { g.show = true; render(); const el = document.getElementById('prompt-out'); if (el) { el.focus(); el.select(); } }
      break;
    }
    case 'show-prompt': S.gen.show = !S.gen.show; render(); break;
    case 'manual-paste': S.gen = null; S.view = 'home'; S.form.showPaste = true; render(); document.getElementById('paste')?.focus(); break;
    case 'home': setHash(''); S.view = 'home'; S.bid = null; S.gen?.ctl?.abort(); S.gen = null; S.confirm = null; render(); break;
    case 'size': S.form.size = +t.dataset.n; render(); break;
    case 'filter': S.filter = t.dataset.v; render(); break;
    case 'toggle-paste': S.form.showPaste = !S.form.showPaste; render(); break;
    case 'open': openBracket(t.dataset.id); break;
    case 'tab': S.tab = t.dataset.tab; S.confirm = null; if (t.dataset.tab !== 'bracket') S.viewing = null; clearTimeout(advance.t); render(); window.scrollTo(0, 0); break;
    case 'pick': doPick(+t.dataset.k, +t.dataset.s); break;
    case 'prev': playStep(-1); break;
    case 'next': playStep(1); break;
    case 'jump': S.playK = +t.dataset.k; clearTimeout(advance.t); render(); break;
    case 'first': { const b = S.brackets.get(S.bid); S.playK = playable(b.size, getMine(S.bid))[0] ?? null; render(); break; }
    case 'first-open': S.playK = null; render(); break;
    case 'share': shareChampion(); break;
    case 'view': S.viewing = t.dataset.uid; S.tab = 'bracket'; render(); window.scrollTo(0, 0); break;
    case 'view-mine': S.viewing = null; render(); break;
    case 'zoom': S.zoom = t.dataset.v; render(); break;
    case 'invite': {
      if (S.backend === 'artifact') { S.invite = !S.invite; render(); break; }
      const url = inviteUrl(S.bid);
      try { await navigator.clipboard.writeText(url); toast('Invite link copied. Send it to your friends.'); }
      catch { toast(url); }
      break;
    }
    case 'peek': S.peek[S.bid] = true; render(); break;
    case 'reset': S.confirm = 'reset'; render(); break;
    case 'delete': S.confirm = 'delete'; render(); break;
    case 'confirm-no': S.confirm = null; render(); break;
    case 'reset-yes': { const b = S.brackets.get(S.bid); setMine(S.bid, normalize(b.size, [])); S.confirm = null; S.playK = null; render(); break; }
    case 'delete-yes': {
      try { await deleteBracket(S.bid); S.view = 'home'; S.bid = null; S.confirm = null; toast('Bracket deleted'); }
      catch { S.confirm = null; toast('Couldn’t delete it. You may not have permission.'); }
      break;
    }
    case 'copy': {
      const b = S.brackets.get(S.bid);
      const text = [...b.songs].sort((x, y) => (x.seed ?? 0) - (y.seed ?? 0)).map(s => `${b.artist} - ${s.t}`).join('\n');
      try { await navigator.clipboard.writeText(text); toast('Track list copied'); }
      catch { S.copyText = text; render(); const el = document.getElementById('copy-out'); if (el) { el.focus(); el.select(); } }
      break;
    }
    case 'stop-gen': S.gen?.ctl?.abort(); break;
    case 'retry-gen': generate(S.gen.artist, S.gen.size, true); break;
    case 'regen': generate(d.artist, d.size, true); break;
    case 'cancel-draft': S.draft = null; S.gen = null; S.view = 'home'; S.createErr = null; render(); break;
    case 'draft-size': d.size = +t.dataset.n; while (d.songs.length > d.size) d.bench.unshift(d.songs.pop()); render(); break;
    case 'seeding': d.seeding = t.dataset.v; render(); break;
    case 'mv': { const i = +t.dataset.i, j = i + +t.dataset.d; if (j >= 0 && j < d.songs.length) [d.songs[i], d.songs[j]] = [d.songs[j], d.songs[i]]; render(); document.querySelector(`[data-act="mv"][data-i="${j}"][data-d="${t.dataset.d}"]`)?.focus(); break; }
    case 'bench': d.bench.unshift(d.songs.splice(+t.dataset.i, 1)[0]); render(); break;
    case 'unbench': {
      const s = d.bench.splice(+t.dataset.i, 1)[0];
      if (d.songs.length >= d.size) d.bench.unshift(d.songs.pop());
      d.songs.push(s); render(); break;
    }
    case 'create': {
      if (d.songs.length !== d.size) return;
      t.disabled = true; S.createErr = null;
      try { const id = await createBracket(draftToDoc(d)); S.draft = null; openBracket(id); }
      catch (err) {
        S.createErr = ['invalid_argument', 'not_granted'].includes(err?.code) ? 'You don’t have permission to add brackets here. Ask the page owner for edit access.'
          : err?.code === 'quota_exceeded' ? 'This page is out of storage. Delete an old bracket and try again.'
          : 'Couldn’t save the bracket. Check your connection and try again.';
        render();
      }
      break;
    }
  }
});

document.addEventListener('change', e => {
  if (e.target.id === 'whose') { S.viewing = e.target.value || null; render(); }
});

/* lineup drag and drop (the arrow buttons do the same thing from a keyboard or touch screen) */
let dragI = null;
document.addEventListener('dragstart', e => {
  const li = e.target.closest?.('.lu'); if (!li || !S.draft) return;
  dragI = +li.dataset.i; li.classList.add('dragging');
  e.dataTransfer.effectAllowed = 'move';
  try { e.dataTransfer.setData('text/plain', String(dragI)); } catch {}
});
document.addEventListener('dragover', e => {
  const li = e.target.closest?.('.lu'); if (!li || dragI === null) return;
  e.preventDefault(); e.dataTransfer.dropEffect = 'move';
  document.querySelectorAll('.lu.over').forEach(x => x !== li && x.classList.remove('over'));
  li.classList.add('over');
});
document.addEventListener('drop', e => {
  const li = e.target.closest?.('.lu'); if (!li || dragI === null || !S.draft) return;
  e.preventDefault();
  const to = +li.dataset.i, songs = S.draft.songs;
  if (to !== dragI) songs.splice(to, 0, songs.splice(dragI, 1)[0]);
  dragI = null; render();
});
document.addEventListener('dragend', () => {
  dragI = null;
  document.querySelectorAll('.lu.dragging,.lu.over').forEach(x => x.classList.remove('dragging', 'over'));
});

document.addEventListener('submit', async e => {
  e.preventDefault();
  if (e.target.id === 'new-form') {
    const f = S.form;
    const artist = (document.getElementById('artist')?.value || '').trim();
    f.artist = artist;
    const pasteMode = f.showPaste;
    if (pasteMode) {
      const text = document.getElementById('paste')?.value || f.paste;
      if (!text.trim()) { document.getElementById('paste')?.focus(); return; }
      S.draft = draftFromPaste(text, artist, f.size); S.gen = null; S.view = 'draft'; render(); window.scrollTo(0, 0);
    } else {
      if (!artist) { document.getElementById('artist')?.focus(); return; }
      generate(artist, f.size, false); window.scrollTo(0, 0);
    }
  } else if (e.target.id === 'reply-form') {
    const g = S.gen, text = document.getElementById('reply')?.value || '';
    g.reply = text;
    if (!text.trim()) { document.getElementById('reply')?.focus(); return; }
    try { S.draft = draftFromClaude(parseReply(text), g.artist, g.size); S.gen = null; render(); window.scrollTo(0, 0); }
    catch (err) { g.err = genError(err?.code); render(); }
  } else if (e.target.id === 'guest-form') {
    const name = (document.getElementById('guest-name')?.value || '').trim().slice(0, 40);
    if (!name) { document.getElementById('guest-name')?.focus(); return; }
    S.pendingName = name; S.authErr = null;
    try { await S.fb.guest(); } catch (err) { S.pendingName = null; S.authErr = authError(err); render(); }
  } else if (e.target.id === 'rename-form') {
    const name = (document.getElementById('my-name')?.value || '').trim().slice(0, 40);
    if (!name || !S.fb) return;
    try { await S.fb.db.doc('users/' + S.me.id).set({ name, avatarUrl: S.me.avatarUrl || '' }); S.me.name = name; S.meMenu = false; toast('Name saved'); }
    catch { toast('Couldn’t save your name. Try again.'); }
  } else if (e.target.id === 'add-song') {
    const d = S.draft, t = document.getElementById('add-title').value.trim();
    if (!t) return;
    const v = document.getElementById('add-album').value;
    const a = v === 'new' ? addAlbum(d, 'Singles') : +v;
    d.songs.push({ t, a }); tidyAlbums(d); render();
    document.getElementById('add-title')?.focus();
  }
});

document.addEventListener('input', e => {
  if (e.target.id === 'artist') S.form.artist = e.target.value;
  if (e.target.id === 'paste') S.form.paste = e.target.value;
  if (e.target.id === 'reply' && S.gen) S.gen.reply = e.target.value;
});

document.addEventListener('keydown', e => {
  if (S.view !== 'bracket' || S.tab !== 'play' || S.viewing) return;
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  if (/^(INPUT|TEXTAREA|SELECT)$/.test(document.activeElement?.tagName || '')) return;
  const b = S.brackets.get(S.bid); if (!b) return;
  const w = getMine(S.bid), k = currentPlayK(b, w); if (k === null) return;
  if (e.key === 's' || e.key === 'S') { e.preventDefault(); playStep(1); return; }
  if (e.key !== 'ArrowLeft' && e.key !== 'ArrowRight') return;
  const [r, i] = locate(b.size, k), [a, c] = entrants(b.size, w, r, i);
  e.preventDefault();
  doPick(k, e.key === 'ArrowLeft' ? a : c);
});

/* ---------- boot ---------- */
function goLocal() {
  S.mode = 'local';
  const all = lsGet(LS_BRACKETS, {});
  S.brackets = new Map(Object.entries(all));
  S.loadedB = true;
  if (!openLinkedBracket()) render();
}

const FIREBASE_SDK = 'https://www.gstatic.com/firebasejs/12.19.0/';
// Wraps Firebase in the same small db shape the claude.ai artifact runtime has, so the rest of the app doesn't care which one it talks to.
async function loadFirebase(cfg) {
  const [A, Au, F] = await Promise.all(['app', 'auth', 'firestore'].map(m => import(FIREBASE_SDK + `firebase-${m}.js`)));
  const app = A.initializeApp(cfg.firebase);
  const auth = Au.getAuth(app), fs = F.getFirestore(app);
  if (cfg.emulators) {
    Au.connectAuthEmulator(auth, 'http://127.0.0.1:9099', { disableWarnings: true });
    F.connectFirestoreEmulator(fs, '127.0.0.1', 8080);
  }
  const codes = { 'permission-denied': 'not_granted', 'resource-exhausted': 'quota_exceeded', 'invalid-argument': 'invalid_argument' };
  const wrap = p => p.catch(e => { throw { code: codes[e?.code] || e?.code || 'error', message: e?.message }; });
  const snap = s => ({ docs: s.docs.map(d => ({ id: d.id, data: () => d.data() })) });
  const db = {
    collection: name => ({
      onSnapshot: (cb, err) => F.onSnapshot(F.collection(fs, name), s => cb(snap(s)), err),
      add: data => wrap(F.addDoc(F.collection(fs, name), data)).then(r => ({ id: r.id })),
    }),
    doc: path => {
      const r = F.doc(fs, path);
      return {
        get: () => wrap(F.getDoc(r)).then(d => ({ exists: d.exists(), data: () => d.data() })),
        set: data => wrap(F.setDoc(r, data)),
        update: data => wrap(F.setDoc(r, data, { merge: true })), // deep-merges maps, so saving one bracket's picks keeps the others
        delete: () => wrap(F.deleteDoc(r)),
      };
    },
  };
  return {
    db,
    onAuth: fn => Au.onAuthStateChanged(auth, fn),
    google: async () => {
      const p = new Au.GoogleAuthProvider();
      try { await Au.signInWithPopup(auth, p); }
      catch (e) {
        if (['auth/popup-blocked', 'auth/operation-not-supported-in-this-environment'].includes(e?.code)) await Au.signInWithRedirect(auth, p);
        else throw e;
      }
    },
    guest: () => Au.signInAnonymously(auth),
    signOut: () => Au.signOut(auth),
  };
}
function authError(e) {
  const c = e?.code || '';
  if (c === 'auth/popup-closed-by-user' || c === 'auth/cancelled-popup-request') return null;
  if (c === 'auth/operation-not-allowed' || c === 'auth/admin-restricted-operation') return 'That way of signing in isn’t turned on for this site yet.';
  if (c === 'auth/unauthorized-domain') return 'This web address isn’t on the site’s sign-in allow list yet.';
  if (c === 'auth/network-request-failed') return 'Couldn’t reach the sign-in service. Check your connection and try again.';
  return 'Couldn’t sign you in. Try again.';
}
function stopListening() { S.unsubs.forEach(u => { try { u(); } catch {} }); S.unsubs = []; }
async function bootFirebase(cfg) {
  S.backend = 'firebase'; S.authState = 'loading'; render();
  let fb;
  try { fb = await loadFirebase(cfg); }
  catch { S.backend = null; S.authState = null; goLocal(); toast('Couldn’t reach the database, so picks stay on this device.'); return; }
  S.fb = fb;
  fb.onAuth(async u => {
    stopListening();
    S.brackets = new Map(); S.picks = new Map(); S.prof = {}; S.mine = {}; S.edited = new Set(); S.loadedB = false;
    myDocKnown = null;
    if (!u) {
      Object.assign(S, { authState: 'out', mode: 'connecting', db: null, me: { id: null, name: '', avatarUrl: '', isOwner: false }, view: 'home', bid: null, meMenu: false });
      render(); return;
    }
    Object.assign(S, { authState: 'in', mode: 'shared', db: fb.db, canWrite: true, writeBlocked: false, authErr: null });
    S.me = { id: u.uid, name: S.pendingName || u.displayName || '', avatarUrl: u.photoURL || '', isOwner: false, anon: u.isAnonymous };
    const pending = S.pendingName; S.pendingName = null;
    S.unsubs.push(fb.db.collection('users').onSnapshot(snap => {
      for (const d of snap.docs) { const p = d.data(); S.prof[d.id] = { name: p.name || '', avatarUrl: p.avatarUrl || '' }; }
      const mine = S.prof[u.uid];
      if (mine) { S.me.name = mine.name || S.me.name; S.me.avatarUrl = mine.avatarUrl || S.me.avatarUrl; }
      render();
    }, () => {}));
    S.unsubs.push(fb.db.collection('brackets').onSnapshot(snap => {
      S.brackets = new Map(snap.docs.map(d => [d.id, d.data()]));
      S.loadedB = true;
      if (S.view === 'bracket' && !S.brackets.has(S.bid)) { S.view = 'home'; S.bid = null; setHash(''); }
      if (!openLinkedBracket()) render();
    }, () => { S.loadedB = true; render(); }));
    S.unsubs.push(fb.db.collection('picks').onSnapshot(snap => {
      S.picks = new Map(snap.docs.map(d => [d.id, d.data()]));
      if (S.picks.has(u.uid)) myDocKnown = true;
      render();
    }, () => {}));
    render();
    // keep this person's name and photo where friends can see them
    try {
      const ref = fb.db.doc('users/' + u.uid), cur = await ref.get(), had = cur.exists ? cur.data() : {};
      const name = (pending || had.name || u.displayName || 'Guest').trim().slice(0, 40);
      const avatarUrl = u.photoURL || had.avatarUrl || '';
      if (name !== had.name || avatarUrl !== (had.avatarUrl || '')) await ref.set({ name, avatarUrl });
    } catch {}
  });
}

async function boot() {
  render();
  const cfg = window.TB_CONFIG || {};
  if (cfg.firebase) return bootFirebase(cfg);
  const c = window.claude;
  if (!c || typeof c.use !== 'function') return goLocal();
  S.backend = 'artifact';
  const [db, user, sample] = await Promise.all([c.use('db'), c.use('user'), c.use('sample')]);
  S.sample = sample; S.user = user;
  if (user) {
    try {
      const me = await user.me();
      S.me = { id: me.id, name: me.name, avatarUrl: me.avatarUrl, isOwner: me.isOwner };
      const can = await user.can('data.write');
      S.canWrite = can !== false;
    } catch {}
  }
  if (!db) return goLocal();
  S.db = db; S.mode = 'shared';
  db.collection('brackets').onSnapshot(snap => {
    S.brackets = new Map(snap.docs.map(d => [d.id, d.data()]));
    S.loadedB = true;
    if (!openLinkedBracket()) render();
  }, () => { S.loadedB = true; render(); });
  db.collection('picks').onSnapshot(snap => {
    S.picks = new Map(snap.docs.map(d => [d.id, d.data()]));
    if (S.me.id && S.picks.has(S.me.id)) myDocKnown = true;
    render();
  }, () => {});
  render();
}
boot();
})();
</script>
