<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0D0E11">
<meta name="description" content="Pick an artist, fill out a song-vs-song bracket, then compare everyone's picks.">
<title>Bracket</title>
<meta property="og:type" content="website">
<meta property="og:title" content="Bracket">
<meta property="og:description" content="Pick an artist, fill out a song-vs-song bracket, then compare everyone's picks.">
<meta property="og:image" content="https://erf4ngh.github.io/bracket/og.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%230D0E11'/%3E%3Cg fill='none' stroke='%23F2F0EA' stroke-width='2.4' stroke-linecap='square'%3E%3Cpath d='M5 7h6v8h5M5 23h6v-8'/%3E%3Cpath d='M27 7h-6v8h-5M27 23h-6v-8'/%3E%3C/g%3E%3Crect x='13' y='12.5' width='6' height='5' fill='%23C6F432'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;800;900&family=Onest:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
/* Layout: one centered column (max 1200px). Dark by default; the host's data-theme="light" switches to the light tokens.
   Album colors carry the look; one lime accent marks actions and progress. */
:root{
  --bg:#0D0E11; --surface:#16181D; --surface-2:#1F2229; --well:#0D0E11; --tree:#121418;
  --ink:#F2F0EA; --muted:#A2A8B3; --line:#2C3038; --line-2:#3A3F49; --track:#2A2E37;
  --accent:#C6F432; --accent-ink:#0D0E11; --accent-fg:#C6F432; --fill:#C6F432; --fill-ink:#0D0E11;
  --good:#6FE3A0; --warn:#F2B84B; --danger:#FF8A96; --connector:#3A3F49; --ring:rgba(255,255,255,.14);
  --display:"Big Shoulders Display","Arial Narrow",Impact,sans-serif;
  --body:"Onest",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  --tabbar:0px;
  color-scheme:dark;
}
:root[data-theme="light"]{
  --bg:#F3F2EE; --surface:#FFFFFF; --surface-2:#ECEBE6; --well:#F3F2EE; --tree:#FAFAF8;
  --ink:#14151A; --muted:#5D636F; --line:#DAD9D3; --line-2:#C5C4BD; --track:#E3E2DC;
  --accent:#C6F432; --accent-ink:#14151A; --accent-fg:#3F6212; --fill:#4D7C0F; --fill-ink:#FFFFFF;
  --good:#1D7A45; --warn:#9A5B0F; --danger:#B4233C; --connector:#B9B8B1; --ring:rgba(0,0,0,.14);
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{background:var(--bg)}
body{margin:0;color:var(--ink);font:400 15px/1.5 var(--body);-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--accent-fg)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.ic{width:18px;height:18px;flex:none}
.ic.sm{width:14px;height:14px}
.ic.lg{width:22px;height:22px}
.wrap{max-width:1200px;margin:0 auto;padding-inline:24px;padding-block:0 calc(72px + var(--tabbar))}
.wrap.wide{max-width:1440px}
@media (max-width:520px){.wrap{padding-inline:16px}}

/* top bar */
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:14px;border-bottom:1px solid var(--line);margin-inline:-24px;padding-inline:24px}
@media (max-width:520px){.top{margin-inline:-16px;padding-inline:16px}}
.brand{display:flex;align-items:center;gap:10px;background:none;border:0;padding:0;min-height:44px;cursor:pointer;font:800 22px/1 var(--display);text-transform:uppercase;letter-spacing:.04em}
.brand svg{width:26px;height:26px;flex:none}
.me{display:flex;align-items:center;gap:10px;font-size:14px;font-weight:500;color:var(--muted);min-width:0}
.me span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.av{width:24px;height:24px;border-radius:50%;flex:none;object-fit:cover;background:var(--track);display:inline-grid;place-items:center;font:700 11px var(--body);color:var(--ink)}
.me .av{width:32px;height:32px;font-size:13px}
.avs{display:flex}
.avs .av{box-shadow:0 0 0 2px var(--surface);margin-left:-6px}
.avs .av:first-child{margin-left:0}

/* shared bits */
.eyebrow{font:600 12px/1 var(--body);text-transform:uppercase;letter-spacing:.14em;color:var(--muted);margin:0 0 12px}
.hint{color:var(--muted);font-size:14px;margin:0;max-width:62ch}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid var(--line);background:transparent;border-radius:10px;padding:0 16px;min-height:44px;font-weight:600;font-size:14px;cursor:pointer;text-decoration:none;white-space:nowrap;color:var(--ink)}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:700}
.btn.primary:hover{filter:brightness(1.06)}
.btn.danger{color:var(--danger);border-color:color-mix(in srgb,var(--danger) 45%,var(--line))}
.btn:disabled{opacity:.45;cursor:not-allowed;filter:none}
.btn.sm{min-height:36px;padding:0 12px;font-size:13px}
.btn.lg{min-height:54px;font-size:16px;border-radius:12px}
.btn.block{width:100%}
.iconbtn{width:40px;height:40px;flex:none;display:grid;place-items:center;border:1px solid var(--line);border-radius:10px;background:none;color:var(--ink);cursor:pointer}
.iconbtn:hover{border-color:var(--muted)}
.linkbtn{background:none;border:0;padding:0;min-height:44px;color:var(--ink);font-weight:600;font-size:14px;text-decoration:underline;text-underline-offset:4px;cursor:pointer}
.linkbtn:hover{color:var(--accent-fg)}
.back{display:inline-flex;align-items:center;gap:8px;background:none;border:0;padding:0;min-height:44px;color:var(--muted);font-weight:600;font-size:14px;cursor:pointer}
.back:hover{color:var(--ink)}
.seg{display:inline-flex;gap:4px;background:var(--well);border:1px solid var(--line);border-radius:12px;padding:4px}
.seg button{border:0;border-radius:8px;background:none;padding:0 14px;min-height:36px;font:600 14px var(--mono);cursor:pointer;color:var(--muted)}
.seg button:hover{color:var(--ink)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.seg.words button{font-family:var(--body)}
.notice{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:12px 16px;font-size:14px;color:var(--muted);margin-top:20px}
.notice b{color:var(--ink)}
.chip{display:inline-flex;align-items:center;gap:8px;font-size:13px;font-weight:600;padding:0 12px 0 8px;min-height:32px;border-radius:999px;background:transparent;border:1px solid var(--line);white-space:nowrap;color:var(--ink)}
.chip .n{font:500 12px var(--mono);color:var(--muted)}
.sw{width:12px;height:12px;border-radius:3px;background:var(--al);box-shadow:inset 0 0 0 1px var(--ring);flex:none;display:inline-block}
input[type=text],textarea,select{background:var(--well);border:1px solid var(--line);border-radius:10px;padding:0 12px;min-height:44px;min-width:0;color:var(--ink)}
textarea{padding:10px 12px}
input[type=text]:focus,textarea:focus,select:focus{outline:2px solid var(--accent);outline-offset:-1px;border-color:transparent}
.card-box{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:20px}
.h2{font:800 30px/1 var(--display);text-transform:uppercase;letter-spacing:.02em;margin:0}
.h3{font:800 24px/1 var(--display);text-transform:uppercase;letter-spacing:.02em;margin:0}
.sec-top{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:8px 16px;margin-bottom:14px}
.sec-top .hint{font-size:13px}
.meter{height:6px;border-radius:99px;background:var(--track);overflow:hidden}
.meter i{display:block;height:100%;border-radius:99px;background:var(--fill);transition:width .3s}
.kbd{font:600 12px var(--mono);border:1px solid var(--line-2);border-bottom-width:2px;border-radius:5px;padding:1px 6px;color:var(--ink)}

/* home */
.hero{padding-block:56px 48px;border-bottom:1px solid var(--line);display:flex;flex-wrap:wrap;gap:40px 48px;align-items:flex-end}
.hero-main{flex:999 1 560px;min-width:0}
.hero-h{font:900 clamp(52px,8vw,104px)/.86 var(--display);text-transform:uppercase;margin:0 0 32px;text-wrap:balance;max-width:12ch}
.hero-h em{font-style:normal;color:var(--accent-fg)}
.composer{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:10px;display:flex;flex-wrap:wrap;gap:10px;align-items:stretch;max-width:820px}
.composer .field{flex:1 1 260px;min-width:0;display:flex;align-items:center;gap:12px;padding:0 14px;background:var(--well);border-radius:10px;min-height:60px;cursor:text;color:var(--muted)}
.composer .field input{flex:1;min-width:0;background:none;border:0;outline:none;padding:0;min-height:0;font:500 20px var(--body);color:var(--ink)}
.composer .field:focus-within{outline:2px solid var(--accent);outline-offset:-2px}
.composer .seg{border:0;border-radius:10px;background:var(--well)}
.composer .seg button{display:grid;gap:1px;text-align:center;min-width:76px;padding:6px 12px}
.composer .seg button b{font:600 17px var(--mono)}
.composer .seg button small{font:500 11px var(--body)}
.composer .go{flex:0 1 auto;min-height:60px;padding:0 26px;font-size:16px;border-radius:10px}
@media (max-width:640px){.composer .field{flex-basis:100%;min-height:54px}.composer .seg{flex:1 1 auto}.composer .seg button{flex:1;min-width:0}.composer .go{flex:1 1 100%;min-height:54px}}
.hero-foot{display:flex;flex-wrap:wrap;gap:4px 16px;align-items:center;margin-top:10px}
.paste{display:grid;gap:8px;margin-top:12px;max-width:820px}
.paste textarea{min-height:160px;font:13px/1.5 var(--mono);resize:vertical}
.steps{flex:1 1 280px;list-style:none;margin:0;padding:0}
.steps li{display:grid;grid-template-columns:40px 1fr;gap:12px;padding:14px 0;border-top:1px solid var(--line)}
.steps li:last-child{border-bottom:1px solid var(--line)}
.steps .no{font:600 13px var(--mono);color:var(--accent-fg)}
.steps b{display:block;font-weight:600}
.steps span span{color:var(--muted);font-size:14px}
.home-list{padding-top:40px}
.home-list .sec-top{align-items:center;margin-bottom:20px}
.filters{display:flex;gap:6px;flex-wrap:wrap}
.filters button{border:1px solid var(--line);background:none;color:var(--ink);border-radius:999px;padding:0 16px;min-height:40px;font:600 14px var(--body);cursor:pointer;display:inline-flex;align-items:center;gap:6px}
.filters button span{font:500 13px var(--mono);color:var(--muted)}
.filters button[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.filters button[aria-pressed="true"] span{color:inherit;opacity:.7}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:16px}
.card{display:flex;flex-direction:column;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:16px;overflow:hidden;padding:0;cursor:pointer;color:var(--ink)}
.card:hover{border-color:var(--muted)}
.strip{display:flex;height:56px;gap:2px;padding:10px 10px 0}
.strip i{flex:var(--f);background:var(--al);border-radius:4px;box-shadow:inset 0 0 0 1px var(--ring)}
.card-body{padding:16px 18px 18px;display:flex;flex-direction:column;gap:6px;flex:1;width:100%}
.card-h{font:800 34px/.95 var(--display);text-transform:uppercase;margin:0;overflow-wrap:anywhere}
.meta{color:var(--muted);font-size:13px;margin:0}
.card-status{margin-top:auto;padding-top:14px;display:grid;gap:6px;font-size:13px}
.card-status .row{display:flex;justify-content:space-between;gap:8px}
.card-status .row b{font-weight:600}
.card-status .row span{font-family:var(--mono);color:var(--muted)}
.card-status .champ-line{display:flex;align-items:center;gap:8px;min-width:0}
.card-status .champ-line span{color:var(--muted)}
.card-status .champ-line b{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.card-foot{display:flex;align-items:center;justify-content:space-between;gap:10px;border-top:1px solid var(--line);padding-top:12px;margin-top:10px}
.card-foot .who{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted);min-width:0}
.card-foot .cta{display:flex;align-items:center;gap:4px;font-weight:700;font-size:14px;color:var(--accent-fg);white-space:nowrap}
.empty-state{border:1px dashed var(--line-2);border-radius:16px;padding:32px;color:var(--muted);text-align:center}

/* generating + lineup review */
.draft-top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;padding-top:16px}
.stepper{display:flex;align-items:center;gap:8px;list-style:none;margin:0;padding:0;font-size:13px;font-weight:600;color:var(--muted)}
.stepper li{display:flex;align-items:center;gap:8px}
.stepper .dot{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font:600 11px var(--mono);border:1px solid var(--line)}
.stepper .done .dot{background:var(--track);border-color:var(--track);color:var(--ink)}
.stepper .now{color:var(--ink)}
.stepper .now .dot{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.stepper .bar{width:28px;height:1px;background:var(--line)}
@media (max-width:520px){.stepper .lbl{display:none}.stepper .now .lbl{display:inline}}
.draft-head{padding-block:28px 28px}
.artist-h{font:900 clamp(48px,7vw,88px)/.88 var(--display);text-transform:uppercase;margin:0 0 10px;overflow-wrap:anywhere}
.draft-body{display:flex;flex-wrap:wrap;gap:32px;align-items:flex-start}
.draft-list{flex:999 1 560px;min-width:0}
.draft-side{flex:1 1 320px;min-width:0;display:grid;gap:16px;position:sticky;top:16px}
@media (max-width:900px){.draft-side{position:static}}
.legend{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px}
.lineup{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:6px}
.lu{display:grid;grid-template-columns:18px 28px 6px minmax(0,1fr) auto;gap:10px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:6px 6px 6px 8px;cursor:grab}
.lu.dragging{opacity:.4}
.lu.over{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.lu .grip{color:var(--line-2);display:grid;place-items:center}
.lu .rk{font:600 13px var(--mono);color:var(--muted);text-align:right}
.lu .rk.hi{color:var(--accent-fg)}
.lu .bar{width:6px;height:30px;border-radius:3px;background:var(--al);box-shadow:inset 0 0 0 1px var(--ring)}
.lu .tt{min-width:0}
.lu .tt b{display:block;font-weight:600;font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lu .tt small{display:block;color:var(--muted);font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lu .acts{display:flex}
.icon{width:32px;height:36px;border:0;border-radius:8px;background:none;color:var(--muted);cursor:pointer;display:grid;place-items:center}
.icon:hover{background:var(--surface-2);color:var(--ink)}
.icon:disabled{opacity:.25;cursor:default;background:none}
.side-card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:20px;display:grid;gap:18px}
.side-card .title{display:flex;align-items:center;justify-content:space-between;gap:10px}
.side-card .title .h3{font-size:22px}
.count{display:inline-flex;align-items:center;gap:6px;font:600 14px var(--mono);white-space:nowrap}
.count.ok{color:var(--good)}
.count.off{color:var(--warn)}
.field-l{font-size:13px;color:var(--muted);font-weight:600;margin:0 0 8px;padding:0}
fieldset{border:0;margin:0;padding:0;min-width:0}
.dist{display:flex;height:14px;gap:2px}
.dist i{flex:var(--f);background:var(--al);border-radius:3px;box-shadow:inset 0 0 0 1px var(--ring)}
.side-card .seg{display:grid;grid-template-columns:repeat(3,minmax(0,1fr))}
.opt{display:grid;grid-template-columns:20px 1fr;gap:10px;align-items:start;width:100%;text-align:left;padding:12px;border-radius:10px;border:1px solid var(--line);background:none;cursor:pointer;color:var(--ink)}
.opt + .opt{margin-top:8px}
.opt .radio{width:18px;height:18px;border-radius:50%;border:2px solid var(--line-2);margin-top:2px;display:grid;place-items:center}
.opt[aria-pressed="true"]{border-color:var(--accent-fg)}
.opt[aria-pressed="true"] .radio{border-color:var(--accent-fg)}
.opt[aria-pressed="true"] .radio::after{content:"";width:8px;height:8px;border-radius:50%;background:var(--accent-fg)}
.opt b{display:block;font-weight:600}
.opt span span{font-size:13px;color:var(--muted)}
.bench{display:flex;flex-wrap:wrap;gap:6px}
.bench .chip{cursor:pointer;background:var(--well);min-height:36px}
.bench .chip:hover{border-color:var(--muted)}
.add-song{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px}
.add-song select{grid-column:1}
.add-song .btn{grid-row:1 / span 2;grid-column:2;height:auto}
.gen{padding-block:48px;display:grid;gap:16px;justify-items:start}
.gen-live{font:600 15px var(--mono);color:var(--muted);margin:0;display:flex;align-items:center}
.pulse{display:inline-block;width:10px;height:10px;border-radius:50%;background:var(--accent);margin-right:10px;animation:pulse 1.2s ease-in-out infinite}
@keyframes pulse{50%{opacity:.25;transform:scale(.7)}}
.err{color:var(--danger);font-weight:600;margin:0}

/* bracket page header + tabs */
.bk-head{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;padding-top:16px}
.bk-title{display:flex;align-items:center;gap:14px;min-width:0}
.bk-title h1{font:900 clamp(30px,4vw,40px)/.95 var(--display);text-transform:uppercase;margin:0;overflow-wrap:anywhere}
.bk-title .meta{margin-top:2px}
.save{display:inline-flex;align-items:center;gap:6px;font-size:13px;color:var(--muted)}
.save .ic{color:var(--good)}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin:8px -24px 28px;padding-inline:24px;overflow-x:auto}
.tabs button{display:flex;align-items:center;gap:8px;background:none;border:0;border-bottom:3px solid transparent;padding:12px 16px 11px;font-weight:600;color:var(--muted);cursor:pointer;white-space:nowrap}
.tabs button:hover{color:var(--ink)}
.tabs button .ic{display:none}
.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
.tabs .badge{font:600 11px var(--mono);background:var(--track);color:var(--ink);border-radius:99px;padding:1px 7px}
@media (max-width:640px){
  :root{--tabbar:76px}
  .tabs{position:fixed;left:0;right:0;bottom:0;z-index:5;margin:0;padding:6px 8px calc(10px + env(safe-area-inset-bottom,0px));display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:0;background:var(--surface);border-top:1px solid var(--line);border-bottom:0}
  .tabs button{flex-direction:column;gap:2px;padding:6px 0;border:0;font-size:11px;position:relative}
  .tabs button .ic{display:block}
  .tabs button[aria-selected="true"]{color:var(--accent-fg)}
  .tabs .badge{position:absolute;top:2px;left:calc(50% + 6px);font-size:10px;padding:0 5px}
  .bk-head + .notice{margin-bottom:16px}
  .tabs + section{margin-top:20px}
  .play{padding-top:16px}
}

/* pick (head to head) */
.rounds{list-style:none;margin:0 0 28px;padding:0;display:grid;grid-template-columns:repeat(var(--n),minmax(0,1fr));gap:16px}
.rounds li{display:grid;gap:6px;min-width:0}
.rounds .lbl{display:flex;justify-content:space-between;gap:6px;font-size:12px;color:var(--muted);font-weight:600}
.rounds .lbl b{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:600}
.rounds .lbl span{font-family:var(--mono);font-weight:500}
.rounds .now .lbl b{color:var(--ink);font-weight:700}
@media (max-width:640px){.rounds .lbl{display:none}.rounds{display:flex;gap:3px;margin-bottom:16px}.rounds li{flex:var(--w) 1 0}}
.play-meta{display:flex;flex-wrap:wrap;justify-content:space-between;gap:6px 16px;align-items:baseline;margin-bottom:16px}
.round-name{font:800 30px/1 var(--display);text-transform:uppercase;letter-spacing:.02em;margin:0}
.round-name span{color:var(--muted)}
.next-line{font-size:14px;color:var(--muted)}
.mono{font-family:var(--mono);font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.duel{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px;position:relative}
.vs{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:52px;height:52px;border-radius:50%;background:var(--bg);display:grid;place-items:center;font:900 20px/1 var(--display);color:var(--muted);z-index:1;pointer-events:none}
.duel-card{display:flex;flex-direction:column;border-radius:20px;overflow:hidden;background:var(--al);color:var(--al-ink);box-shadow:inset 0 0 0 1px var(--ring);transition:opacity .2s,box-shadow .2s}
.duel-card.lost{opacity:.35}
.duel-card.won{box-shadow:0 0 0 3px var(--bg),0 0 0 6px var(--accent)}
.duel-pick{flex:1;display:flex;flex-direction:column;align-items:flex-start;gap:10px;text-align:left;background:none;border:0;color:inherit;padding:26px 26px 18px;cursor:pointer;min-height:300px}
.duel-top{display:flex;width:100%;gap:10px;align-items:flex-start;min-height:108px;padding-right:120px}
.duel-seed{font:600 13px var(--mono);opacity:.85}
.duel-key{font:600 13px var(--mono);border:1.5px solid currentColor;border-radius:6px;padding:0 7px;opacity:.75}
.duel-title{flex:1;display:flex;align-items:flex-end;font:900 clamp(40px,5vw,72px)/.9 var(--display);text-transform:uppercase;overflow-wrap:anywhere}
.duel-album{font-size:15px;font-weight:500;opacity:.88}
.duel-cta{margin-top:6px;font-size:14px;font-weight:700;border:2px solid currentColor;border-radius:99px;padding:6px 16px;transition:background .15s,color .15s}
.duel-pick:hover .duel-cta,.duel-card.won .duel-cta{background:var(--al-ink);color:var(--al);border-color:var(--al-ink)}
.listen{display:flex;flex-wrap:wrap;gap:6px;padding:0 26px 22px}
.listen a{display:inline-flex;align-items:center;gap:6px;min-height:36px;padding:0 12px;border-radius:8px;font-size:13px;font-weight:700;text-decoration:none;color:inherit;background:color-mix(in srgb,var(--al-ink) 14%,transparent)}
.listen a:hover{background:color-mix(in srgb,var(--al-ink) 26%,transparent)}
.play-nav{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-top:20px}
.keys{font-size:13px;color:var(--muted);display:flex;align-items:center;gap:6px;flex-wrap:wrap;justify-content:center}
.jump{margin-top:36px;border-top:1px solid var(--line);padding-top:20px}
.jump-top{display:flex;justify-content:space-between;gap:8px 12px;flex-wrap:wrap;margin-bottom:12px;font-size:13px;color:var(--muted)}
.jump-top b{color:var(--ink);font-weight:600}
.jump-key{display:flex;gap:14px;flex-wrap:wrap}
.jump-key span{display:inline-flex;align-items:center;gap:6px}
.jump-key i{width:10px;height:10px;border-radius:3px}
.jump-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(56px,1fr));gap:6px}
.jump-grid button{min-height:44px;border:0;border-radius:8px;cursor:pointer;font:600 13px var(--mono);background:var(--track);color:var(--muted)}
.jump-grid button.done,.jump-key .done{background:var(--fill);color:var(--fill-ink)}
.jump-grid button.now,.jump-key .now{background:var(--surface);color:var(--ink);box-shadow:inset 0 0 0 2px var(--ink)}
.jump-key .open{background:var(--track)}
.jump-grid button:disabled{opacity:.35;cursor:default}
@media (max-width:640px){
  .duel{grid-template-columns:minmax(0,1fr);gap:10px}
  .duel-pick{min-height:190px;padding:18px 18px 10px;gap:6px}
  .duel-title{font-size:48px}
  .duel-cta,.duel-key{display:none}
  .listen{padding:0 18px 14px}
  .keys{display:none}
  .jump{margin-top:24px}
}

/* cover art + preview button */
.duel-card{position:relative}
.pv{position:absolute;top:22px;right:22px;width:108px;height:108px;border-radius:14px;overflow:hidden;border:0;padding:0;cursor:pointer;display:block;background:color-mix(in srgb,var(--al-ink,#fff) 16%,transparent);box-shadow:0 10px 26px rgba(0,0,0,.32),0 0 0 1px var(--ring);z-index:1;flex:none}
.pv img{width:100%;height:100%;object-fit:cover;display:block}
.pv-ic{position:absolute;inset:0;display:grid;place-items:center;background:rgba(0,0,0,.26);color:#fff;transition:background .15s}
.pv:hover .pv-ic,.pv.on .pv-ic{background:rgba(0,0,0,.46)}
.pv-ic svg{width:36px;height:36px;filter:drop-shadow(0 1px 5px rgba(0,0,0,.55))}
.pv .i-pause,.pv.on .i-play{display:none}
.pv.on .i-pause{display:block}
.pv-bar{position:absolute;left:0;right:0;bottom:0;height:5px;background:rgba(0,0,0,.45)}
.pv-bar i{display:block;height:100%;width:0;background:#C6F432}
.pv.wait{cursor:default;box-shadow:none;animation:shim 1.3s ease-in-out infinite}
@keyframes shim{50%{opacity:.35}}
@media (max-width:640px){
  /* phones: cover on the right, text beside it, so both songs fit on one screen */
  .pv{top:14px;right:14px;width:76px;height:76px;border-radius:10px}
  .pv-ic svg{width:26px;height:26px}
  .duel-top{min-height:0;padding-right:0}
  .duel-pick{min-height:112px;padding:16px 104px 8px 18px}
  .duel-title{font-size:38px}
  .listen{gap:5px;padding:0 18px 12px}
  .listen a{min-height:32px;padding:0 9px;font-size:12px}
}
.pv.big{position:relative;top:auto;right:auto;width:clamp(120px,24vw,230px);height:auto;aspect-ratio:1;border-radius:18px}
.pv.big .pv-ic svg{width:56px;height:56px}

/* champion */
.champ-hero{border-radius:20px;background:var(--al);color:var(--al-ink);box-shadow:inset 0 0 0 1px var(--ring);padding:clamp(22px,4vw,40px);display:flex;flex-wrap:wrap;gap:20px 28px;align-items:flex-end;justify-content:space-between}
.champ-txt{display:grid;gap:10px;flex:1 1 300px;min-width:0}
.champ-hero .listen{padding:6px 0 0}
.champ-hero .eyebrow{color:inherit;display:flex;align-items:center;gap:8px;margin:0}
.champ-title{font:900 clamp(64px,11vw,140px)/.84 var(--display);text-transform:uppercase;margin:0;overflow-wrap:anywhere}
.champ-hero p{margin:0;font-weight:500}
.champ-body{display:flex;flex-wrap:wrap;gap:24px 40px;margin-top:28px;align-items:flex-start}
.champ-body > div{flex:1 1 320px;min-width:0}
.route{list-style:none;padding:0;margin:14px 0 0}
.route li{display:grid;grid-template-columns:110px minmax(0,1fr) auto;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line);font-size:14px}
.route li > span:first-child{color:var(--muted);font-size:13px}
.route .who{display:flex;align-items:center;gap:8px;min-width:0}
.route .who span:last-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.champ-acts{display:grid;gap:8px}
.champ-acts .row{display:flex;gap:8px;flex-wrap:wrap}
.champ-acts .row .btn{flex:1 1 auto}
.friends-line{display:flex;align-items:center;gap:10px;font-size:14px;color:var(--muted);margin:0 0 6px}
.skipped{text-align:center;padding-block:40px;display:grid;gap:12px;justify-items:center}

/* bracket tree */
.toolbar{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px}
.toolbar .grp{display:flex;flex-wrap:wrap;gap:8px 10px;align-items:center}
.toolbar label{font-size:13px;color:var(--muted);font-weight:600}
.toolbar select{font-weight:600;font-size:14px;background:var(--surface)}
.toolbar .seg{padding:3px;border-radius:10px;background:var(--surface)}
.toolbar .seg button{min-height:32px;font-family:var(--body);font-size:13px}
.confirm{display:inline-flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:13px;color:var(--muted)}
.bk-frame{overflow-x:auto;border:1px solid var(--line);border-radius:16px;background:var(--tree)}
.bk{--colw:132px;--gap:20px;display:flex;align-items:stretch;min-width:max-content;height:calc(max(380px,calc(var(--rows) * 72px)) + 30px);padding:18px 8px 22px}
.bk.big{--colw:124px;--gap:18px}
.side{display:flex}
.side.R{flex-direction:row-reverse}
.col{display:flex;flex-direction:column;width:var(--colw);margin-inline:calc(var(--gap) / 2)}
.col-h{height:30px;flex:none;font:600 11px/1 var(--body);letter-spacing:.12em;text-transform:uppercase;color:var(--muted);text-align:center;white-space:nowrap}
.pair{flex:1;display:flex;flex-direction:column;position:relative}
.m{flex:1;display:flex;align-items:center;position:relative}
.mb{width:100%;display:flex;flex-direction:column;gap:2px;position:relative;z-index:1}
.m::after,.m.in::before{content:"";position:absolute;top:calc(50% - 1px);width:calc(var(--gap) / 2);border-top:2px solid var(--connector)}
.L .m::after{left:100%}
.R .m::after{right:100%}
.L .m.in::before{right:100%}
.R .m.in::before{left:100%}
.pair:not(.solo)::after{content:"";position:absolute;top:25%;bottom:25%;border-left:2px solid var(--connector)}
.L .pair:not(.solo)::after{left:calc(100% + var(--gap) / 2 - 1px)}
.R .pair:not(.solo)::after{right:calc(100% + var(--gap) / 2 - 1px)}
.center{width:200px;margin-inline:calc(var(--gap) / 2);display:flex;flex-direction:column}
.center-body{flex:1;position:relative;display:flex;flex-direction:column;justify-content:center}
.center .m{flex:none}
.center .m::before{content:"";position:absolute;top:calc(50% - 1px);right:100%;width:calc(var(--gap) / 2);border-top:2px solid var(--connector)}
.center .m::after{left:100%}
.plate{position:absolute;left:-30px;right:-30px;bottom:calc(50% + 50px);text-align:center;display:grid;gap:8px;justify-items:center;color:var(--muted)}
.plate-l{font:600 11px var(--body);text-transform:uppercase;letter-spacing:.14em}
.plate-t{font:900 28px/.95 var(--display);text-transform:uppercase;padding:10px 12px;border-radius:10px;max-width:100%;overflow-wrap:anywhere;border:2px dashed var(--line-2);color:var(--muted)}
.plate-t.set{border:0;background:var(--al);color:var(--al-ink);box-shadow:inset 0 0 0 1px var(--ring)}
.left-l{position:absolute;top:calc(50% + 40px);left:0;right:0;display:flex;justify-content:center}
.left-l button{display:inline-flex;align-items:center;gap:6px;background:none;border:0;min-height:44px;font-weight:700;font-size:13px;color:var(--accent-fg);cursor:pointer}
.slot{display:flex;align-items:center;gap:6px;height:28px;width:100%;padding:0 8px;border:0;border-radius:5px;background:var(--al);color:var(--al-ink);font:600 12px/1 var(--body);text-align:left;cursor:pointer;min-width:0;box-shadow:inset 0 0 0 1px var(--ring);transition:opacity .15s}
.slot:disabled{cursor:default;color:var(--al-ink)}
.slot .sd{font:500 10px var(--mono);opacity:.75;flex:none;min-width:14px}
.slot .st{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.slot.lost{opacity:.28}
.slot.won{box-shadow:inset 0 0 0 2px var(--al-ink);font-weight:700}
.slot.empty{background:transparent;box-shadow:none;border:1px dashed var(--line-2);cursor:default}
.center .slot{height:36px;font-size:13px;padding-inline:10px}
.legend.below{margin:14px 0 0;gap:8px 18px}
.legend.below span{display:inline-flex;align-items:center;gap:8px;font-size:13px;color:var(--muted)}

/* compare */
.cmp{display:grid;gap:28px}
.vote{display:grid;gap:16px}
.vote-bar{display:flex;flex-wrap:wrap;gap:4px}
.vote-seg{flex:var(--f) 1 170px;min-height:92px;border-radius:12px;padding:14px 16px;display:flex;flex-direction:column;justify-content:space-between;gap:8px;background:var(--al);color:var(--al-ink);box-shadow:inset 0 0 0 1px var(--ring);min-width:0}
.vote-seg b{font:900 30px/.9 var(--display);text-transform:uppercase;overflow-wrap:break-word;hyphens:auto}
.vote-seg span{display:flex;justify-content:space-between;gap:8px;font-size:13px;font-weight:700}
.vote-seg span em{font-style:normal;font-family:var(--mono);white-space:nowrap}
.vote-seg.wait{background:none;color:var(--muted);box-shadow:none;border:2px dashed var(--line-2)}
.vote-seg.wait b{font-size:22px}
.cmp-cols{display:flex;flex-wrap:wrap;gap:28px;align-items:flex-start}
.cmp-cols > section{flex:1 1 380px;min-width:0;display:grid;gap:12px;align-content:start}
.person{display:grid;grid-template-columns:40px minmax(0,1fr) auto;gap:12px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 12px 12px 14px}
.person .av{width:40px;height:40px;font-size:15px}
.person .nmrow{display:flex;align-items:baseline;gap:8px;min-width:0}
.person .nm{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pill{font:600 11px var(--mono);border-radius:99px;padding:1px 8px;white-space:nowrap;background:var(--track);color:var(--muted)}
.pill.hi{background:var(--fill);color:var(--fill-ink)}
.person .sub{font-size:13px;color:var(--muted);display:flex;align-items:center;gap:8px;min-width:0}
.person .sub b{color:var(--ink);font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.person .meter{height:4px;margin-top:6px;max-width:220px}
.stand{list-style:none;margin:0;padding:0;display:grid;gap:6px}
.stand li{display:grid;grid-template-columns:22px minmax(0,1fr) auto;gap:10px;align-items:center}
.stand .rk{font:600 12px var(--mono);color:var(--muted);text-align:right}
.sbar{position:relative;height:32px;border-radius:7px;overflow:hidden;background:var(--surface);box-shadow:inset 0 0 0 1px var(--line);display:flex;align-items:center;min-width:0}
.sbar i{position:absolute;inset:0 auto 0 0;background:var(--al);box-shadow:inset 0 0 0 1px var(--ring);border-radius:7px}
.sbar span{position:relative;padding:0 10px;font-weight:600;font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--ink)}
.sbar span.on{color:var(--al-ink)}
.stand .pts{font:600 13px var(--mono);text-align:right;white-space:nowrap}
.stand .pts small{font-weight:500;color:var(--muted)}
.splits{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:10px}
.split{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 16px;display:grid;gap:10px}
.split .teams{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);gap:10px;align-items:center}
.split .teams b{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.split .teams b:last-child{text-align:right}
.split .score{font:600 15px var(--mono);font-variant-numeric:tabular-nums}
.split .tug{display:flex;height:8px;gap:3px}
.split .tug i{flex:var(--f);border-radius:99px;background:var(--al);box-shadow:inset 0 0 0 1px var(--ring)}
.split .names{display:flex;justify-content:space-between;gap:12px;font-size:12px;color:var(--muted)}
.split .names span:last-child{text-align:right}
.hidden-box{border:1px dashed var(--line-2);border-radius:16px;padding:24px;color:var(--muted);display:grid;gap:12px;justify-items:start}
.hidden-box b{color:var(--ink);font-size:16px}
.invite{display:grid;gap:6px;font-size:14px;color:var(--muted)}
.invite b{color:var(--ink)}


/* sign in */
.signin{padding-block:56px 40px;display:flex;flex-wrap:wrap;gap:40px 56px;align-items:center}
.signin-copy{flex:999 1 480px;min-width:0}
.signin-copy .hero-h{margin-bottom:20px}
.signin-card{flex:1 1 340px;min-width:0;display:grid;gap:14px;padding:24px}
.or{display:flex;align-items:center;gap:12px;color:var(--muted);font-size:13px}
.or::before,.or::after{content:"";flex:1;border-top:1px solid var(--line)}
.inline-form{display:flex;gap:8px}
.inline-form input{flex:1}

/* account menu */
.me{position:relative}
.me-btn{display:flex;align-items:center;gap:10px;background:none;border:0;padding:0;min-height:44px;color:var(--muted);font:500 14px var(--body);cursor:pointer;min-width:0}
.me-btn:hover{color:var(--ink)}
.menu{position:absolute;right:0;top:calc(100% + 6px);width:min(280px,calc(100vw - 32px));background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;display:grid;gap:12px;z-index:20;box-shadow:0 16px 40px rgba(0,0,0,.35);color:var(--ink)}
.menu .hint{font-size:13px}

/* ask Claude */
.ask{list-style:none;margin:0 0 24px;padding:0;display:grid;gap:12px;max-width:760px}
.ask > li{display:grid;grid-template-columns:36px minmax(0,1fr);gap:14px;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:18px}
.ask .no{width:32px;height:32px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font:600 14px var(--mono)}
.ask b{display:block;font-weight:600;font-size:16px;margin-top:4px}
.ask .hint{margin:4px 0 12px}
.ask .row{display:flex;flex-wrap:wrap;align-items:center;gap:8px 16px}
.ask textarea{width:100%;font:12px/1.5 var(--mono);resize:vertical}
.prompt-out{min-height:140px;margin-top:12px}
.reply{display:grid;gap:10px}
.reply textarea{min-height:150px}
.reply .btn{justify-self:start}

/* landing + create */
.hero.land{align-items:center}
.hero.land .hero-h{margin-bottom:18px}
.lead{font-size:17px;margin-bottom:24px}
.create{padding-block:28px 40px}
.create .artist-h{margin-bottom:24px}

/* notes */
.notes{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px;margin-top:16px}
.note{display:grid;gap:6px;min-width:0}
.note-h{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:600;color:var(--muted);min-width:0}
.note-h span:last-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.note textarea{width:100%;min-height:64px;resize:vertical;font:14px/1.45 var(--body);background:var(--surface)}
@media (max-width:640px){.notes{grid-template-columns:minmax(0,1fr);gap:10px}}
.slot .nd{width:6px;height:6px;border-radius:50%;background:currentColor;opacity:.8;flex:none;margin-left:auto}

/* pick nav + clear */
.play-nav .mid{display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center}

/* jump list */
.jump > summary{display:flex;align-items:baseline;gap:8px 12px;flex-wrap:wrap;cursor:pointer;list-style:none;min-height:44px;align-items:center}
.jump > summary::-webkit-details-marker{display:none}
.jump > summary::before{content:"";width:8px;height:8px;border-right:2px solid var(--muted);border-bottom:2px solid var(--muted);transform:rotate(-45deg);transition:transform .15s;margin-right:4px}
.jump[open] > summary::before{transform:rotate(45deg)}
.jump > summary b{font-weight:600}
.jump .seg{margin:4px 0 12px}
.jump-list{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:6px}
.jm{width:100%;display:grid;grid-template-columns:22px minmax(0,1fr) auto;gap:10px;align-items:center;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:8px 10px;cursor:pointer;color:var(--ink);min-height:56px}
.jm:hover{border-color:var(--muted)}
.jm.now{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
.jm.open{border-style:dashed;border-color:var(--line-2)}
.jm:disabled{opacity:.45;cursor:default}
.jm .jn{font:600 12px var(--mono);color:var(--muted);text-align:right}
.jm .jp{display:grid;gap:3px;min-width:0}
.jm .js{display:flex;align-items:center;gap:7px;font-size:13px;min-width:0}
.jm .js .sw{width:10px;height:10px}
.jm .jt{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.jm .js.w{font-weight:700}
.jm .js.l{opacity:.45}
.jm .js.tbd{color:var(--muted);font-style:italic}
.jm .jst{font:600 11px var(--mono);border-radius:99px;padding:2px 8px;background:var(--track);color:var(--muted);white-space:nowrap}
.jm.done .jst{background:var(--fill);color:var(--fill-ink)}
.jm.now .jst{background:var(--ink);color:var(--bg)}

/* share modal */
.modal-bg{position:fixed;inset:0;z-index:30;background:rgba(5,6,8,.72);display:grid;place-items:center;padding:16px;overflow:auto}
.modal{width:min(440px,100%);background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:18px;display:grid;gap:14px;color:var(--ink)}
.modal-top{display:flex;align-items:center;justify-content:space-between;gap:12px}
.modal img{width:100%;max-height:min(58vh,620px);object-fit:contain;border-radius:12px;background:var(--bg)}
.modal .acts{display:grid;gap:8px}
.modal .row{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.modal .hint{font-size:13px}

.toast{position:fixed;left:50%;bottom:calc(20px + var(--tabbar) + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-weight:600;font-size:14px;z-index:10;max-width:calc(100vw - 32px)}
.loading{color:var(--muted);padding-block:40px}

<body>
<div id="app"><div class="wrap"><p class="loading">Loading brackets…</p></div></div>

<script src="config.js"></script>
<script>
(() => {
'use strict';

const PALETTE = ['#E5383B','#2F54EB','#E33FA8','#23A55A','#E0C33A','#1F2026','#F2751A','#13A4A8','#8B55E8','#9A6B45','#6E7C8C','#B8124F','#FF8FA3','#3D5A80','#A7C957','#6D597A'];
const SIZES = [16, 32, 64];
const GROUP = '__group'; // stands in for a person when showing the group's combined bracket
const LS_PICKS = 'tb.v1.picks', LS_PICKS_REV = 'tb.v1.picksrev', LS_BRACKETS = 'tb.v1.brackets';

const S = {
  mode: 'connecting',            // 'shared' | 'local'
  db: null, user: null, sample: null,
  me: { id: null, name: '', avatarUrl: '', isOwner: false },
  canWrite: true, writeBlocked: false, saveState: '',
  brackets: new Map(), picks: new Map(), loadedB: false,
  mine: {}, mineRev: {}, edited: new Set(),
  prof: {}, ids: new Set(),
  view: 'home', bid: null, tab: 'play', viewing: null, playK: null,
  form: { artist: '', size: 32, paste: '', showPaste: false, kind: 'artist', theme: '', artists: '', m: 16, k: 4, solo: true, mixErr: null },
  draft: null, gen: null, confirm: null, toast: null,
  backend: null,                 // 'firebase' | 'artifact' | null (this device only)
  authState: null, authErr: null, meMenu: false, fb: null, unsubs: [],
  notes: {}, share: null, show: null, jumpOpen: null, jumpRound: null,
};

/* ---------- small helpers ---------- */
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));
function lsGet(k, d) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch { return d; } }
function lsSet(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} }
function inkFor(hex) {
  const h = String(hex || '#888').replace('#', '');
  const [r, g, b] = [0, 2, 4].map(i => parseInt(h.slice(i, i + 2), 16) / 255).map(c => c <= .03928 ? c / 12.92 : Math.pow((c + .055) / 1.055, 2.4));
  // pick whichever of near-black or white has more contrast against the album color
  const L = 0.2126 * r + 0.7152 * g + 0.0722 * b;
  return (L + .05) / .0559 >= 1.05 / (L + .05) ? '#111216' : '#FFFFFF';
}
const alStyle = color => `--al:${esc(color)};--al-ink:${inkFor(color)}`;
function shuffle(a) { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
function toast(msg) { S.toast = msg; render(); clearTimeout(toast.t); toast.t = setTimeout(() => { S.toast = null; render(); }, 1800); }
const spotifyUrl = (artist, t) => 'https://open.spotify.com/search/' + encodeURIComponent(`${t} ${artist}`);
const ytUrl = (artist, t) => 'https://www.youtube.com/results?search_query=' + encodeURIComponent(`${artist} ${t}`);
const appleUrl = (artist, t) => 'https://music.apple.com/us/search?term=' + encodeURIComponent(`${artist} ${t}`);

/* ---------- bracket math ----------
   Matches are numbered round by round: round r has n/2^(r+1) matches,
   match (r, i) is fed by matches (r-1, 2i) and (r-1, 2i+1). Picks are an
   array of length n-1 holding the winning slot index, or null. */
const nRounds = n => Math.round(Math.log2(n));
const off = (n, r) => { let o = 0; for (let k = 0; k < r; k++) o += n >> (k + 1); return o; };
const mCount = (n, r) => n >> (r + 1);
function entrants(n, w, r, i) {
  if (r === 0) return [2 * i, 2 * i + 1];
  const o = off(n, r - 1);
  return [w[o + 2 * i] ?? null, w[o + 2 * i + 1] ?? null];
}
function normalize(n, w) {
  const out = Array.from({ length: n - 1 }, (_, k) => (w && Number.isInteger(w[k]) && w[k] >= 0 && w[k] < n) ? w[k] : null);
  for (let r = 0; r < nRounds(n); r++) {
    const o = off(n, r);
    for (let i = 0; i < mCount(n, r); i++) {
      const [a, b] = entrants(n, out, r, i);
      const v = out[o + i];
      if (v !== null && (a === null || b === null || (v !== a && v !== b))) out[o + i] = null;
    }
  }
  return out;
}
function locate(n, k) { let r = 0; while (k >= off(n, r + 1)) r++; return [r, k - off(n, r)]; }
function roundName(n, r) {
  const left = n >> r;
  return left === 2 ? 'Final' : left === 4 ? 'Semifinals' : left === 8 ? 'Quarterfinals' : 'Round of ' + left;
}
function seedOrder(n) { let o = [1]; while (o.length < n) { const m = o.length * 2; o = o.flatMap(s => [s, m + 1 - s]); } return o; }
const picked = w => w.filter(x => x !== null).length;
const isDone = w => w.length > 0 && w.every(x => x !== null);
function playable(n, w) {
  const ks = [];
  for (let k = 0; k < n - 1; k++) { const [r, i] = locate(n, k); const [a, b] = entrants(n, w, r, i); if (a !== null && b !== null) ks.push(k); }
  return ks;
}

/* ---------- picks ----------
   Brackets can be edited after people start picking. Each edit bumps the bracket's
   rev, and every song slot that changed records that rev in .r. Saved picks carry the
   rev they were made against, so any pick from a match that involves a changed slot
   is dropped when the picks are read. Picks in untouched matches stay. */
function fresh(b, w, rev) {
  if (!Array.isArray(w)) return [];
  rev = rev || 0;
  if (!b.rev || rev >= b.rev) return w;
  if (rev < (b.reset || 0)) return []; // the size changed, so the old picks don't line up with anything
  const n = b.size, ch = new Set();
  b.songs.forEach((s, i) => { if ((s.r || 0) > rev) ch.add(i); });
  if (!ch.size) return w;
  const cur = normalize(n, w), out = cur.slice();
  for (let k = 0; k < n - 1; k++) {
    if (cur[k] === null) continue;
    const [r, i] = locate(n, k), [x, y] = entrants(n, cur, r, i);
    if (ch.has(x) || ch.has(y)) out[k] = null;
  }
  return normalize(n, out);
}
function remotePicks(uid, bid) {
  const e = S.picks.get(uid)?.b?.[bid], b = S.brackets.get(bid);
  return e?.w && b ? fresh(b, e.w, e.rev) : e?.w;
}
function getMine(bid) {
  const b = S.brackets.get(bid); if (!b) return [];
  if (S.edited.has(bid)) {
    const have = S.mineRev[bid] || 0;
    if (have < (b.rev || 0)) setMine(bid, normalize(b.size, fresh(b, S.mine[bid], have)));
    return S.mine[bid];
  }
  const e = S.me.id ? S.picks.get(S.me.id)?.b?.[bid] : null;
  if (e?.w) return normalize(b.size, fresh(b, e.w, e.rev));
  return normalize(b.size, fresh(b, lsGet(LS_PICKS, {})[bid] || [], lsGet(LS_PICKS_REV, {})[bid]));
}
function picksOf(uid, bid) {
  const b = S.brackets.get(bid);
  if (uid === S.me.id || uid === '__me') return getMine(bid);
  if (uid === GROUP) return groupPicks(b, participants(bid));
  return normalize(b.size, remotePicks(uid, bid) || []);
}
function setMine(bid, w) {
  S.mine[bid] = w; S.edited.add(bid);
  S.mineRev[bid] = S.brackets.get(bid)?.rev || 0;
  const all = lsGet(LS_PICKS, {}); all[bid] = w; lsSet(LS_PICKS, all);
  const revs = lsGet(LS_PICKS_REV, {}); revs[bid] = S.mineRev[bid]; lsSet(LS_PICKS_REV, revs);
  queueSave(bid);
}

const dirty = new Set(); let saveTimer = null, chain = Promise.resolve(), myDocKnown = null, retries = 0;
function queueSave(bid) {
  if (S.mode !== 'shared' || !S.me.id || S.writeBlocked) return;
  dirty.add(bid); S.saveState = 'saving';
  clearTimeout(saveTimer); saveTimer = setTimeout(flush, 700);
}
function flush() {
  chain = chain.then(async () => {
    if (!dirty.size) return;
    const ids = [...dirty]; dirty.clear();
    const patch = {};
    for (const bid of ids) { const w = S.mine[bid]; if (w) patch[bid] = { w, done: isDone(w), updatedAt: Date.now(), rev: S.mineRev[bid] || 0 }; }
    const ref = S.db.doc('picks/' + S.me.id);
    try {
      if (myDocKnown === null) myDocKnown = S.picks.has(S.me.id) || (await ref.get()).exists;
      if (myDocKnown) await ref.update({ b: patch });
      else { await ref.set({ b: patch }); myDocKnown = true; }
      S.saveState = dirty.size ? 'saving' : 'saved'; retries = 0;
    } catch (e) {
      const code = e && e.code;
      if (['invalid_argument', 'revoked', 'not_granted', 'capability_disabled', 'capability_removed', 'quota_exceeded'].includes(code)) {
        S.writeBlocked = true; S.saveState = '';
      } else if (retries < 3) {
        retries++; ids.forEach(id => dirty.add(id)); S.saveState = 'retry';
        setTimeout(flush, 2500 * retries);
      } else { S.saveState = 'failed'; }
    }
    updateSaveLabel();
  });
}
function saveLabel() {
  if (S.mode !== 'shared' || !S.me.id || S.writeBlocked) return 'Saved on this device';
  return { saving: 'Saving…', saved: 'Saved', retry: 'Reconnecting…', failed: 'Not saved. Check your connection.' }[S.saveState] || '';
}
function updateSaveLabel() { const el = document.getElementById('save'); if (el) el.innerHTML = `${saveIcon()}<span id="save-label">${esc(saveLabel())}</span>`; else render(); }

/* notes: per person, per bracket, per song slot. Kept on this device and, with accounts, in notes/<userId> */
const LS_NOTES = 'tb.v1.notes';
const notesKey = () => LS_NOTES + '.' + (S.me.id || 'local');
// a slot that got a new song in an edit gets a new key, so a note never lands on the wrong song
const noteKey = (bid, slot) => { const r = S.brackets.get(bid)?.songs?.[slot]?.r; return r ? slot + '@' + r : String(slot); };
const noteOf = (bid, slot) => S.notes?.[bid]?.[noteKey(bid, slot)] || '';
const noteDirty = new Map(); let noteTimer = null;
function loadNotesLocal() { S.notes = lsGet(notesKey(), {}); }
function setNote(bid, slot, text) {
  text = String(text).slice(0, 500); slot = noteKey(bid, slot);
  (S.notes[bid] ||= {})[slot] = text;
  lsSet(notesKey(), S.notes);
  if (S.backend !== 'firebase' || !S.fb || !S.me.id) return;
  if (!noteDirty.has(bid)) noteDirty.set(bid, {});
  noteDirty.get(bid)[slot] = text;
  clearTimeout(noteTimer); noteTimer = setTimeout(flushNotes, 700);
}
async function flushNotes() {
  if (!noteDirty.size || !S.fb || !S.me.id) return;
  const b = Object.fromEntries(noteDirty); noteDirty.clear();
  try { await S.fb.db.doc('notes/' + S.me.id).update({ b }); } catch {} // if the database refuses, the note is still saved on this device
}
async function loadNotesRemote(uid) {
  try {
    const d = await S.fb.db.doc('notes/' + uid).get();
    if (!d.exists || S.me.id !== uid) return;
    for (const [bid, m] of Object.entries(d.data().b || {})) S.notes[bid] = { ...(S.notes[bid] || {}), ...m };
    lsSet(notesKey(), S.notes); render();
  } catch {}
}

/* who has seen everyone's results, per bracket (results stay hidden until you ask, to avoid spoilers) */
const LS_REVEAL = 'tb.v1.reveal';
const revealKey = bid => (S.me.id || 'local') + ':' + bid;
function setReveal(bid, on) { const all = lsGet(LS_REVEAL, {}); if (on) all[revealKey(bid)] = true; else delete all[revealKey(bid)]; lsSet(LS_REVEAL, all); }

function advance() {}
function doPick(k, s, toggle) {
  if (S.viewing) return;
  const bid = S.bid, b = S.brackets.get(bid); if (!b) return;
  const w = getMine(bid).slice();
  const onPlay = S.tab === 'play';
  if (w[k] === s) { if (toggle) clearPick(k); else if (onPlay) playStep(1); return; }
  w[k] = s;
  setMine(bid, normalize(b.size, w));
  if (!onPlay) { render(); return; }
  // show the pick for a moment, then move to the next open match
  S.playK = k; render();
  clearTimeout(advance.t);
  const still = matchMedia('(prefers-reduced-motion: reduce)').matches;
  advance.t = setTimeout(() => {
    if (S.view !== 'bracket' || S.tab !== 'play' || S.bid !== bid) return;
    const cur = getMine(bid), ks = playable(b.size, cur);
    S.playK = ks.find(x => x > k && cur[x] === null) ?? ks.find(x => cur[x] === null) ?? null;
    render();
  }, still ? 0 : 320);
}

function clearPick(k) {
  const bid = S.bid, b = S.brackets.get(bid); if (!b || S.viewing) return;
  const w = getMine(bid).slice(); if (w[k] === null) return;
  const before = picked(w); w[k] = null;
  const next = normalize(b.size, w), extra = before - 1 - picked(next);
  setMine(bid, next);
  clearTimeout(advance.t);
  if (S.tab === 'play') S.playK = k;
  render();
  toast(extra ? `Pick cleared, plus ${plural(extra, 'later pick')} that depended on it` : 'Pick cleared. This match is undecided again.');
}

/* ---------- brackets ---------- */
async function createBracket(doc) {
  if (S.mode === 'shared') {
    const ref = await S.db.collection('brackets').add(doc);
    S.brackets.set(ref.id, doc);
    return ref.id;
  }
  const id = 'b' + Date.now().toString(36);
  const all = lsGet(LS_BRACKETS, {}); all[id] = doc; lsSet(LS_BRACKETS, all);
  S.brackets.set(id, doc);
  return id;
}
async function updateBracket(id, doc) {
  if (S.mode === 'shared') await S.db.doc('brackets/' + id).set(doc);

/* ---------- lineup generation ---------- */
function genPrompt(artist, size) {
  return `Build a ${size}-song tournament bracket lineup for the music artist "${artist}". A group of friends will vote song against song until one track wins.

Pick exactly ${size} songs where ${artist} is the lead or credited main artist. Choose the songs fans would actually argue about: the biggest hits, fan favorites and standout album cuts, spread across their studio albums, mixtapes, EPs and notable singles so every era is represented. No duplicates, remixes, live versions, skits or interludes.

Rank the songs 1 to ${size} by how strong a contender each one is (1 = the favorite to win). Also suggest 8 more songs as alternates, ranked the same way.

Reply with only JSON in this shape:
{"artist":"Canonical Artist Name","albums":[{"name":"Album Title","year":2018}],"songs":[{"title":"Song Title","album":"Album Title","year":2018}],"alternates":[{"title":"Song Title","album":"Album Title","year":2018}]}

Every song's "album" must exactly match a name in "albums". Put non-album singles and features under an album named "Singles". List albums in release order. If you do not recognize the artist, reply {"error":"unknown artist"}.`;
}

function newDraft(artist, size, source) {

function addAlbum(d, name, year) {
  name = String(name || '').trim() || 'Singles';
  let i = d.albums.findIndex(a => a.name.toLowerCase() === name.toLowerCase());
  const y = Number(year) > 1900 && Number(year) < 2100 ? Math.round(Number(year)) : null;
  if (i < 0) { i = d.albums.length; d.albums.push({ name, year: y }); }
  else if (d.albums[i].year == null && y) d.albums[i].year = y;
  return i;
}
function tidyAlbums(d) {
  // order albums by year (Singles last), drop unused ones, and give each a color
  const used = new Set([...d.songs, ...d.bench].map(s => s.a));
  const keep = d.albums.map((a, i) => ({ ...a, old: i })).filter(a => used.has(a.old));
  keep.sort((x, y) => {
    const xs = /^singles/i.test(x.name), ys = /^singles/i.test(y.name);
    if (xs !== ys) return xs ? 1 : -1;
    return (x.year ?? 9999) - (y.year ?? 9999);
  });
  const map = new Map(keep.map((a, i) => [a.old, i]));
  d.albums = keep.map((a, i) => ({ name: a.name, year: a.year, color: a.color || PALETTE[i % PALETTE.length] }));
  d.songs.forEach(s => s.a = map.get(s.a));
  d.bench.forEach(s => s.a = map.get(s.a));

function draftFromClaude(data, artistInput, size) {
  if (!data || typeof data !== 'object' || Array.isArray(data) || data.error) throw { code: 'unknown_artist' };
  const d = newDraft(String(data.artist || artistInput).trim() || artistInput, size, 'claude');
  (Array.isArray(data.albums) ? data.albums : []).forEach(a => a && addAlbum(d, a.name ?? a.title, a.year));
  const seen = new Set();
  const toSong = s => {
    const t = String(s?.title ?? '').trim(); if (!t) return null;
    const key = t.toLowerCase(); if (seen.has(key)) return null; seen.add(key);
    return { t, a: addAlbum(d, s.album, s.year) };
  };
  d.songs = (Array.isArray(data.songs) ? data.songs : []).map(toSong).filter(Boolean);
  d.bench = (Array.isArray(data.alternates) ? data.alternates : []).map(toSong).filter(Boolean);

function draftFromPaste(text, artist, size) {

  if (SIZES.includes(lines.length)) size = lines.length;
  const d = newDraft(artist || 'My bracket', size, 'manual');
  const seen = new Set();
  for (const line of lines) {
    const [t, album] = line.split(/\s+[-–—|]\s+|\t/).map(x => x.trim());
    if (!t || seen.has(t.toLowerCase())) continue;
    seen.add(t.toLowerCase());
    d.songs.push({ t, a: addAlbum(d, album || 'Singles') });

  while (d.songs.length > size) d.bench.unshift(d.songs.pop());
  return tidyAlbums(d);

function draftToDoc(d) {

/* ---------- many-artist lineups ----------

Theme: ${o.theme || 'the artists listed below'}
${who}

For each artist, pick their ${o.k} best songs: the ones fans would actually argue about, spread across their career. ${soloRule(o.solo)} No remixes, live versions, skits or interludes. Also give 2 alternate songs per artist that follow the same rules.

Rank the songs 1 to ${o.k} (1 = the strongest).

Reply with only JSON in this shape:
{"name":"Canonical Artist Name","songs":[{"title":"Song Title","album":"Album or mixtape title, or Single","year":2018}],"alternates":[{"title":"Song Title","album":"Album Title","year":2018}]}

function newMix(o, source) {

  const add = (raw, main) => {
    const s = toMixSong(raw); if (!s || seen.has(s.t.toLowerCase())) return;

  const d = newMix({ ...o, title: String(data.title || '').trim().slice(0, 80) }, 'claude');
  for (const a of data.artists) {

function mixFromPaste(text, o) {

function bracketCard(id, b, st) {
  const counts = new Map(); b.songs.forEach(s => counts.set(s.a, (counts.get(s.a) || 0) + 1));
  const strip = b.albums.map((a, i) => counts.get(i) ? `<i style="--f:${counts.get(i)};--al:${esc(a.color)}"></i>` : '').join('');
  const w = getMine(id), n = picked(w);
  let status, cta;
  if (st === 'done') {
    status = `<div class="champ-line">${ic('trophy', 'sm')}<span>Your champion</span><b>${esc(b.songs[w[b.size - 2]].t)}</b></div>`;
    cta = 'Compare';
  } else if (st === 'progress') {
    const k = playable(b.size, w).find(x => w[x] === null);
    const rn = k === undefined ? 'Skipped matches' : roundName(b.size, locate(b.size, k)[0]);
    status = `<div class="row"><b>${rn}</b><span>${n} / ${b.size - 1}</span></div><div class="meter"><i style="width:${n / (b.size - 1) * 100}%"></i></div>`;
    cta = 'Continue';
  } else { status = `<span class="meta">Not started yet</span>`; cta = 'Start'; }
  const ppl = participants(id).filter(p => !p.me);
  return `<button class="card" data-act="open" data-id="${esc(id)}">
    <div class="strip" aria-hidden="true">${strip}</div>
    <div class="card-body">
      <h3 class="card-h">${esc(b.artist)}</h3>
      <p class="meta">${b.size} songs · ${plural(b.albums.length, isMix(b) ? 'artist' : 'album')} · ${drawLabel(b)}</p>
      <div class="card-status">${status}</div>
      <div class="card-foot"><span class="who">${ppl.length ? `<span class="avs">${ppl.slice(0, 4).map(p => avatar(p.uid)).join('')}</span>${plural(ppl.length, 'friend')}` : 'Just you so far'}</span><span class="cta">${cta}${ic('arrow', 'sm')}</span></div>
    </div></button>`;
}

function draftStepper(step = 2) {
  const li = (n, label) => n < step
    ? `<li class="done"><span class="dot">${ic('check', 'sm')}</span><span class="lbl">${label}</span></li>`
    : `<li class="${n === step ? 'now' : ''}"${n === step ? ' aria-current="step"' : ''}><span class="dot">${n}</span><span class="lbl">${label}</span></li>`;
  return `<ol class="stepper" aria-label="Steps">${li(1, S.form.kind === 'mix' ? 'Artists' : 'Artist')}<li class="bar" aria-hidden="true"></li>${li(2, 'Review lineup')}<li class="bar" aria-hidden="true"></li>${li(3, 'Go live')}</ol>`;
}

  if (d.kind === 'mix') return mixDraftView(d);
  const n = d.songs.length, ok = n === d.size, seeded = d.seeding === 'seeded', chk = draftCheck(d);
  const intro = d.edit ? EDIT_HOW : d.source === 'claude' ? `Claude picked ${plural(n, 'song')} and ranked them. ` : '';
  const how = seeded ? 'Drag to reorder: seeds 1 and 2 start on opposite sides and can only meet in the final.' : 'Songs will be placed at random, so order doesn’t matter.';
  const countMsg = ok ? 'Ready to go' : n < d.size ? `Add ${d.size - n} more` : `Remove ${n - d.size}`;
  const counts = d.albums.map((_, i) => d.songs.filter(s => s.a === i).length);
  const albumOpts = d.albums.map((a, i) => `<option value="${i}">${esc(a.name)}</option>`).join('') + `<option value="new">Other / single</option>`;
  return `${draftTop(d)}

    <p class="eyebrow">${d.edit ? 'Edit the lineup' : 'Review the lineup'}</p>

    <p class="hint">${esc(intro + how)}</p>

    <section class="draft-list" aria-label="Songs">

      <ol class="lineup">${d.songs.map((s, i) => {
        const a = d.albums[s.a];
        return `<li class="lu" draggable="true" data-i="${i}"><span class="grip" aria-hidden="true">${GRIP}</span><span class="rk ${seeded && i < 4 ? 'hi' : ''}">${i + 1}</span><span class="bar" style="${alStyle(a.color)}"></span>
          <span class="tt"><b>${esc(s.t)}</b><small>${draftFlag(chk, d.artist, s.t) || albumLine(a)}</small></span>
          <span class="acts">${draftPlay(d.artist, s.t)}<button class="icon" data-act="mv" data-i="${i}" data-d="-1" aria-label="Move ${esc(s.t)} up" ${i === 0 ? 'disabled' : ''}>${ic('up', 'sm')}</button><button class="icon" data-act="mv" data-i="${i}" data-d="1" aria-label="Move ${esc(s.t)} down" ${i === n - 1 ? 'disabled' : ''}>${ic('down', 'sm')}</button><button class="icon" data-act="bench" data-i="${i}" aria-label="Remove ${esc(s.t)}">${ic('x', 'sm')}</button></span></li>`;
      }).join('')}</ol>
