        ${checkNote(chk)}
        ${n ? `<div><p class="field-l">Songs per album</p><div class="dist">${d.albums.map((a, i) => counts[i] ? `<i style="--f:${counts[i]};--al:${esc(a.color)}" title="${esc(a.name)}: ${counts[i]}"></i>` : '').join('')}</div></div>` : ''}
        <fieldset><legend class="field-l">Size</legend><div class="seg" role="group" aria-label="Bracket size">${SIZES.map(s => `<button type="button" data-act="draft-size" data-n="${s}" aria-pressed="${d.size === s}">${s}</button>`).join('')}</div></fieldset>
        <fieldset><legend class="field-l">Draw</legend>
          <button type="button" class="opt" data-act="seeding" data-v="seeded" aria-pressed="${seeded}"><span class="radio"></span><span><b>Seeded</b><span>Biggest songs meet late. Order matters.</span></span></button>
          <button type="button" class="opt" data-act="seeding" data-v="shuffled" aria-pressed="${!seeded}"><span class="radio"></span><span><b>Random draw</b><span>Anything can meet anything.</span></span></button>
        </fieldset>
        ${S.createErr ? `<p class="err">${esc(S.createErr)}</p>` : ''}
        ${saveBtn(d, ok)}
        ${d.source === 'claude' && !d.edit ? `<button class="btn" data-act="regen">${ic('refresh', 'sm')}Ask Claude for a new lineup</button>` : ''}
      </div>
      <div class="side-card">
        <span class="h3">Alternates</span>
        ${d.bench.length
          ? `<p class="hint" style="font-size:13px;margin-top:-8px">Click one to bring it in.${n >= d.size ? ' It swaps out the lowest seed.' : ''}</p><div class="bench">${d.bench.map((s, i) => `<button class="chip" data-act="unbench" data-i="${i}"><span class="sw" style="${alStyle(d.albums[s.a].color)}"></span>${esc(s.t)}${ic('plus', 'sm')}</button>`).join('')}</div>`
          : `<p class="hint" style="font-size:13px;margin-top:-8px">Removed songs show up here so you can bring them back.</p>`}
        <form id="add-song" class="add-song" autocomplete="off">
          <label class="sr" for="add-title">Song title</label><input type="text" id="add-title" placeholder="Add a song by name">
          <label class="sr" for="add-album">Album</label><select id="add-album">${albumOpts}</select>
          <button class="btn" type="submit">Add</button>
        </form>
      </div>
    </aside>
  </div>`;
}

function mixDraftView(d) {
  const st = mixStatus(d), size = d.m * d.k, grouped = d.seeding === 'grouped', chk = draftCheck(d);
  const intro = d.edit ? EDIT_HOW : d.source === 'claude' ? `Claude picked ${plural(d.groups.length, 'artist')} and ranked them, with ${plural(d.k, 'song')} each. ` : '';
  const how = grouped
    ? `Each artist’s songs face each other first, and from the ${roundName(size, Math.log2(d.k))} on it’s artist vs artist. Artist order matters: the top two can only meet in the final. Song order matters inside each artist too.`
    : 'Songs are placed at random, so artists mix from the first round.';
  const songAct = (gi, si, n, s) => `<span class="acts">${draftPlay(d.groups[gi].name, s.t)}<button class="icon" data-act="s-mv" data-g="${gi}" data-i="${si}" data-d="-1" aria-label="Move ${esc(s.t)} up" ${si === 0 ? 'disabled' : ''}>${ic('up', 'sm')}</button><button class="icon" data-act="s-mv" data-g="${gi}" data-i="${si}" data-d="1" aria-label="Move ${esc(s.t)} down" ${si === n - 1 ? 'disabled' : ''}>${ic('down', 'sm')}</button><button class="icon" data-act="s-bench" data-g="${gi}" data-i="${si}" aria-label="Remove ${esc(s.t)}">${ic('x', 'sm')}</button></span>`;
  const cards = d.groups.map((g, gi) => {
    const n = g.songs.length, need = d.k - n;
    const rows = g.songs.map((s, si) => `<li class="lu flat"><span class="rk ${si === 0 ? 'hi' : ''}">${si + 1}</span><span class="bar" style="${alStyle(g.color)}"></span>
      <span class="tt"><b>${esc(s.t)}</b><small>${draftFlag(chk, g.name, s.t) || esc([s.al, s.y].filter(Boolean).join(' · ')) || '&nbsp;'}</small></span>${songAct(gi, si, n, s)}</li>`).join('');
    const fill = g.loading ? `<p class="gen-live sm"><span class="pulse"></span>Getting songs…</p>`
      : need > 0 ? `<button class="btn sm" data-act="g-fill" data-g="${gi}">${ic('refresh', 'sm')}Get ${plural(need, 'song')} from Claude</button>` : '';
    const bench = g.bench.length ? `<div class="bench">${g.bench.map((s, bi) => `<button class="chip" data-act="s-unbench" data-g="${gi}" data-i="${bi}" title="Bring in ${esc(s.t)}"><span class="sw" style="${alStyle(g.color)}"></span>${esc(s.t)}${ic('plus', 'sm')}</button>`).join('')}</div>` : '';
    return `<li class="grp-card${gi >= d.m ? ' over' : ''}">
      <div class="grp-h"><span class="rk">${gi + 1}</span><span class="sw" style="${alStyle(g.color)}"></span><b>${esc(g.name)}</b><span class="count ${n === d.k ? 'ok' : 'off'}">${n}/${d.k}</span>
        <span class="acts"><button class="icon" data-act="g-mv" data-g="${gi}" data-d="-1" aria-label="Move ${esc(g.name)} up" ${gi === 0 ? 'disabled' : ''}>${ic('up', 'sm')}</button><button class="icon" data-act="g-mv" data-g="${gi}" data-d="1" aria-label="Move ${esc(g.name)} down" ${gi === d.groups.length - 1 ? 'disabled' : ''}>${ic('down', 'sm')}</button><button class="icon" data-act="g-rm" data-g="${gi}" aria-label="Remove ${esc(g.name)}">${ic('x', 'sm')}</button></span></div>
      ${g.err ? `<p class="err" style="font-size:13px">${esc(g.err)}</p>` : ''}
      ${rows ? `<ol class="lineup grp-songs">${rows}</ol>` : `<p class="hint" style="font-size:13px">No songs yet.</p>`}
      ${fill || bench ? `<div class="grp-foot">${fill}${bench}</div>` : ''}
    </li>`;
  }).join('');
  const seg = (list, cur, act, ok) => `<div class="seg c${list.length}" role="group">${list.map(n => `<button type="button" data-act="${act}" data-n="${n}" aria-pressed="${cur === n}" ${ok(n) ? '' : 'disabled'}>${n}</button>`).join('')}</div>`;
  const artistOpts = d.groups.map((g, i) => `<option value="${i}">${esc(g.name)}</option>`).join('');
  return `${draftTop(d)}
  <section class="draft-head">
    <p class="eyebrow">${d.edit ? 'Edit the lineup' : 'Review the lineup'}</p>
    <h1 class="artist-h" id="draft-title">${esc(d.artist)}</h1>
    <p class="hint">${esc(intro + how)}</p>
  </section>
  <div class="draft-body">
    <section class="draft-list" aria-label="Artists">
      <div class="legend">${d.groups.map((g, i) => `<span class="chip${i >= d.m ? ' dim' : ''}"><span class="sw" style="${alStyle(g.color)}"></span>${esc(g.name)} <span class="n">${g.songs.length}</span></span>`).join('')}</div>
      ${d.groups.length ? `<ol class="grp-list">${cards}</ol>` : `<div class="empty-state">No artists yet. Add one on the right.</div>`}
    </section>
    <aside class="draft-side">
      <div class="side-card">
        <div class="title"><span class="h3">${esc(st.msg)}</span><span class="count ${st.ok ? 'ok' : 'off'}">${st.ok ? ic('check', 'sm') : ''}${d.groups.length} / ${d.m}</span></div>
        ${checkNote(chk)}
        <div><label class="field-l" for="mix-title">Bracket name</label><input type="text" id="mix-title" maxlength="80" value="${esc(d.artist)}" style="width:100%"></div>
        <fieldset><legend class="field-l">Artists</legend>${seg(MIX_COUNTS, d.m, 'mix-m', n => mixOk(n, d.k))}</fieldset>
        <fieldset><legend class="field-l">Songs per artist</legend>${seg(MIX_PER, d.k, 'mix-k', n => mixOk(d.m, n))}</fieldset>
        <p class="hint" style="font-size:13px;margin-top:-6px">${size}-song bracket${d.solo ? ' · solo songs only' : ''}</p>
        <fieldset><legend class="field-l">Draw</legend>
          <button type="button" class="opt" data-act="seeding" data-v="grouped" aria-pressed="${grouped}"><span class="radio"></span><span><b>Artist groups</b><span>Each artist’s songs play each other first. The winner reps them against the other artists.</span></span></button>
          <button type="button" class="opt" data-act="seeding" data-v="shuffled" aria-pressed="${!grouped}"><span class="radio"></span><span><b>Random draw</b><span>Any song can meet any song.</span></span></button>
        </fieldset>
        ${S.createErr ? `<p class="err">${esc(S.createErr)}</p>` : ''}
        ${saveBtn(d, st.ok)}
        ${d.source === 'claude' && !d.edit ? `<button class="btn" data-act="regen">${ic('refresh', 'sm')}Ask Claude for a new lineup</button>` : ''}
      </div>
      <div class="side-card">
        <span class="h3">Swap artists</span>
        ${d.removed.length
          ? `<p class="hint" style="font-size:13px;margin-top:-8px">Removed artists. Click one to bring it back.</p><div class="bench">${d.removed.map((g, i) => `<button class="chip" data-act="g-back" data-i="${i}"><span class="sw" style="${alStyle(g.color)}"></span>${esc(g.name)}${ic('plus', 'sm')}</button>`).join('')}</div>`
          : `<p class="hint" style="font-size:13px;margin-top:-8px">Removed artists show up here so you can bring them back.</p>`}
        <form id="add-artist" class="inline-form" autocomplete="off"><label class="sr" for="add-artist-name">Artist</label><input type="text" id="add-artist-name" placeholder="Add an artist"><button class="btn" type="submit">Add</button></form>
        ${d.groups.length ? `<form id="add-song" class="add-song" autocomplete="off">
          <label class="sr" for="add-title">Song title</label><input type="text" id="add-title" placeholder="Add a song by name">
          <label class="sr" for="add-album">Artist</label><select id="add-album">${artistOpts}</select>
          <button class="btn" type="submit">Add</button>
        </form>` : ''}
      </div>
    </aside>
  </div>`;
}

/* bracket page */
function bracketView() {
  const b = S.brackets.get(S.bid);
  const creator = b.createdBy ? nameOf(b.createdBy) : null;
  const others = participants(S.bid).filter(p => !p.me).length;
  const tabs = [['play', 'Pick', 'pick'], ['bracket', 'Bracket', 'bracket'], ['compare', 'Compare', 'compare']];
  let body = '';
  if (S.tab === 'play') body = playTab(b);
  else if (S.tab === 'bracket') body = treeTab(b);
  else body = compareTab(b);
  return `<div class="bk-head">
      <div class="bk-title"><button class="iconbtn" data-act="home" aria-label="All brackets">${ic('back')}</button>
        <div style="min-width:0"><h1>${esc(b.artist)}</h1><p class="meta">${b.size} songs · ${isMix(b) ? plural(b.albums.length, 'artist') + ' · ' : ''}${drawLabel(b)}${creator ? ` · Made by ${esc(creator)}` : b.source === 'import' ? ' · From your template' : ''}</p></div></div>
      <div class="bk-acts">${canManage(b) ? `<button class="btn sm" data-act="edit">${ic('pencil', 'sm')}Edit lineup</button>` : ''}<span class="save" id="save" role="status">${saveIcon()}<span id="save-label">${esc(saveLabel())}</span></span></div>
    </div>
    ${notices()}
    <nav class="tabs" role="tablist" aria-label="Bracket sections">${tabs.map(([k, l, icon]) => `<button role="tab" data-act="tab" data-tab="${k}" aria-selected="${S.tab === k}">${ic(icon, 'lg')}${l}${k === 'compare' && others ? `<span class="badge">${others}</span>` : ''}</button>`).join('')}</nav>
    ${body}`;
}
const saveIcon = () => S.saveState === 'saved' || S.mode !== 'shared' || !S.me.id || S.writeBlocked ? ic('check', 'sm') : '';

/* pick */
function songCard(b, k, s, win, side) {
  const song = b.songs[s], al = albumOf(b, s);
  const cls = win === null ? '' : win === s ? 'won' : 'lost';
  return `<div class="duel-card ${cls}" style="${alStyle(al.color)}">
    <button class="duel-pick" data-act="pick" data-k="${k}" data-s="${s}" aria-pressed="${win === s}" aria-label="${win === s ? 'Your pick: ' + esc(song.t) + '. Click again to clear it' : 'Pick ' + esc(song.t)}" title="${win === s ? 'Click again to clear this pick' : ''}">
      <span class="duel-top"><span class="duel-seed">${song.seed ? seedText(b, song) : `Slot ${s + 1}`}</span><span class="duel-key" aria-hidden="true">${side === 'L' ? '←' : '→'}</span></span>
      <span class="duel-title">${esc(song.t)}</span>
      <span class="duel-album">${songLine(b, s)}</span>
      <span class="duel-cta">${win === s ? `${ic('check', 'sm')}Your pick` : 'Pick this song'}</span>
    </button>
    ${pvBtn(b, s, '', side === 'L' ? '1' : '2')}
    <div class="listen">${listenLinks(songArtist(b, s), song.t, mediaOf(b, s)?.u)}</div>
  </div>`;
}
function currentPlayK(b, w) {
  const ks = playable(b.size, w);
  if (S.playK !== null && ks.includes(S.playK)) return S.playK;
  const open = ks.find(k => w[k] === null);
  return open === undefined ? null : open;
}
function nextLine(b, w, r, i) {
  const n = b.size, R = nRounds(n);
  if (r === R - 1) return 'Winner is your champion';
  const j = i ^ 1, [pa, pb] = entrants(n, w, r, j), pw = w[off(n, r) + j];
  const next = roundName(n, r + 1).toLowerCase().replace(/^round/, 'Round');
  if (pw !== null) return `Winner plays ${esc(b.songs[pw].t)} in the ${next}`;
  if (pa !== null && pb !== null) return `Winner plays ${esc(b.songs[pa].t)} or ${esc(b.songs[pb].t)}`;
  return `Winner moves on to the ${next}`;
}
function playTab(b) {
  const n = b.size, w = getMine(S.bid), R = nRounds(n);
  const k = currentPlayK(b, w);
  if (k === null) return championView(b, w);
  const [r, i] = locate(n, k);
  const [a, c] = entrants(n, w, r, i);
  const ks = playable(n, w);
  mediaWant(b, [a, c]);
  const rounds = Array.from({ length: R }, (_, rr) => {
    const m = mCount(n, rr), o = off(n, rr);
    let d = 0; for (let x = 0; x < m; x++) if (w[o + x] !== null) d++;
    return `<li class="${rr === r ? 'now' : ''}" style="--w:${m}"><span class="lbl"><b>${roundName(n, rr)}</b><span>${d}/${m}</span></span><span class="meter"><i style="width:${d / m * 100}%"></i></span></li>`;
  }).join('');
  const jr = S.jumpRound !== null && S.jumpRound < R - 1 ? S.jumpRound : Math.min(r, R - 2);
  const o = off(n, jr), m = mCount(n, jr);
  const sideOf = (s, win) => s === null ? `<span class="js tbd">To be decided</span>`
    : `<span class="js ${win === null ? '' : win === s ? 'w' : 'l'}"><span class="sw" style="${alStyle(albumOf(b, s).color)}"></span><span class="jt">${esc(b.songs[s].t)}</span></span>`;
  let undecided = 0;
  const jump = Array.from({ length: m }, (_, x) => {
    const kk = o + x, ok = ks.includes(kk), [ea, eb] = entrants(n, w, jr, x), win = w[kk];
    if (ok && win === null) undecided++;
    const st = kk === k ? 'now' : win !== null ? 'done' : ok ? 'open' : 'locked';
    const label = { now: 'Now', done: 'Picked', open: 'Undecided', locked: 'Waiting' }[st];
    return `<li><button type="button" class="jm ${st}" data-act="jump" data-k="${kk}" ${ok ? '' : 'disabled'}${kk === k ? ' aria-current="true"' : ''}><span class="jn">${x + 1}</span><span class="jp">${sideOf(ea, win)}${sideOf(eb, win)}</span><span class="jst">${label}</span></button></li>`;
  }).join('');
  const roundSeg = R > 2 ? `<div class="seg words" role="group" aria-label="Round">${Array.from({ length: R - 1 }, (_, rr) => `<button type="button" data-act="jump-round" data-r="${rr}" aria-pressed="${rr === jr}">${roundName(n, rr).replace('Round of ', 'R').replace('Quarterfinals', 'QF').replace('Semifinals', 'SF')}</button>`).join('')}</div>` : '';
  const jumpOpen = S.jumpOpen ?? window.innerWidth >= 700;
  const noteBox = x => {
    const song = b.songs[x], al = albumOf(b, x);
    return `<div class="note"><label class="note-h" for="note-${x}"><span class="sw" style="${alStyle(al.color)}"></span><span>Your notes on ${esc(song.t)}</span></label>
      <textarea id="note-${x}" data-note="${x}" rows="2" maxlength="500" placeholder="What stood out? Only you can see this.">${esc(noteOf(S.bid, x))}</textarea></div>`;
  };
  const matchup = isMix(b) ? (albumOf(b, a).name === albumOf(b, c).name
    ? `<p class="eyebrow mu">Inside ${esc(albumOf(b, a).name)}’s songs</p>`
    : `<p class="eyebrow mu"><span class="sw" style="${alStyle(albumOf(b, a).color)}"></span>${esc(albumOf(b, a).name)} <span>vs</span> <span class="sw" style="${alStyle(albumOf(b, c).color)}"></span>${esc(albumOf(b, c).name)}</p>`) : '';
  return `<section class="play">
    <ol class="rounds" aria-label="Progress by round" style="--n:${R}">${rounds}</ol>
    ${matchup}<div class="play-meta"><h2 class="round-name">${roundName(n, r)} <span>· Match ${i + 1} of ${mCount(n, r)}</span></h2><span class="next-line">${nextLine(b, w, r, i)}</span></div>
    <div class="duel">${songCard(b, k, a, w[k], 'L')}<div class="vs" aria-hidden="true">VS</div>${songCard(b, k, c, w[k], 'R')}</div>
    <div class="play-nav">
      <button class="btn" data-act="prev" ${ks.indexOf(k) <= 0 ? 'disabled' : ''}>${ic('back', 'sm')}Previous</button>
      <span class="mid">${w[k] !== null ? `<button class="btn sm" data-act="clear-pick" data-k="${k}">${ic('undo', 'sm')}Clear pick</button>` : ''}
        <span class="keys">Use <span class="kbd">←</span><span class="kbd">→</span> to pick, <span class="kbd">1</span><span class="kbd">2</span> to listen, <span class="kbd">S</span> to skip${w[k] !== null ? ', <span class="kbd">⌫</span> to clear' : ''}</span></span>
      <button class="btn" data-act="next">${w[k] === null ? 'Skip' : 'Next'}${ic('arrow', 'sm')}</button>
    </div>
    <div class="notes">${noteBox(a)}${noteBox(c)}</div>
    ${R > 1 ? `<details class="jump" id="jump"${jumpOpen ? ' open' : ''}><summary><b>All ${esc(roundName(n, jr))} matches</b><span class="hint">${undecided ? plural(undecided, 'undecided match', 'undecided matches') : 'All picked'}</span></summary>
      ${roundSeg}<ol class="jump-list">${jump}</ol></details>` : ''}
  </section>`;
}
function championView(b, w) {
  const n = b.size;
  if (!isDone(w)) {
    const left = n - 1 - picked(w);
    return `<section class="skipped"><p class="eyebrow">Skipped matches</p><h2 class="round-name">You skipped ${plural(left, 'match', 'matches')}</h2>
      <div style="display:flex;gap:8px;flex-wrap:wrap;justify-content:center"><button class="btn primary" data-act="first-open">Go to the first one</button><button class="btn" data-act="tab" data-tab="bracket">Open the bracket</button></div></section>`;
  }
  const c = w[n - 2], song = b.songs[c], al = albumOf(b, c);
  mediaWant(b, [c]);
  const route = [];
  for (let k = 0; k < n - 1; k++) if (w[k] === c) {
    const [r, i] = locate(n, k); const [x, y] = entrants(n, w, r, i);
    const lost = x === c ? y : x, la = albumOf(b, lost);
    route.push(`<li><span>${roundName(n, r)}</span><span class="who"><span class="sw" style="${alStyle(la.color)}"></span><span>${esc(b.songs[lost].t)}</span></span><span class="mono">${b.songs[lost].seed ? '#' + b.songs[lost].seed : ''}</span></li>`);
  }
  const st = upsetStats(b, w);
  const nums = st ? `<div class="nums"><div><b>${st.ups}</b><span>${st.ups === 1 ? 'upset' : 'upsets'} in ${st.tot} matches</span></div><div><b>${Math.round((1 - st.ups / st.tot) * 100)}%</b><span>of your picks went with the favorite</span></div></div>
    ${st.big ? `<p class="hint" style="margin-top:12px">Your biggest upset: <b>${esc(b.songs[st.big.v].t)}</b> over <b>${esc(b.songs[st.big.l].t)}</b> in the ${roundName(n, st.big.r).toLowerCase().replace(/^round/, 'Round')}.</p>` : ''}` : '';
  const done = participants(S.bid).filter(p => !p.me && p.done).map(p => p.uid);
  const friends = done.length ? `<p class="friends-line"><span class="avs">${done.slice(0, 4).map(u => avatar(u)).join('')}</span>${esc(listNames(done))} ${done.length === 1 ? 'is' : 'are'} done too.</p>` : '';
  return `<section class="champ">
    <div class="champ-hero" style="${alStyle(al.color)}">
      <div class="champ-txt"><p class="eyebrow">${ic('trophy')}Your champion</p>
        <h2 class="champ-title">${esc(song.t)}</h2>
        <p>${songLine(b, c)}${song.seed ? ` · ${seedText(b, song)}` : ''}</p>
        <div class="listen">${listenLinks(songArtist(b, c), song.t, mediaOf(b, c)?.u)}</div></div>
      ${pvBtn(b, c, 'big')}
    </div>
    <div class="champ-body">
      <div><h3 class="h3" style="font-size:20px">Road to the title</h3><ol class="route">${route.join('')}</ol>${nums}</div>
      <div class="champ-acts">
        ${friends}
        <div class="row"><button class="btn primary lg" data-act="tab" data-tab="compare">Compare with friends</button><button class="btn lg" data-act="share-card">${ic('share', 'sm')}Share card</button></div>
        <div class="row"><button class="btn" data-act="tab" data-tab="bracket">See my bracket</button><button class="btn" data-act="first">Review from the start</button></div>
      </div>
    </div></section>`;
}

/* bracket tree */
function slotBtn(b, s, k, win, editable) {
  if (s === null) return `<div class="slot empty" aria-hidden="true"></div>`;
  const song = b.songs[s], al = albumOf(b, s);
  const cls = win === null ? '' : win === s ? 'won' : 'lost';
  const note = editable ? noteOf(S.bid, s) : '';
  return `<button class="slot ${cls}" style="${alStyle(al.color)}" data-act="pick" data-k="${k}" data-s="${s}" title="${esc(song.t)} · ${esc(al.name)}${note ? ' · Your note: ' + esc(note) : ''}" ${editable ? '' : 'disabled'}><span class="sd">${song.seed ?? ''}</span><span class="st">${esc(song.t)}</span>${note ? '<i class="nd" aria-hidden="true"></i>' : ''}</button>`;
}
function matchBox(b, w, r, i, editable, cmp) {
  const k = off(b.size, r) + i, [a, c] = entrants(b.size, w, r, i);
  const diff = cmp && w[k] !== null && cmp[k] !== null && cmp[k] !== w[k];
  return `<div class="mb${diff ? ' diff' : ''}">${slotBtn(b, a, k, w[k], editable)}${slotBtn(b, c, k, w[k], editable)}</div>`;
}
function tree(b, w, editable, cmp) {
  const n = b.size, R = nRounds(n);
  const short = r => { const left = n >> r; return left === 8 ? 'Quarters' : left === 4 ? 'Semis' : 'Round of ' + left; };
  const side = s => {
    const cols = [];
    for (let r = 0; r < R - 1; r++) {
      const half = mCount(n, r) / 2, start = s === 'L' ? 0 : half;
      const ms = [];
      for (let i = start; i < start + half; i++) ms.push(`<div class="m ${r > 0 ? 'in' : ''}">${matchBox(b, w, r, i, editable, cmp)}</div>`);
      const head = `<div class="col-h">${short(r)}</div>`;
      if (half === 1) cols.push(`<div class="col">${head}<div class="pair solo">${ms[0]}</div></div>`);
      else { const pairs = []; for (let p = 0; p < ms.length; p += 2) pairs.push(`<div class="pair">${ms[p]}${ms[p + 1]}</div>`); cols.push(`<div class="col">${head}${pairs.join('')}</div>`); }
    }
    return `<div class="side ${s}">${cols.join('')}</div>`;
  };
  const c = w[n - 2], left = n - 1 - picked(w);
  const plate = c !== null
    ? `<div class="plate-t set" style="${alStyle(albumOf(b, c).color)}">${esc(b.songs[c].t)}</div>`
    : `<div class="plate-t">To be picked</div>`;
  return `<div class="bk-frame" id="bk-frame"><div class="bk ${n >= 64 ? 'big' : ''}" id="bk" style="--rows:${n / 4}">
    ${side('L')}
    <div class="center"><div class="col-h">Final</div><div class="center-body"><div class="plate">${ic('trophy', 'lg')}<span class="plate-l">Champion</span>${plate}</div>
      <div class="m">${matchBox(b, w, R - 1, 0, editable, cmp)}</div>
      ${editable && left ? `<div class="left-l"><button data-act="tab" data-tab="play">${plural(left, 'pick')} left${ic('arrow', 'sm')}</button></div>` : ''}</div></div>
    ${side('R')}
  </div></div>`;
}
function revealed(bid) {
  return !participants(bid).some(p => !p.me) || !!lsGet(LS_REVEAL, {})[revealKey(bid)];
}
function treeTab(b) {
  const uid = S.viewing, grp = uid === GROUP;
  const mine = getMine(S.bid);
  const w = uid ? picksOf(uid, S.bid) : mine;
  const others = revealed(S.bid) ? participants(S.bid).filter(p => !p.me) : [];
  const opts = [`<option value="">My picks (${picked(mine)} of ${b.size - 1})</option>`, ...others.map(p => `<option value="${esc(p.uid)}" ${p.uid === uid ? 'selected' : ''}>${esc(nameOf(p.uid))}’s picks${p.done ? '' : ` (${p.n} of ${b.size - 1})`}</option>`),
    others.length ? `<option value="${GROUP}" ${grp ? 'selected' : ''}>The group’s bracket</option>` : ''].join('');
  const confirming = S.confirm === 'reset';
  const right = `<button class="btn sm" data-act="share-bracket">${ic('download', 'sm')}Save as image</button>` + (uid ? '' : (picked(w) ? (confirming
    ? `<span class="confirm">Clear all ${picked(w)} picks?<button class="btn sm danger" data-act="reset-yes">Clear picks</button><button class="btn sm" data-act="confirm-no">Keep</button></span>`
    : `<button class="btn sm" data-act="reset">Clear my picks</button>`) : '') + deleteControls(b));
  const zoom = zoomMode();
  const diffs = uid ? w.filter((v, k) => v !== null && mine[k] !== null && v !== mine[k]).length : 0;
  const hint = !uid ? 'Click a song to send it through. Changing an early pick clears the picks after it.'
    : (grp ? 'Read only. Each match goes to the song more of you sent through.' : `Read only. These are ${esc(nameOf(uid))}’s picks.`)
      + (picked(mine) ? ` <span class="diff-key"><i></i>${diffs ? `${plural(diffs, 'match', 'matches')} where you picked differently` : 'You picked the same everywhere'}</span>` : '');
  const top = `<div class="toolbar">
      <div class="grp">${others.length ? `<label for="whose">Showing</label><select id="whose">${opts}</select>` : ''}
        <span class="hint" style="font-size:13px">${hint}</span></div>
      <div class="grp"><div class="seg words" role="group" aria-label="Zoom"><button type="button" data-act="zoom" data-v="fit" aria-pressed="${zoom === 'fit'}">Fit</button><button type="button" data-act="zoom" data-v="full" aria-pressed="${zoom === 'full'}">100%</button></div>${right}</div>
    </div>`;
  const legend = `<div class="legend below">${b.albums.map(a => `<span><span class="sw" style="${alStyle(a.color)}"></span>${albumLine(a)}</span>`).join('')}</div>`;
  return top + tree(b, w, !uid, uid ? mine : null) + legend;
}
function deleteControls(b) {
  if (!canManage(b)) return '';
  if (S.confirm === 'delete') return `<span class="confirm">Delete for everyone?<button class="btn sm danger" data-act="delete-yes">Delete bracket</button><button class="btn sm" data-act="confirm-no">Keep</button></span>`;
  return `<button class="btn sm danger" data-act="delete">Delete bracket</button>`;
}
const zoomMode = () => S.zoom || (window.innerWidth < 700 ? 'full' : 'fit');
function fitTree() {
  const frame = document.getElementById('bk-frame'), bk = document.getElementById('bk');
  if (!frame || !bk) return;
  bk.style.zoom = '';
  if (zoomMode() !== 'fit') return;
  const scale = Math.min(1, (frame.clientWidth - 2) / bk.offsetWidth);
  if (scale < 1) bk.style.zoom = String(Math.max(.55, scale));
}

/* group maths */
// the bracket the group would fill out together: each match goes to the song more people sent through that round
function groupPicks(b, ppl) {
  const n = b.size, R = nRounds(n);
  const reach = Array.from({ length: n }, () => new Array(R).fill(0)), tot = new Array(n).fill(0);
  for (const p of ppl) for (let k = 0; k < n - 1; k++) { const s = p.w[k]; if (s !== null) { reach[s][locate(n, k)[0]]++; tot[s]++; } }
  const w = new Array(n - 1).fill(null);
  for (let r = 0; r < R; r++) for (let i = 0; i < mCount(n, r); i++) {
    const k = off(n, r) + i, [x, y] = entrants(n, w, r, i);
    if (x === null || y === null || !ppl.some(p => p.w[k] !== null)) continue;
    // ties go to the song with more wins overall, then the better seed
    const d = (reach[x][r] - reach[y][r]) || (tot[x] - tot[y]) || ((b.songs[y].seed || 0) - (b.songs[x].seed || 0)) || (y - x);
    w[k] = d >= 0 ? x : y;
  }
  return w;
}
// matchups (in any round) that at least two people faced and split on, closest first
function debates(b, ppl) {
  const n = b.size, map = new Map();
  for (const p of ppl) for (let k = 0; k < n - 1; k++) {
    const v = p.w[k]; if (v === null) continue;
    const [r, i] = locate(n, k), [x, y] = entrants(n, p.w, r, i), key = k + ':' + x + ':' + y;
    let e = map.get(key); if (!e) map.set(key, e = { r, x, y, A: [], B: [] });
    (v === x ? e.A : e.B).push(p.uid);
  }
  const close = e => Math.min(e.A.length, e.B.length) / (e.A.length + e.B.length);
  return [...map.values()].filter(e => e.A.length && e.B.length)
    .sort((p, q) => close(q) - close(p) || (q.A.length + q.B.length) - (p.A.length + p.B.length) || q.r - p.r);
}
// every pair of people and how often they made the same pick, most alike first
function alikePairs(b, ppl) {
  const out = [];
  for (let i = 0; i < ppl.length; i++) for (let j = i + 1; j < ppl.length; j++) {
    const pct = agreement(b, ppl[i].w, ppl[j].w);
    if (pct !== null) out.push({ a: ppl[i].uid, b: ppl[j].uid, pct });
  }
  return out.sort((x, y) => y.pct - x.pct);
}
// an upset is a pick against the ranking: a lower-ranked song, or in lineups a lower-ranked artist
function upsetStats(b, w) {
  const n = b.size; if (!b.songs.every(s => s.seed)) return null;
  const mix = isMix(b);
  let ups = 0, tot = 0, big = null;
  for (let k = 0; k < n - 1; k++) {
    const v = w[k]; if (v === null) continue;
    const [r, i] = locate(n, k), [x, y] = entrants(n, w, r, i), l = v === x ? y : x;
    const sv = b.songs[v], sl = b.songs[l], cross = mix && sv.a !== sl.a;
    const gap = cross ? sv.a - sl.a : sv.seed - sl.seed, scale = cross ? b.albums.length : mix ? (b.per || n) : n;
    if (!gap) continue;
    tot++;
    if (gap > 0) { ups++; const g = gap / scale; if (!big || g > big.g || (g === big.g && r > big.r)) big = { g, r, v, l }; }
  }
  return tot ? { ups, tot, big } : null;
}

/* compare */
function agreement(b, w1, w2) {
  const n = b.size; let same = 0, tot = 0;
  for (let k = 0; k < n - 1; k++) {
    if (w1[k] === null || w2[k] === null) continue;
    const [r, i] = locate(n, k), e1 = entrants(n, w1, r, i), e2 = entrants(n, w2, r, i);
    if (e1[0] !== e2[0] || e1[1] !== e2[1]) continue;
    tot++; if (w1[k] === w2[k]) same++;
  }
  return tot ? Math.round(same / tot * 100) : null;
}
function compareTab(b) {
  const n = b.size, ppl = participants(S.bid);
  const mine = ppl.find(p => p.me);
  const isRevealed = revealed(S.bid);
  const invite = `<button class="btn sm" data-act="invite"${S.backend === 'artifact' ? ` aria-expanded="${!!S.invite}"` : ''}>${ic('invite', 'sm')}${S.backend === 'artifact' ? 'Invite friends' : 'Copy invite link'}</button>`;
  const inviteBox = S.invite ? `<div class="notice invite" style="margin:0"><b>Share this page from the claude.ai Share menu.</b><span>Give friends edit access so their picks are saved where everyone can see them. They’ll find this bracket on the home screen.</span></div>` : '';
  if (!ppl.length) return `<section class="cmp"><div class="sec-top" style="margin:0"><h2 class="h3">Who’s in</h2>${invite}</div>${inviteBox}<div class="empty-state">Nobody has picked yet. Start in the Pick tab, then send this page to your friends.</div></section>`;
  const hasOthers = ppl.some(p => !p.me);
  const eye = hasOthers ? `<button class="btn sm" data-act="${isRevealed ? 'hide-results' : 'peek'}" aria-pressed="${isRevealed}">${ic(isRevealed ? 'eyeOff' : 'eye', 'sm')}${isRevealed ? 'Hide results' : 'Show results'}</button>` : '';
  const showBtn = `<button class="btn primary" data-act="show-start">${PLAY}Start the reveal</button>`;

  const scores = new Map();
  if (mine) for (const p of ppl) if (!p.me && (isRevealed)) { const a = agreement(b, mine.w, p.w); if (a !== null) scores.set(p.uid, a); }
  const best = Math.max(-1, ...scores.values());
  const people = ppl.map(p => {
    const champ = p.champ !== null && p.champ !== undefined ? b.songs[p.champ] : null;
    const show = isRevealed || p.me;
    const ups = show && p.done ? upsetStats(b, p.w) : null;
    const sub = !show ? (p.done ? 'Finished' : `${p.n} of ${n - 1} picked`)
      : champ ? `<span class="sw" style="${alStyle(albumOf(b, p.champ).color)}"></span>Champion <b>${esc(champ.t)}</b>${ups ? `<span class="nowrap">· ${plural(ups.ups, 'upset')}</span>` : ''}`
      : `${p.n} of ${n - 1} picked`;
    const sc = scores.get(p.uid);
    const pill = sc !== undefined ? `<span class="pill ${sc === best && scores.size > 1 ? 'hi' : ''}">${sc}% match${p.done && mine.done ? '' : ' so far'}</span>` : '';
    const act = p.me ? `<button class="btn sm" data-act="tab" data-tab="bracket">My bracket</button>` : show ? `<button class="btn sm" data-act="view" data-uid="${esc(p.uid)}">View bracket</button>` : '<span></span>';
    return `<div class="person">${avatar(p.uid)}<div style="min-width:0"><div class="nmrow"><span class="nm">${esc(nameOf(p.uid))}</span>${pill}</div><div class="sub">${sub}</div>${p.done ? '' : `<div class="meter"><i style="width:${p.n / (n - 1) * 100}%"></i></div>`}</div>${act}</div>`;
  }).join('');
  const pairs = isRevealed && ppl.length > 2 ? alikePairs(b, ppl) : [];
  const pairLine = pr => `${esc(nameOf(pr.a))} and ${esc(nameOf(pr.b))} <b>${pr.pct}%</b>`;
  const alike = pairs.length > 1 ? `<p class="hint alike">Most alike: ${pairLine(pairs[0])}<br>Least alike: ${pairLine(pairs[pairs.length - 1])}</p>` : '';
  const whoCol = `<section><div class="sec-top" style="margin:0"><h2 class="h3">Who’s in</h2><span style="display:flex;gap:8px;flex-wrap:wrap">${eye}${invite}</span></div>${inviteBox}${people}
    ${scores.size ? `<p class="hint" style="font-size:13px">Match % is how often you made the same pick in matchups you both faced.</p>` : ''}${alike}</section>`;

  if (!isRevealed) {
    const box = mine && mine.done
      ? `<b>Results are hidden so nothing gets spoiled.</b><span>On the call? The reveal walks everyone through the biggest debates, then each person’s champion, one at a time. Or just show everything.</span>
        <div style="display:flex;gap:8px;flex-wrap:wrap">${showBtn}<button class="btn" data-act="peek">${ic('eye', 'sm')}Show results</button></div>`
      : `<b>Results are hidden.</b><span>Finish your bracket first so nobody sways your picks. You can still look if you want to.</span>
        <div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn primary" data-act="tab" data-tab="play">Finish my bracket</button><button class="btn" data-act="peek">${ic('eye', 'sm')}Show anyway</button></div>`;
    return `<section class="cmp"><div class="cmp-cols">${whoCol}<section><div class="hidden-box">${box}</div></section></div></section>`;
  }

  const cta = hasOthers ? `<section class="card-box reveal-cta"><div><h2 class="h3">On the call?</h2><p class="hint">Run the reveal: the biggest debates first, then everyone’s champion, one at a time.</p></div>
    <div class="acts">${showBtn}<button class="btn" data-act="view" data-uid="${GROUP}">${ic('bracket', 'sm')}The group’s bracket</button></div></section>` : '';

  // champion vote
  const votes = new Map();
  for (const p of ppl) if (p.done) { const v = votes.get(p.champ) || []; v.push(p.uid); votes.set(p.champ, v); }
  const waiting = ppl.filter(p => !p.done);
  const doneN = ppl.length - waiting.length;
  const segs = [...votes.entries()].sort((x, y) => y[1].length - x[1].length).map(([s, uids]) => {
    const al = albumOf(b, s);
    return `<div class="vote-seg" style="${alStyle(al.color)};--f:${uids.length}"><b>${esc(b.songs[s].t)}</b><span><span>${esc(listNames(uids))}</span><em>${plural(uids.length, 'vote')}</em></span></div>`;
  });
  if (waiting.length) segs.push(`<div class="vote-seg wait" style="--f:${waiting.length}"><b>${waiting.length === 1 ? esc(nameOf(waiting[0].uid)) : `${waiting.length} people`}</b><span><span>Still picking</span></span></div>`);
  const vote = `<section class="card-box vote" aria-label="Champion vote"><div class="sec-top" style="margin:0"><h2 class="h3">The group’s champion</h2><span class="hint">${doneN} of ${ppl.length} finished</span></div><div class="vote-bar">${segs.join('')}</div></section>`;

  // standings: one point per match won, summed over everyone
  const pts = new Array(n).fill(0), champs = new Array(n).fill(0);
  for (const p of ppl) { p.w.forEach(s => { if (s !== null) pts[s]++; }); if (p.champ !== null && p.champ !== undefined) champs[p.champ]++; }
  const order = [...pts.keys()].filter(s => pts[s] > 0).sort((x, y) => pts[y] - pts[x] || champs[y] - champs[x]).slice(0, 10);
  const max = Math.max(1, ...pts);
  const stand = order.map((s, i) => {
    const al = albumOf(b, s), pct = pts[s] / max * 100;
    return `<li><span class="rk">${i + 1}</span><span class="sbar" style="${alStyle(al.color)}"><i style="width:${pct}%"></i><span class="${pct > 60 ? 'on' : ''}">${esc(b.songs[s].t)}</span></span><span class="pts">${pts[s]}${champs[s] ? ` <small>· ${champs[s]}× champ</small>` : ''}</span></li>`;
  }).join('');
  const standCol = `<section><div class="sec-top" style="margin:0"><h2 class="h3">Group standings</h2><span class="hint">1 point per match won, in anyone’s bracket</span></div><ol class="stand">${stand}</ol></section>`;

  // artist standings: only wins over a different artist count, since every artist's own songs knock each other out equally
  let artistCol = '';
  if (isMix(b)) {
    const apts = new Array(b.albums.length).fill(0), achamp = new Array(b.albums.length).fill(0);
    for (const p of ppl) {
      for (let k = 0; k < n - 1; k++) {
        const v = p.w[k]; if (v === null) continue;
        const [r, i] = locate(n, k), [x, y] = entrants(n, p.w, r, i);
        if (x !== null && y !== null && b.songs[x].a !== b.songs[y].a) apts[b.songs[v].a]++;
      }
      if (p.champ !== null && p.champ !== undefined) achamp[b.songs[p.champ].a]++;
    }
    const amax = Math.max(1, ...apts);
    const rows = [...apts.keys()].sort((x, y) => apts[y] - apts[x] || achamp[y] - achamp[x]).map((a, i) => {
      const al = b.albums[a], pct = apts[a] / amax * 100;
      return `<li><span class="rk">${i + 1}</span><span class="sbar" style="${alStyle(al.color)}"><i style="width:${pct}%"></i><span class="${pct > 60 ? 'on' : ''}">${esc(al.name)}</span></span><span class="pts">${apts[a]}${achamp[a] ? ` <small>· ${achamp[a]}× champ</small>` : ''}</span></li>`;
    }).join('');
    artistCol = `<section><div class="sec-top" style="margin:0"><h2 class="h3">Artist standings</h2><span class="hint">1 point per win over another artist, in anyone’s bracket</span></div><ol class="stand">${rows}</ol></section>`;
  }

  // debates: any matchup at least two people faced and split on. Everyone shares the first round; later rounds depend on earlier picks.
  const splitHtml = debates(b, ppl).slice(0, 12).map(({ r, x, y, A, B }) => {
    const a1 = albumOf(b, x), a2 = albumOf(b, y);
    return `<div class="split"><span class="split-r">${roundName(n, r)}</span><div class="teams"><b>${esc(b.songs[x].t)}</b><span class="score">${A.length}–${B.length}</span><b>${esc(b.songs[y].t)}</b></div>
      <div class="tug" aria-hidden="true"><i style="${alStyle(a1.color)};--f:${A.length}"></i><i style="${alStyle(a2.color)};--f:${B.length}"></i></div>
      <div class="names"><span>${esc(listNames(A))}</span><span>${esc(listNames(B))}</span></div></div>`;
  }).join('');
  const debatesSec = `<section><div class="sec-top" style="margin-bottom:12px"><h2 class="h3">Biggest debates</h2><span class="hint">Matchups where the group split, in any round</span></div>
    ${splitHtml ? `<div class="splits">${splitHtml}</div>` : `<p class="hint">${ppl.length > 1 ? 'No split decisions so far.' : 'Splits appear once two people have picked.'}</p>`}</section>`;

  return `<section class="cmp">${cta}${votes.size ? vote : ''}<div class="cmp-cols">${whoCol}${standCol}</div>${artistCol}${debatesSec}</section>`;
}

/* the reveal: a slideshow for the call. Debates build up to everyone's champion, then the group's. */
function showSlides(b, ppl) {
  const done = ppl.filter(p => p.done), slides = [{ t: 'intro' }];

  const w = uid ? picksOf(uid, S.bid) : mine;
  if (kind === 'champ' && !isDone(w)) return;
  if (S.share?.url) URL.revokeObjectURL(S.share.url);
  const both = !uid && isDone(mine); // your own finished bracket can go out as either picture
  S.share = { status: 'making', kind, both }; render();
  try {
    const who = uid === GROUP ? 'The group’s bracket' : uid ? `${nameOf(uid)}’s picks` : S.me.name ? `${S.me.name}’s picks` : 'My picks';
    const blob = kind === 'bracket' ? await bracketImageBlob(b, w, who) : await shareCardBlob(b, w);
    const slug = b.artist.toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '') || 'bracket';
    const file = new File([blob], `${slug}-${kind === 'bracket' ? 'bracket' : 'champion'}.png`, { type: 'image/png' });
    let canFile = false; try { canFile = !!(navigator.canShare && navigator.canShare({ files: [file] })); } catch {}
    if (!S.share || S.share.kind !== kind || S.share.status !== 'making') return;
    const c = w[b.size - 2], champ = c === null ? '' : b.songs[c].t + (isMix(b) ? ' by ' + songArtist(b, c) : '');
    const line = kind === 'bracket' ? `${b.artist} bracket, ${who}${champ ? `. Champion: ${champ}` : ''}` : `My ${b.artist} champion: ${champ}`;
    S.share = { status: 'ready', kind, both, url: URL.createObjectURL(blob), file, canFile, alt: line, text: `${line}. Fill out yours: ${inviteUrl(S.bid)}` };
  } catch { if (S.share && S.share.kind === kind) S.share = { status: 'error', kind, both }; }
  render();
  document.getElementById('share-go')?.focus();
}
function closeShare() { if (S.share?.url) URL.revokeObjectURL(S.share.url); S.share = null; render(); }
function shareModal() {
  const sh = S.share, wide = sh.kind === 'bracket';
  const body = sh.status === 'making' ? `<p class="loading" style="padding:40px 0;text-align:center">Making your ${wide ? 'picture' : 'card'}…</p>`

        <div class="row"><a class="btn${sh.canFile ? '' : ' primary'}" ${sh.canFile ? '' : 'id="share-go" '}href="${sh.url}" download="${esc(sh.file.name)}">${ic('download', 'sm')}Save image</a><button class="btn" data-act="copy-link">${ic('link', 'sm')}Copy link</button></div>

  const kinds = sh.both ? `<div class="seg words" role="group" aria-label="Picture"><button type="button" data-act="share-kind" data-v="champ" aria-pressed="${!wide}">Champion card</button><button type="button" data-act="share-kind" data-v="bracket" aria-pressed="${wide}">Full bracket</button></div>` : '';
  return `<div class="modal-bg"><div class="modal${wide ? ' wide' : ''}" role="dialog" aria-modal="true" aria-labelledby="share-h">
    <div class="modal-top"><h2 class="h3" id="share-h">${wide ? 'Share the bracket' : 'Share your champion'}</h2><button class="iconbtn" id="share-close" data-act="share-close" aria-label="Close">${ic('x', 'sm')}</button></div>

/* ---------- render ---------- */
function render() {
  const app = document.getElementById('app');
  const a = document.activeElement;
  const focus = a && a.id ? { id: a.id, s: a.selectionStart, e: a.selectionEnd } : null;
  app.innerHTML = shell();
  if (focus) {
    const el = document.getElementById(focus.id);
    if (el) { el.focus({ preventScroll: true }); try { if (focus.s != null) el.setSelectionRange(focus.s, focus.e); } catch {} }
  }
  document.body.style.overflow = S.show && S.view === 'bracket' ? 'hidden' : '';
  fitTree();
  pvSync();
  refreshProfiles();
}
window.addEventListener('resize', () => { clearTimeout(fitTree.t); fitTree.t = setTimeout(fitTree, 100); });

/* ---------- events ---------- */
function setHash(h) { if (S.backend === 'artifact') return; try { history.replaceState(null, '', h ? '#' + h : location.pathname + location.search); } catch {} }
function openLinkedBracket() {
  if (S.linkChecked || !S.loadedB) return false;
  S.linkChecked = true;
  const m = location.hash.match(/^#b=([\w-]+)$/);
  if (m && S.brackets.has(m[1])) { openBracket(m[1]); return true; }
  return false;
}
const inviteUrl = bid => location.href.split('#')[0] + '#b=' + bid;
function openBracket(id) { setHash('b=' + id); S.show = null; S.view = 'bracket'; S.bid = id; S.viewing = null; S.playK = null; S.confirm = null; S.invite = false; S.jumpRound = null; S.tab = 'play'; window.scrollTo(0, 0); render(); }
function playStep(dir) {
  const b = S.brackets.get(S.bid), w = getMine(S.bid), ks = playable(b.size, w), cur = currentPlayK(b, w);
  const idx = ks.indexOf(cur);
  if (dir < 0) S.playK = idx > 0 ? ks[idx - 1] : cur;
  else S.playK = idx + 1 < ks.length ? ks[idx + 1] : null;
  clearTimeout(advance.t);
  render();
}

document.addEventListener('click', async e => {
  if (S.share && e.target.classList?.contains('modal-bg')) { closeShare(); return; }
  if (S.meMenu && !e.target.closest('.me')) { S.meMenu = false; render(); }
  const t = e.target.closest('[data-act]'); if (!t) return;
  const act = t.dataset.act, d = S.draft;
  switch (act) {
    case 'me-menu': S.meMenu = !S.meMenu; render(); if (S.meMenu) document.getElementById('my-name')?.focus(); break;
    case 'sign-out': S.meMenu = false; await S.fb?.signOut(); break;
    case 'sign-in-google': {
      S.authErr = null;
      try { await S.fb.google(); } catch (err) { S.authErr = authError(err); render(); }
      break;
    }
    case 'copy-prompt': {
      const g = S.gen;
      try { await navigator.clipboard.writeText(g.prompt); toast('Prompt copied. Paste it into Claude.'); }
      catch { g.show = true; render(); const el = document.getElementById('prompt-out'); if (el) { el.focus(); el.select(); } }
      break;
    }
    case 'show-prompt': S.gen.show = !S.gen.show; render(); break;
    case 'manual-paste': S.gen = null; S.view = 'create'; S.form.showPaste = true; render(); document.getElementById('paste')?.focus(); break;
    case 'home': setHash(''); if (S.share) closeShare(); S.show = null; S.view = 'home'; S.bid = null; S.gen?.ctl?.abort(); S.gen = null; S.confirm = null; render(); break;
    case 'size': S.form.size = +t.dataset.n; render(); break;
    case 'kind': S.form.kind = t.dataset.v; S.form.mixErr = null; render(); break;
    case 'f-m': { const f = S.form; f.m = +t.dataset.n; if (!mixOk(f.m, f.k)) f.k = MIX_PER.find(k => mixOk(f.m, k)); f.mixErr = null; render(); break; }
    case 'f-k': { const f = S.form; f.k = +t.dataset.n; if (!mixOk(f.m, f.k)) f.m = MIX_COUNTS.find(m => mixOk(m, f.k)); render(); break; }
    case 'gen-back': S.gen = null; render(); window.scrollTo(0, 0); break;
    case 'mix-m': setMixM(d, +t.dataset.n); render(); break;
    case 'mix-k': setMixK(d, +t.dataset.n); render(); break;
    case 'g-mv': { const i = +t.dataset.g, j = i + +t.dataset.d, gs = d.groups; if (j >= 0 && j < gs.length) [gs[i], gs[j]] = [gs[j], gs[i]]; render(); document.querySelector(`[data-act="g-mv"][data-g="${j}"][data-d="${t.dataset.d}"]`)?.focus(); break; }
    case 'g-rm': d.removed.unshift(d.groups.splice(+t.dataset.g, 1)[0]); render(); break;
    case 'g-back': {
      const g = d.removed.splice(+t.dataset.i, 1)[0];
      if (d.groups.length >= d.m) d.removed.unshift(d.groups.pop()); // swaps out the lowest-ranked artist
      d.groups.push(g); snap(d); render(); break;
    }
    case 'g-fill': fillArtist(d.groups[+t.dataset.g]); break;
    case 's-mv': { const ss = d.groups[+t.dataset.g].songs, i = +t.dataset.i, j = i + +t.dataset.d; if (j >= 0 && j < ss.length) [ss[i], ss[j]] = [ss[j], ss[i]]; render(); document.querySelector(`[data-act="s-mv"][data-g="${t.dataset.g}"][data-i="${j}"][data-d="${t.dataset.d}"]`)?.focus(); break; }
    case 's-bench': { const g = d.groups[+t.dataset.g]; g.bench.unshift(g.songs.splice(+t.dataset.i, 1)[0]); render(); break; }
    case 's-unbench': {
      const g = d.groups[+t.dataset.g], s = g.bench.splice(+t.dataset.i, 1)[0];
      if (g.songs.length >= d.k) g.bench.unshift(g.songs.pop()); // swaps out that artist's lowest-ranked song
      g.songs.push(s); snap(d); render(); break;
    }
    case 'filter': S.filter = t.dataset.v; render(); break;
    case 'toggle-paste': S.form.showPaste = !S.form.showPaste; render(); break;
    case 'open': openBracket(t.dataset.id); break;
    case 'tab': S.tab = t.dataset.tab; S.confirm = null; S.jumpRound = null; if (t.dataset.tab !== 'bracket') S.viewing = null; clearTimeout(advance.t); render(); window.scrollTo(0, 0); break;
    case 'pick': doPick(+t.dataset.k, +t.dataset.s, true); break;
    case 'clear-pick': clearPick(+t.dataset.k); break;
    case 'new': S.gen?.ctl?.abort(); S.gen = null; S.draft = null; S.createErr = null; setHash(''); S.view = 'create'; render(); window.scrollTo(0, 0); document.getElementById('artist')?.focus(); break;
    case 'hide-results': setReveal(S.bid, false); S.viewing = null; render(); break;
    case 'jump-round': S.jumpRound = +t.dataset.r; render(); break;
    case 'share-card': openShare('champ'); break;
    case 'share-bracket': openShare('bracket'); break;
    case 'share-kind': if (S.share?.kind !== t.dataset.v) openShare(t.dataset.v); break;
    case 'show-start': setReveal(S.bid, true); S.show = { i: 0, open: false }; render(); document.getElementById('show-next')?.focus(); break;
    case 'show-close': S.show = null; render(); break;
    case 'show-next': showStep(1); break;
    case 'show-back': showStep(-1); break;
    case 'show-group': S.show = null; S.viewing = GROUP; S.tab = 'bracket'; render(); window.scrollTo(0, 0); break;
    case 'preview': mediaPlay(t.dataset.key); break;
    case 'share-close': closeShare(); break;
    case 'share-native': {
      const sh = S.share; if (!sh?.file) break;
      try { await navigator.share({ files: [sh.file], text: sh.text }); } catch (err) { if (err?.name !== 'AbortError') toast('Couldn’t open sharing here. Save the image instead.'); }
      break;
    }
    case 'copy-link': {
      const url = inviteUrl(S.bid);
      try { await navigator.clipboard.writeText(url); toast('Link copied'); } catch { toast(url); }
      break;
    }
    case 'prev': playStep(-1); break;
    case 'next': playStep(1); break;
    case 'jump': S.playK = +t.dataset.k; S.jumpRound = null; clearTimeout(advance.t); render(); document.querySelector('.play-meta')?.scrollIntoView({ block: 'nearest' }); break;
    case 'first': { const b = S.brackets.get(S.bid); S.playK = playable(b.size, getMine(S.bid))[0] ?? null; render(); break; }
    case 'first-open': S.playK = null; render(); break;
    case 'view': S.viewing = t.dataset.uid; S.tab = 'bracket'; render(); window.scrollTo(0, 0); break;
    case 'view-mine': S.viewing = null; render(); break;
    case 'zoom': S.zoom = t.dataset.v; render(); break;
    case 'invite': {
      if (S.backend === 'artifact') { S.invite = !S.invite; render(); break; }
      const url = inviteUrl(S.bid);
      try { await navigator.clipboard.writeText(url); toast('Invite link copied. Send it to your friends.'); }
      catch { toast(url); }
      break;
    }
    case 'peek': setReveal(S.bid, true); render(); break;
    case 'reset': S.confirm = 'reset'; render(); break;
    case 'delete': S.confirm = 'delete'; render(); break;
    case 'confirm-no': S.confirm = null; render(); break;
    case 'reset-yes': { const b = S.brackets.get(S.bid); setMine(S.bid, normalize(b.size, [])); S.confirm = null; S.playK = null; render(); break; }
    case 'delete-yes': {
      try { await deleteBracket(S.bid); S.view = 'home'; S.bid = null; S.confirm = null; toast('Bracket deleted'); }
      catch { S.confirm = null; toast('Couldn’t delete it. You may not have permission.'); }
      break;
    }
    case 'stop-gen': S.gen?.ctl?.abort(); break;
    case 'retry-gen': if (S.gen.kind === 'mix') generateMix(S.gen.o, true); else generate(S.gen.artist, S.gen.size, true); break;
    case 'regen': if (d.kind === 'mix') generateMix({ ...d.o, m: d.m, k: d.k }, true); else generate(d.artist, d.size, true); break;
    case 'edit': {
      const b = S.brackets.get(S.bid); if (!b || !canManage(b)) break;
      S.draft = docToDraft(S.bid, b); S.gen = null; S.createErr = null; S.confirm = null; S.view = 'draft';
      setHash(''); clearTimeout(advance.t); render(); window.scrollTo(0, 0); break;
    }
    case 'cancel-draft': if (d?.edit) { const id = d.edit.id; S.draft = null; S.gen = null; S.createErr = null; openBracket(id); break; }
      S.draft = null; S.gen = null; S.view = 'create'; S.createErr = null; render(); break;
    case 'draft-size': d.size = +t.dataset.n; while (d.songs.length > d.size) d.bench.unshift(d.songs.pop()); render(); break;
    case 'seeding': d.seeding = t.dataset.v; render(); break;
    case 'mv': { const i = +t.dataset.i, j = i + +t.dataset.d; if (j >= 0 && j < d.songs.length) [d.songs[i], d.songs[j]] = [d.songs[j], d.songs[i]]; render(); document.querySelector(`[data-act="mv"][data-i="${j}"][data-d="${t.dataset.d}"]`)?.focus(); break; }
    case 'bench': d.bench.unshift(d.songs.splice(+t.dataset.i, 1)[0]); render(); break;
    case 'unbench': {
      const s = d.bench.splice(+t.dataset.i, 1)[0];
      if (d.songs.length >= d.size) d.bench.unshift(d.songs.pop());
      d.songs.push(s); snap(d); render(); break;
    }
    case 'create': {
      if (d.kind === 'mix' ? !mixStatus(d).ok : d.songs.length !== d.size) return;
      t.disabled = true; S.createErr = null;
      if (d.edit) {
        const id = d.edit.id;
        try { await updateBracket(id, editedDoc(d)); S.draft = null; openBracket(id); toast('Lineup saved'); }
        catch (err) {
          S.createErr = err?.code === 'not_granted' ? 'The database didn’t allow the edit. Publish the latest firestore.rules (see the README), then try again.'
            : 'Couldn’t save the changes. Check your connection and try again.';
          render();
        }
        break;
      }
      try { const id = await createBracket(d.kind === 'mix' ? mixToDoc(d) : draftToDoc(d)); S.draft = null; openBracket(id); }
      catch (err) {
        S.createErr = ['invalid_argument', 'not_granted'].includes(err?.code) ? 'You don’t have permission to add brackets here. Ask the page owner for edit access.'
          : err?.code === 'quota_exceeded' ? 'This page is out of storage. Delete an old bracket and try again.'

document.addEventListener('toggle', e => { if (e.target.id === 'jump') S.jumpOpen = e.target.open; }, true);

/* lineup drag and drop (the arrow buttons do the same thing from a keyboard or touch screen) */

  const li = e.target.closest?.('.lu'); if (!li || !S.draft) return;
  dragI = +li.dataset.i; li.classList.add('dragging');

document.addEventListener('submit', async e => {
  e.preventDefault();
  if (e.target.id === 'new-form') {
    const f = S.form;
    const artist = (document.getElementById('artist')?.value || '').trim();
    f.artist = artist;
    const pasteMode = f.showPaste;
    if (pasteMode) {
      const text = document.getElementById('paste')?.value || f.paste;
      if (!text.trim()) { document.getElementById('paste')?.focus(); return; }
      S.draft = draftFromPaste(text, artist, f.size); S.gen = null; S.view = 'draft'; render(); window.scrollTo(0, 0);
    } else {
      if (!artist) { document.getElementById('artist')?.focus(); return; }
      generate(artist, f.size, false); window.scrollTo(0, 0);
    }
  } else if (e.target.id === 'mix-form') {
    const f = S.form;
    f.theme = (document.getElementById('mix-theme')?.value || '').trim();
    const o = { theme: f.theme, m: f.m, k: f.k, solo: f.solo, artists: splitArtists(f.artists) };
    f.mixErr = null;
    if (f.showPaste) {
      const text = document.getElementById('paste')?.value || f.paste;
      if (!text.trim()) { document.getElementById('paste')?.focus(); return; }
      const d = mixFromPaste(text, o);
      if (!d.groups.length) { f.mixErr = 'Couldn’t read that list. Put one song per line as Artist - Song.'; render(); return; }
      S.draft = d; S.gen = null; S.view = 'draft'; render(); window.scrollTo(0, 0);
    } else {
      if (!o.theme && !o.artists.length) { f.mixErr = 'Add a theme, some artists, or both.'; render(); document.getElementById('mix-theme')?.focus(); return; }
      if (o.artists.length > o.m) { f.mixErr = mixCountNote().text; render(); return; }
      generateMix(o, false); window.scrollTo(0, 0);
    }
  } else if (e.target.id === 'reply-form') {
    const g = S.gen, text = document.getElementById('reply')?.value || '';
    g.reply = text;
    if (!text.trim()) { document.getElementById('reply')?.focus(); return; }
    try {
      const data = parseReply(text);
      if (g.kind === 'artist') applyArtist(S.draft, g.group, data);
      else S.draft = g.kind === 'mix' ? mixFromClaude(data, g.o) : draftFromClaude(data, g.artist, g.size);
      S.gen = null; render(); window.scrollTo(0, 0);
    }
    catch (err) { g.err = genError(err?.code); render(); }
  } else if (e.target.id === 'add-artist') {
    const d = S.draft, name = (document.getElementById('add-artist-name')?.value || '').trim().slice(0, 80);
    if (!d || !name) return;
    const ri = d.removed.findIndex(g => g.name.toLowerCase() === name.toLowerCase());
    const g = ri >= 0 ? d.removed.splice(ri, 1)[0] : addGroup(d, name, 'removed');
    d.removed = d.removed.filter(x => x !== g);
    if (!d.groups.includes(g)) d.groups.push(g);
    snap(d); render(); document.getElementById('add-artist-name')?.focus();
    if (g.songs.length < d.k && S.sample) fillArtist(g);
  } else if (e.target.id === 'guest-form') {
    const name = (document.getElementById('guest-name')?.value || '').trim().slice(0, 40);
    if (!name) { document.getElementById('guest-name')?.focus(); return; }
    S.pendingName = name; S.authErr = null;
    try { await S.fb.guest(); } catch (err) { S.pendingName = null; S.authErr = authError(err); render(); }
  } else if (e.target.id === 'rename-form') {
    const name = (document.getElementById('my-name')?.value || '').trim().slice(0, 40);
    if (!name || !S.fb) return;
    try { await S.fb.db.doc('users/' + S.me.id).set({ name, avatarUrl: S.me.avatarUrl || '' }); S.me.name = name; S.meMenu = false; toast('Name saved'); }
    catch { toast('Couldn’t save your name. Try again.'); }
  } else if (e.target.id === 'add-song') {
    const d = S.draft, t = document.getElementById('add-title').value.trim();
    if (!t) return;
    const v = document.getElementById('add-album').value;
    if (d.kind === 'mix') { const g = d.groups[+v]; if (g) fillGroup(d, g, [{ title: t }]); snap(d); render(); document.getElementById('add-title')?.focus(); return; }
    const a = v === 'new' ? addAlbum(d, 'Singles') : +v;
    d.songs.push({ t, a }); tidyAlbums(d); snap(d); render();
    document.getElementById('add-title')?.focus();
  }
});

document.addEventListener('keydown', e => {
  if (S.share) { if (e.key === 'Escape') closeShare(); return; }
  if (S.show) {
    if (e.key === 'Escape') { S.show = null; render(); }
    else if (e.key === 'ArrowRight' || e.key === 'ArrowLeft') { e.preventDefault(); showStep(e.key === 'ArrowRight' ? 1 : -1); }
    else if ((e.key === ' ' || e.key === 'Enter') && !e.target.closest?.('button,a')) { e.preventDefault(); showStep(1); }
    return;
  }
  if (S.view !== 'bracket' || S.tab !== 'play' || S.viewing) return;
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  if (/^(INPUT|TEXTAREA|SELECT)$/.test(document.activeElement?.tagName || '')) return;
  const b = S.brackets.get(S.bid); if (!b) return;
  const w = getMine(S.bid), k = currentPlayK(b, w); if (k === null) return;
  if (e.key === 's' || e.key === 'S') { e.preventDefault(); playStep(1); return; }
  if (e.key === '1' || e.key === '2') { document.querySelectorAll('.duel button.pv')[+e.key - 1]?.click(); return; }
  if ((e.key === 'Backspace' || e.key === 'Delete') && w[k] !== null) { e.preventDefault(); clearPick(k); return; }
  if (e.key !== 'ArrowLeft' && e.key !== 'ArrowRight') return;
  const [r, i] = locate(b.size, k), [a, c] = entrants(b.size, w, r, i);
  e.preventDefault();
  doPick(k, e.key === 'ArrowLeft' ? a : c);
});

/* ---------- boot ---------- */
async function sha256hex(str) {
  const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(str));
  return [...new Uint8Array(buf)].map(v => v.toString(16).padStart(2, '0')).join('');
}
function goLocal() {
  S.mode = 'local';
  loadNotesLocal();
  const all = lsGet(LS_BRACKETS, {});
  S.brackets = new Map(Object.entries(all));
  S.loadedB = true;
  if (!openLinkedBracket()) render();
}

const FIREBASE_SDK = 'https://www.gstatic.com/firebasejs/12.19.0/';
// Wraps Firebase in the same small db shape the claude.ai artifact runtime has, so the rest of the app doesn't care which one it talks to.
async function loadFirebase(cfg) {
  const [A, Au, F] = await Promise.all(['app', 'auth', 'firestore'].map(m => import(FIREBASE_SDK + `firebase-${m}.js`)));
  const app = A.initializeApp(cfg.firebase);
  const auth = Au.getAuth(app), fs = F.getFirestore(app);
  if (cfg.emulators) {
    Au.connectAuthEmulator(auth, 'http://127.0.0.1:9099', { disableWarnings: true });
    F.connectFirestoreEmulator(fs, '127.0.0.1', 8080);
  }
  const codes = { 'permission-denied': 'not_granted', 'resource-exhausted': 'quota_exceeded', 'invalid-argument': 'invalid_argument' };
  const wrap = p => p.catch(e => { throw { code: codes[e?.code] || e?.code || 'error', message: e?.message }; });
  const snap = s => ({ docs: s.docs.map(d => ({ id: d.id, data: () => d.data() })) });
  const db = {
    collection: name => ({
      onSnapshot: (cb, err) => F.onSnapshot(F.collection(fs, name), s => cb(snap(s)), err),
      add: data => wrap(F.addDoc(F.collection(fs, name), data)).then(r => ({ id: r.id })),
    }),
    doc: path => {
      const r = F.doc(fs, path);
      return {
        get: () => wrap(F.getDoc(r)).then(d => ({ exists: d.exists(), data: () => d.data() })),
        set: data => wrap(F.setDoc(r, data)),
        update: data => wrap(F.setDoc(r, data, { merge: true })), // deep-merges maps, so saving one bracket's picks keeps the others
        delete: () => wrap(F.deleteDoc(r)),
      };
    },
  };
  return {
    db,
    onAuth: fn => Au.onAuthStateChanged(auth, fn),
    google: async () => {
      const p = new Au.GoogleAuthProvider();
      try { await Au.signInWithPopup(auth, p); }
      catch (e) {
        if (['auth/popup-blocked', 'auth/operation-not-supported-in-this-environment'].includes(e?.code)) await Au.signInWithRedirect(auth, p);
        else throw e;
      }
    },
    guest: () => Au.signInAnonymously(auth),
    signOut: () => Au.signOut(auth),
  };
}
function authError(e) {
  const c = e?.code || '';
  if (c === 'auth/popup-closed-by-user' || c === 'auth/cancelled-popup-request') return null;
  if (c === 'auth/operation-not-allowed' || c === 'auth/admin-restricted-operation') return 'That way of signing in isn’t turned on for this site yet.';
  if (c === 'auth/unauthorized-domain') return 'This web address isn’t on the site’s sign-in allow list yet.';
  if (c === 'auth/network-request-failed') return 'Couldn’t reach the sign-in service. Check your connection and try again.';
  return 'Couldn’t sign you in. Try again.';
}
function stopListening() { S.unsubs.forEach(u => { try { u(); } catch {} }); S.unsubs = []; }
async function bootFirebase(cfg) {
  S.backend = 'firebase'; S.authState = 'loading'; render();
  let fb;
  try { fb = await loadFirebase(cfg); }
  catch { S.backend = null; S.authState = null; goLocal(); toast('Couldn’t reach the database, so picks stay on this device.'); return; }
  S.fb = fb;
  fb.onAuth(async u => {
    stopListening();
    S.brackets = new Map(); S.picks = new Map(); S.prof = {}; S.mine = {}; S.mineRev = {}; S.edited = new Set(); S.loadedB = false;
    myDocKnown = null;
    if (!u) {
      S.notes = {};
      Object.assign(S, { authState: 'out', mode: 'connecting', db: null, me: { id: null, name: '', avatarUrl: '', isOwner: false }, view: 'home', bid: null, meMenu: false });
      render(); return;
    }
    Object.assign(S, { authState: 'in', mode: 'shared', db: fb.db, canWrite: true, writeBlocked: false, authErr: null });
    S.me = { id: u.uid, name: S.pendingName || u.displayName || '', avatarUrl: u.photoURL || '', isOwner: false, anon: u.isAnonymous };
    const pending = S.pendingName; S.pendingName = null;
    loadNotesLocal(); loadNotesRemote(u.uid);
    // admins (who can make brackets) are listed in config.js as SHA-256 hashes of their Google email
    if (!u.isAnonymous && u.email && u.emailVerified && (cfg.admins || []).length) {
      sha256hex(u.email.trim().toLowerCase()).then(h => { if (S.me.id === u.uid && cfg.admins.includes(h)) { S.me.admin = true; render(); } }).catch(() => {});
    }
    S.unsubs.push(fb.db.collection('users').onSnapshot(snap => {
      for (const d of snap.docs) { const p = d.data(); S.prof[d.id] = { name: p.name || '', avatarUrl: p.avatarUrl || '' }; }
      const mine = S.prof[u.uid];
      if (mine) { S.me.name = mine.name || S.me.name; S.me.avatarUrl = mine.avatarUrl || S.me.avatarUrl; }
      render();
    }, () => {}));
    S.unsubs.push(fb.db.collection('brackets').onSnapshot(snap => {
      S.brackets = new Map(snap.docs.map(d => [d.id, d.data()]));
      S.loadedB = true;
      if (S.view === 'bracket' && !S.brackets.has(S.bid)) { S.view = 'home'; S.bid = null; setHash(''); }
      if (!openLinkedBracket()) render();
    }, () => { S.loadedB = true; render(); }));
    S.unsubs.push(fb.db.collection('picks').onSnapshot(snap => {
      S.picks = new Map(snap.docs.map(d => [d.id, d.data()]));
      if (S.picks.has(u.uid)) myDocKnown = true;
      render();
    }, () => {}));
    render();
    // keep this person's name and photo where friends can see them
    try {
      const ref = fb.db.doc('users/' + u.uid), cur = await ref.get(), had = cur.exists ? cur.data() : {};
      const name = (pending || had.name || u.displayName || 'Guest').trim().slice(0, 40);
      const avatarUrl = u.photoURL || had.avatarUrl || '';
      if (name !== had.name || avatarUrl !== (had.avatarUrl || '')) await ref.set({ name, avatarUrl });
    } catch {}
  });
}

async function boot() {
  render();
  const cfg = window.TB_CONFIG || {};
  if (cfg.firebase) return bootFirebase(cfg);
  const c = window.claude;
  if (!c || typeof c.use !== 'function') return goLocal();
  S.backend = 'artifact';
  const [db, user, sample] = await Promise.all([c.use('db'), c.use('user'), c.use('sample')]);
  S.sample = sample; S.user = user;
  if (user) {
    try {
      const me = await user.me();
      S.me = { id: me.id, name: me.name, avatarUrl: me.avatarUrl, isOwner: me.isOwner };
      const can = await user.can('data.write');
      S.canWrite = can !== false;
    } catch {}
  }
  if (!db) return goLocal();
  S.db = db; S.mode = 'shared';
  loadNotesLocal();
  db.collection('brackets').onSnapshot(snap => {
    S.brackets = new Map(snap.docs.map(d => [d.id, d.data()]));
    S.loadedB = true;
    if (!openLinkedBracket()) render();
  }, () => { S.loadedB = true; render(); });
  db.collection('picks').onSnapshot(snap => {
    S.picks = new Map(snap.docs.map(d => [d.id, d.data()]));
    if (S.me.id && S.picks.has(S.me.id)) myDocKnown = true;
    render();
  }, () => {});
  render();
}
boot();
})();
